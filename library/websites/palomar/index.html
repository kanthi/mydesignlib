            'playfair': ['"Playfair Display"', 'serif'],
            'oswald': ['Oswald', 'sans-serif'],
            'montserrat': ['Montserrat', 'sans-serif'],
            'roboto-slab': ['"Roboto Slab"', 'serif'],
            'raleway': ['Raleway', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Helvetica Neue Light', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Animations (global CSS, exact) */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-down {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-up   { animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-fade-down { animation: fade-down 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }

    .stagger-1 { animation-delay: 0ms; }
    .stagger-2 { animation-delay: 120ms; }
    .stagger-3 { animation-delay: 240ms; }
    .stagger-4 { animation-delay: 360ms; }
    .stagger-5 { animation-delay: 480ms; }
    .stagger-6 { animation-delay: 600ms; }
  </style>
</head>
<body>
  <!-- Root App Wrapper -->
  <div class="font-helvetica-neue text-brand-dark antialiased">
    <!-- Navbar -->
    <header id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-transparent">
      <div class="max-w-7xl mx-auto px-6 lg:px-8">
        <div class="relative flex items-center h-16 md:h-20">
          <!-- Desktop Left Links -->
          <div class="hidden md:flex items-center gap-8 animate-fade-down stagger-1">
            <button type="button" class="text-sm text-brand-dark tracking-wide uppercase hover:opacity-70 transition-opacity flex items-center gap-1">
              Solutions
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <a href="#plans" class="text-sm text-brand-dark tracking-wide uppercase hover:opacity-70 transition-opacity">Plans</a>
            <a href="#news" class="text-sm text-brand-dark tracking-wide uppercase hover:opacity-70 transition-opacity">News</a>
          </div>

          <!-- Center Logo (Absolute Centered) -->
          <a href="#" class="absolute left-1/2 -translate-x-1/2 flex items-center gap-2 animate-fade-down stagger-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-brand-dark fill-brand-dark"><path d="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/></svg>
            <span class="text-xl text-brand-dark tracking-tight font-helvetica-neue">Palomar</span>
          </a>

          <!-- Desktop CTA (Right) -->
          <a href="#try" class="hidden md:inline-flex items-center ml-auto px-5 py-2.5 bg-brand-dark text-white text-sm tracking-wide uppercase rounded-full hover:bg-brand-green transition-colors animate-fade-down stagger-3">
            Try It Free
          </a>

          <!-- Mobile Hamburger -->
          <button id="hamburgerBtn" type="button" class="md:hidden ml-auto z-50 w-10 h-10 relative flex items-center justify-center focus:outline-none" aria-label="Toggle menu">
            <div class="relative w-6 h-5">
              <span id="barTop" class="absolute left-0 top-[6px] w-6 h-[2px] bg-brand-dark rounded transition-all duration-300 ease-[cubic-bezier(0.68,-0.6,0.32,1.6)]"></span>
              <span id="barBottom" class="absolute left-0 top-[13px] w-6 h-[2px] bg-brand-dark rounded transition-all duration-300 ease-[cubic-bezier(0.68,-0.6,0.32,1.6)]"></span>
            </div>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="md:hidden fixed inset-0 bg-brand-cream z-40 transition duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] opacity-0 pointer-events-none">
      <div id="mobileInner" class="flex flex-col items-center justify-center h-full gap-8 transition duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] delay-100 -translate-y-8 opacity-0">
        <a href="#solutions" class="mobile-nav-link text-3xl text-brand-dark tracking-tight hover:opacity-70 transition-opacity">Solutions</a>
        <a href="#plans" class="mobile-nav-link text-3xl text-brand-dark tracking-tight hover:opacity-70 transition-opacity">Plans</a>
        <a href="#news" class="mobile-nav-link text-3xl text-brand-dark tracking-tight hover:opacity-70 transition-opacity">News</a>
        <a href="#try" class="mobile-nav-link mt-4 inline-flex items-center px-8 py-3.5 bg-brand-dark text-white text-lg tracking-wide rounded-full hover:bg-brand-green transition-colors">Try It Free</a>
      </div>
    </div>

    <!-- Hero -->
    <section class="relative w-full h-screen min-h-[700px] overflow-hidden bg-brand-cream">
      <!-- Video Layer (No dark overlay, no gradient, no poster image) -->
      <div class="absolute inset-0">
        <video
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260820_010308_b1636845-4c15-4ab6-b0c9-9a29bfb0c6e3.mp4"
          autoplay
          muted
          loop
          playsinline
          class="w-full h-full object-cover object-bottom"
        ></video>
      </div>

      <!-- Content Column -->
      <div class="relative z-10 flex flex-col items-start max-w-7xl mx-auto pt-28 md:pt-36 px-6 lg:px-8">
        <!-- Announcement Pill -->
        <a href="#announcement" class="inline-flex items-center gap-2 px-4 py-2 rounded-full border border-brand-dark/15 bg-white/60 backdrop-blur-sm hover:bg-white/80 transition-colors mb-5 md:mb-6 animate-fade-up stagger-3">
          <span class="text-sm text-brand-dark">Live for everyone today! Offering $1MM in credits.</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-brand-dark"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>

        <!-- Headline -->
        <h1 class="text-left text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-brand-dark leading-[1.05] tracking-tight max-w-4xl font-helvetica-neue animate-fade-up stagger-4">
          One unified system to build,
          <br class="hidden sm:block" /> test, ship, and observe LLMs
        </h1>

        <!-- Trusted By -->
        <div class="w-full mt-8 md:mt-10 animate-fade-up stagger-5">
          <div class="text-left text-xs tracking-[0.25em] uppercase text-brand-dark/50 mb-6 md:mb-8 font-helvetica-neue">
            Backed by
          </div>
          <div class="flex flex-wrap items-center justify-start gap-6 md:gap-12 lg:gap-16 animate-fade-up stagger-6">
            <span class="font-playfair text-lg md:text-xl lg:text-2xl text-brand-dark/80 whitespace-nowrap">Meridian</span>
            <span class="font-oswald uppercase text-lg md:text-xl lg:text-2xl text-brand-dark/80 whitespace-nowrap">STELLEX</span>
            <span class="font-montserrat text-lg md:text-xl lg:text-2xl text-brand-dark/80 whitespace-nowrap">Luminar</span>
            <span class="font-roboto-slab uppercase text-lg md:text-xl lg:text-2xl text-brand-dark/80 whitespace-nowrap">OVERLAND</span>
            <span class="font-raleway text-lg md:text-xl lg:text-2xl text-brand-dark/80 whitespace-nowrap">Kinetic</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    (function () {
      'use strict';

      // 1. Navbar Scroll Transition
      var navbar = document.getElementById('navbar');
      function handleScroll() {
        if (window.scrollY > 20) {
          navbar.classList.remove('bg-transparent');
          navbar.classList.add('bg-brand-cream/90', 'backdrop-blur-md', 'shadow-sm');
        } else {
          navbar.classList.remove('bg-brand-cream/90', 'backdrop-blur-md', 'shadow-sm');
          navbar.classList.add('bg-transparent');
        }
      }
      window.addEventListener('scroll', handleScroll, { passive: true });
      handleScroll();

      // 2. Mobile Hamburger and Overlay Controller
      var hamburgerBtn = document.getElementById('hamburgerBtn');
      var mobileOverlay = document.getElementById('mobileOverlay');
      var mobileInner = document.getElementById('mobileInner');
      var barTop = document.getElementById('barTop');
      var barBottom = document.getElementById('barBottom');
      var navLinks = document.querySelectorAll('.mobile-nav-link');
      var isOpen = false;

      function setMenu(open) {
        isOpen = open;
        if (isOpen) {
          // Animate Hamburger
          barTop.classList.add('rotate-45', 'translate-y-[5px]');
          barBottom.classList.add('-rotate-45');
          // Open Overlay
          mobileOverlay.classList.remove('opacity-0', 'pointer-events-none');
          mobileOverlay.classList.add('opacity-100', 'pointer-events-auto');
          mobileInner.classList.remove('-translate-y-8', 'opacity-0');
          mobileInner.classList.add('translate-y-0', 'opacity-100');
          // Lock body scroll
          document.body.style.overflow = 'hidden';
        } else {
          // Reset Hamburger
          barTop.classList.remove('rotate-45', 'translate-y-[5px]');
          barBottom.classList.remove('-rotate-45');
          // Close Overlay
          mobileOverlay.classList.remove('opacity-100', 'pointer-events-auto');
          mobileOverlay.classList.add('opacity-0', 'pointer-events-none');
          mobileInner.classList.remove('translate-y-0', 'opacity-100');
          mobileInner.classList.add('-translate-y-8', 'opacity-0');
          // Unlock body scroll
          document.body.style.overflow = '';
        }
      }

      hamburgerBtn.addEventListener('click', function () {
        setMenu(!isOpen);
      });

      navLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          setMenu(false);
        });
      });
    })();
  </script>
</body>
</html>
