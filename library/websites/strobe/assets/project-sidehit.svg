<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0A0B0E"/>
  <!-- Isometric Grid -->
  <g stroke="#1F242D" stroke-width="1">
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="400"/>
    <line x1="0" y1="400" x2="800" y2="100"/>
  </g>
  <!-- Cyberpunk / 3D Game Cube Geometry -->
  <g transform="translate(400, 230)">
    <!-- Top Face -->
    <polygon points="0,-120 140,-50 0,20 -140,-50" fill="#CCFF00" fill-opacity="0.9"/>
    <!-- Right Face -->
    <polygon points="0,20 140,-50 140,110 0,180" fill="#1E232A" stroke="#CCFF00" stroke-width="1.5"/>
    <!-- Left Face -->
    <polygon points="0,20 -140,-50 -140,110 0,180" fill="#12161C" stroke="#CCFF00" stroke-width="1.5"/>
    <!-- Glowing Wireframe Core -->
    <circle cx="0" cy="30" r="35" fill="#CCFF00" fill-opacity="0.15"/>
    <circle cx="0" cy="30" r="15" fill="#CCFF00"/>
  </g>
  <!-- Text Badges -->
  <rect x="40" y="40" width="160" height="28" rx="4" fill="#1E232A" stroke="#2E3642"/>
  <text x="55" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#CCFF00">GAME ENGINE 4.2</text>
  <text x="40" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">SIDEHIT BOOMBOX</text>
  <text x="40" y="465" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7A8494">MOTION BRANDING &amp; REAL-TIME UI</text>
</svg>
