<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#skyGrad)"/>

  <!-- Distant Alaska Mountain Peaks -->
  <polygon points="40,240 180,90 320,240" fill="#CBD5E1"/>
  <polygon points="180,90 140,140 220,140" fill="#FFFFFF"/>
  <polygon points="220,240 380,60 540,240" fill="#94A3B8"/>
  <polygon points="380,60 330,120 430,120" fill="#FFFFFF"/>

  <!-- Evergreen Pine Tree Ridge -->
  <polygon points="80,260 100,210 120,260" fill="#1B4D3E"/>
  <polygon points="110,270 130,220 150,270" fill="#163E32"/>
  <polygon points="450,260 470,200 490,260" fill="#1B4D3E"/>
  <polygon points="480,270 500,215 520,270" fill="#163E32"/>

  <!-- Ground / Snow Drift -->
  <path d="M 0 250 Q 200 230 400 260 T 600 240 L 600 400 L 0 400 Z" fill="#F1F5F9"/>

  <!-- Timber Cabin / Home -->
  <g transform="translate(180, 160)">
    <!-- Cabin Base -->
    <rect x="50" y="80" width="140" height="90" fill="#854D0E" rx="4"/>
    <!-- Timber Planks -->
    <line x1="50" y1="100" x2="190" y2="100" stroke="#713F12" stroke-width="1.5"/>
    <line x1="50" y1="120" x2="190" y2="120" stroke="#713F12" stroke-width="1.5"/>
    <line x1="50" y1="140" x2="190" y2="140" stroke="#713F12" stroke-width="1.5"/>
    <!-- Pitched Roof -->
    <polygon points="30,80 120,15 210,80" fill="#0F2137"/>
    <!-- Chimney & Smoke -->
    <rect x="150" y="25" width="20" height="35" fill="#475569"/>
    <circle cx="160" cy="15" r="5" fill="#E2E8F0" fill-opacity="0.7"/>
    <circle cx="165" cy="5" r="8" fill="#E2E8F0" fill-opacity="0.5"/>
    <!-- Windows with Warm Light -->
    <rect x="70" y="105" width="30" height="30" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <rect x="140" y="105" width="30" height="30" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Door -->
    <rect x="108" y="115" width="24" height="55" rx="2" fill="#451A03"/>
  </g>

  <!-- Protection Shield Floating Ring -->
  <circle cx="300" cy="230" r="160" stroke="#2B82FB" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.4"/>
  <rect x="360" y="300" width="200" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="385" cy="330" r="12" fill="#2B82FB" fill-opacity="0.1"/>
  <path d="M 380 330 L 383 333 L 391 326" stroke="#2B82FB" stroke-width="2" stroke-linecap="round"/>
  <text x="408" y="326" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F2137">Sub-Zero Freeze Endorsement</text>
  <text x="408" y="342" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2B82FB">100% PIPE &amp; ROOF REPLACEMENT</text>
</svg>
