<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#0066ff"/>
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0044cc" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cce6ff"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66b2ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3399ff"/>
      <stop offset="100%" stop-color="#004499"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Isometric Grid Pattern Background -->
  <path d="M -200,337 L 600,-112 L 1400,337 L 600,787 Z" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M 600,-112 L 600,787" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <path d="M -200,337 L 1400,337" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Connecting Isometric Network Lines -->
  <path d="M 600,220 L 780,310 L 600,400 L 420,310 Z" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 780,310 L 960,220 L 960,340" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M 420,310 L 240,220 L 240,340" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M 600,400 L 600,520" fill="none" stroke="#00f0ff" stroke-width="3"/>

  <!-- Isometric Nodes / Cubes -->
  <!-- Center Main Node -->
  <g transform="translate(600, 280)">
    <!-- Top Face -->
    <polygon points="0,-40 70,-5 0,30 -70,-5" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="-70,-5 0,30 0,90 -70,55" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="0,30 70,-5 70,55 0,90" fill="url(#cubeRight)" />
  </g>

  <!-- Right Node -->
  <g transform="translate(780, 220)">
    <polygon points="0,-25 45,-3 0,18 -45,-3" fill="url(#cubeTop)" />
    <polygon points="-45,-3 0,18 0,55 -45,34" fill="url(#cubeLeft)" />
    <polygon points="0,18 45,-3 45,34 0,55" fill="url(#cubeRight)" />
  </g>

  <!-- Left Node -->
  <g transform="translate(420, 220)">
    <polygon points="0,-25 45,-3 0,18 -45,-3" fill="url(#cubeTop)" />
    <polygon points="-45,-3 0,18 0,55 -45,34" fill="url(#cubeLeft)" />
    <polygon points="0,18 45,-3 45,34 0,55" fill="url(#cubeRight)" />
  </g>

  <!-- Bottom Node -->
  <g transform="translate(600, 440)">
    <polygon points="0,-25 45,-3 0,18 -45,-3" fill="url(#cubeTop)" />
    <polygon points="-45,-3 0,18 0,55 -45,34" fill="url(#cubeLeft)" />
    <polygon points="0,18 45,-3 45,34 0,55" fill="url(#cubeRight)" />
  </g>

  <!-- Floating Data Badges -->
  <circle cx="600" cy="200" r="18" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="780" cy="170" r="14" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="420" cy="170" r="14" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="600" cy="390" r="14" fill="#00f0ff" filter="url(#glow)"/>
</svg>
