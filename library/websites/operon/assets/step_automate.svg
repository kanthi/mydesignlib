      <polygon points="-18,-6 0,4 0,22 -18,12" fill="#FFFFFF" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" />
      <text transform="matrix(0.866025, 0.5, 0, 1, -12, 11)" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0F172A">Work</text>
      <polygon points="18,-6 0,4 0,22 18,12" fill="#E2E8F0" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" />
    </g>
  </g>

