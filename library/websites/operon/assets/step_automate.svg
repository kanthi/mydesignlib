<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blue-pawn-head" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" /><stop offset="50%" stop-color="#C7D2FE" /><stop offset="100%" stop-color="#6366F1" />
    </radialGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- 1. Hourglass Light Beam Funnel -->
  <path d="M 80 55 C 105 95 105 110 75 145 L 165 145 C 135 110 135 95 160 55 Z" fill="url(#beam-grad)" />
  <path d="M 80 55 C 105 95 105 110 75 145" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3 3" />
  <path d="M 160 55 C 135 95 135 110 165 145" fill="none" stroke="#818CF8" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- 2. Top Dais with 3D Open Cardboard Box "Work" -->
  <g transform="translate(120, 55)">
    <path d="M -40 0 A 40 18 0 0 0 40 0 L 40 6 A 40 18 0 0 1 -40 6 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="40" ry="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />

