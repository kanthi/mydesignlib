<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tunnel-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="arch-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- 1. Conveyor Belt along 30° Axis -->
  <!-- Width: 32px in perspective -->
  <polygon points="10,25 38,9 312,148 284,164" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" />
  <line x1="24" y1="17" x2="298" y2="156" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 3" />

  <!-- 2. Incoming Flat Task Tiles (Back-Left) -->
  <!-- Tile 1: Draft -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 45, 34)">
    <rect x="-14" y="-12" width="28" height="24" rx="5" fill="#CBD5E1" />
    <rect x="-14" y="-14" width="28" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle">Draft</text>
  </g>
  <!-- Tile 2: Report -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 75, 51)">
    <rect x="-14" y="-12" width="28" height="24" rx="5" fill="#CBD5E1" />
    <rect x="-14" y="-14" width="28" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle">Report</text>
  </g>
  <!-- Tile 3: Analyse -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 105, 68)">
    <rect x="-14" y="-12" width="28" height="24" rx="5" fill="#CBD5E1" />
    <rect x="-14" y="-14" width="28" height="24" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" />
    <text x="0" y="-1" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#64748B" text-anchor="middle">Analyse</text>
  </g>

  <!-- 3. Hollow Tunnel Cube -->
  <!-- Top Face at y=55 -->
  <g id="tunnel-cube">
    <!-- Drop Shadow on ground -->
    <ellipse cx="160" cy="115" rx="42" ry="22" fill="rgba(15,23,42,0.08)" />

    <!-- Left Wall (Facing Front-Left) -->
    <polygon points="120,77 160,100 160,135 120,112" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Front-Right Face (Facing Front-Right, with HOLLOW PORTAL CUTOUT) -->
    <!-- Outer boundary: (160,100) -> (200,77) -> (200,112) -> (160,135) -->
    <path d="M 160 100 L 200 77 L 200 112 L 186 120 L 186 98 C 186 92 174 92 174 98 L 174 127 L 160 135 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Inside Archway (Hollow Interior Glowing Blue) -->
    <path d="M 174 127 L 174 98 C 174 92 186 92 186 98 L 186 120 Z" fill="url(#arch-glow)" stroke="#6366F1" stroke-width="1" />

    <!-- Top Face of Tunnel -->
    <polygon points="160,54 200,77 160,100 120,77" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Low Pedestal on Top Face -->
    <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 160, 77)">
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" />
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    </g>

    <!-- Upright Switch Lever -->
    <g transform="translate(160, 75)">
      <path d="M -2 0 L -1 -12 L 1 -12 L 2 0 Z" fill="#CBD5E1" stroke="#475569" stroke-width="1" />
      <circle cx="0" cy="-12" r="2.5" fill="#6366F1" />
    </g>
  </g>

  <!-- 4. Outgoing Processed Tiles with Glowing Checkmarks (Front-Right) -->
  <!-- Tile 4: Sync -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 215, 126)">
    <rect x="-14" y="-12" width="28" height="24" rx="5" fill="#CBD5E1" />
    <rect x="-14" y="-14" width="28" height="24" rx="5" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="0" cy="-2" r="6" fill="#6366F1" />
    <path d="M -3 -2 L -1 0 L 3 -4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Tile 5: Active -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 248, 145)">
    <rect x="-14" y="-12" width="28" height="24" rx="5" fill="#CBD5E1" />
    <rect x="-14" y="-14" width="28" height="24" rx="5" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="0" cy="-2" r="6" fill="#6366F1" />
    <path d="M -3 -2 L -1 0 L 3 -4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Tile 6: Done -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 281, 164)">
    <rect x="-14" y="-12" width="28" height="24" rx="5" fill="#CBD5E1" />
    <rect x="-14" y="-14" width="28" height="24" rx="5" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="0" cy="-2" r="6" fill="#6366F1" />
    <path d="M -3 -2 L -1 0 L 3 -4" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>