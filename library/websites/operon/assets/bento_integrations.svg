<svg width="360" height="200" viewBox="0 0 360 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hub-halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>
  </defs>

  <!-- Circuit Traces along 30° grid -->
  <g stroke="#CBD5E1" stroke-width="1.2">
    <path d="M 145 130 L 95 101 L 70 115" />
    <path d="M 145 130 L 70 86 L 70 55" />
    <path d="M 175 112 L 175 65 L 140 45" />
    <path d="M 195 125 L 245 96 L 245 68" />
    <path d="M 195 125 L 290 100" />
    <path d="M 180 148 L 260 150" />
  </g>

  <!-- Junction Rings -->
  <g fill="#FFFFFF" stroke="#6366F1" stroke-width="1.2">
    <circle cx="95" cy="101" r="3" />
    <circle cx="175" cy="65" r="3" />
    <circle cx="245" cy="96" r="3" />
  </g>

  <!-- Central Operon Hub -->
  <g transform="translate(170, 135)">
    <ellipse cx="0" cy="5" rx="36" ry="20" fill="#6366F1" opacity="0.2" filter="url(#hub-halo)" />
    <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 0, 5)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#4F46E5" stroke="#4338CA" stroke-width="1.2" />
    </g>
    <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 0, 0)">
      <rect x="-24" y="-24" width="48" height="48" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.4" />
      <circle cx="0" cy="0" r="6.5" fill="none" stroke="#6366F1" stroke-width="2" />
    </g>
  </g>

  <!-- Surrounding 3D App Squircle Tiles -->
  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 70, 115)">
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="-4" y="6" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="bold" fill="#0F172A">N</text>
  </g>

  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 70, 55)">
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="-5" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#6366F1">#</text>
  </g>

  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 140, 45)">
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <circle cx="0" cy="0" r="6" fill="#0F172A" />
  </g>

  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 245, 68)">
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <circle cx="0" cy="0" r="5.5" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="2 2" />
  </g>

  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 290, 100)">
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <polygon points="0,-6 6,-3 0,0 -6,-3" fill="#6366F1" />
  </g>

  <g transform="matrix(0.866025, 0.5, -0.866025, 0.5, 260, 150)">
    <rect x="-15" y="-15" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#6366F1" text-anchor="middle">AI</text>
  </g>
</svg>