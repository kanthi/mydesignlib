<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <radialGradient id="orbGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#70D8FF"/>
      <stop offset="35%" stop-color="#0088FF"/>
      <stop offset="70%" stop-color="#003EE0"/>
      <stop offset="100%" stop-color="#001880"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing outer aura -->
  <circle cx="150" cy="150" r="130" fill="#0088FF" fill-opacity="0.25" filter="url(#softGlow)"/>

  <!-- Core Sphere with gradient -->
  <circle cx="150" cy="150" r="115" fill="url(#orbGrad)"/>

  <!-- Waveform swirl inside the sphere -->
  <path d="M 50,150 C 90,110 120,180 160,130 C 190,90 220,160 250,150 C 235,210 185,250 150,250 C 95,250 55,200 50,150 Z" 
        fill="#55C4FF" 
        fill-opacity="0.45" 
        style="mix-blend-mode: overlay;"/>
  <!-- Specular top highlight -->
  <ellipse cx="120" cy="100" rx="60" ry="30" fill="#FFFFFF" fill-opacity="0.4" transform="rotate(-25 120 100)"/>
</svg>
