<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="p2bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#EBF4EB"/>
          <stop offset="50%" stop-color="#C5DBC6"/>
          <stop offset="100%" stop-color="#4E654E"/>
        </linearGradient>
        <radialGradient id="heartGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFF2DC" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#E0AA5E" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#243825" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="600" height="380" fill="url(#p2bg)"/>
      <circle cx="300" cy="190" r="180" fill="url(#heartGlow)"/>

      <!-- Somatic couch & linen bolster -->
      <path d="M 60 260 Q 300 220 540 260 L 540 380 L 60 380 Z" fill="#F4EFEA"/>
      
      <!-- Resting client head on therapy pillow -->
      <ellipse cx="260" cy="230" rx="90" ry="50" fill="#E2D6C5"/>
      <circle cx="270" cy="210" r="42" fill="#E8C5AC"/>
      <path d="M 230 210 C 230 170, 270 170, 290 180 C 310 200, 310 240, 270 240 Z" fill="#3D291F"/>

      <!-- Therapist gentle hands over solar plexus / breath anchor -->
      <g transform="translate(360, 170) rotate(15)">
        <path d="M 0 30 C 20 10, 50 10, 70 30 C 80 50, 70 80, 50 90 C 30 90, 10 70, 0 50 Z" fill="#D6A789"/>
        <path d="M 20 80 C 40 60, 70 60, 90 80 C 100 100, 90 120, 70 130" fill="#CA9E82"/>
      </g>

      <!-- Breath wave lines -->
      <path d="M 120 120 Q 300 80 480 120" stroke="#7A9680" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.8"/>
      <path d="M 160 145 Q 300 110 440 145" stroke="#D98A2C" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.7"/>
    </svg>