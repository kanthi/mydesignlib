<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="p3bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F7EFE8"/>
          <stop offset="60%" stop-color="#DCC7B8"/>
          <stop offset="100%" stop-color="#5A4E46"/>
        </linearGradient>
        <radialGradient id="calmGlow" cx="60%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
          <stop offset="50%" stop-color="#E2CCA8" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#3D4539" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="600" height="380" fill="url(#p3bg)"/>
      <circle cx="360" cy="180" r="200" fill="url(#calmGlow)"/>

      <!-- Reclined restful pose in studio with plants -->
      <path d="M 450 380 C 450 180, 520 120, 600 100 L 600 380 Z" fill="#6B7C65" opacity="0.4"/>
      
      <!-- Open palms relaxing downwards (letting go of hyper-control) -->
      <g transform="translate(240, 160)">
        <ellipse cx="60" cy="60" rx="45" ry="28" fill="#E8C5AC" transform="rotate(-15 60 60)"/>
        <path d="M 30 70 Q 70 50 110 65" stroke="#CA9E82" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 40 85 Q 75 70 105 80" stroke="#CA9E82" stroke-width="3" stroke-linecap="round" fill="none"/>
      </g>
      
      <!-- Vagus nerve soothing ripple -->
      <circle cx="300" cy="200" r="60" stroke="#E29D3E" stroke-width="1.5" opacity="0.6"/>
      <circle cx="300" cy="200" r="90" stroke="#8EAA94" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.5"/>
      <circle cx="300" cy="200" r="120" stroke="#8EAA94" stroke-width="1" stroke-dasharray="3 6" opacity="0.4"/>
    </svg>