<svg width="500" height="600" viewBox="0 0 500 600" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tbg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FAF5EE"/>
          <stop offset="50%" stop-color="#E2DCD0"/>
          <stop offset="100%" stop-color="#6F8367"/>
        </linearGradient>
        <radialGradient id="faceLight" cx="45%" cy="35%" r="55%">
          <stop offset="0%" stop-color="#FFF8F0"/>
          <stop offset="100%" stop-color="#E8C5AC"/>
        </radialGradient>
      </defs>
      <rect width="500" height="600" fill="url(#tbg)"/>
      
      <!-- Studio background: Monstera leaf & warm timber shelf with singing bowl -->
      <path d="M 30 180 C 10 100, 80 40, 160 60 C 200 70, 220 120, 180 180 Z" fill="#52684B" opacity="0.5"/>
      <rect x="320" y="240" width="160" height="18" rx="4" fill="#8C6647"/>
      <ellipse cx="400" cy="235" rx="35" ry="18" fill="#D99B52"/>

      <!-- Warm Linen Kimono / Tunic -->
      <path d="M 120 600 C 120 440, 180 380, 250 380 C 320 380, 380 440, 380 600 Z" fill="#F3EFE9"/>
      <path d="M 250 380 L 220 600" stroke="#D3C9B8" stroke-width="2"/>
      <path d="M 250 380 L 280 600" stroke="#D3C9B8" stroke-width="2"/>

      <!-- Neck & Head -->
      <rect x="225" y="320" width="50" height="80" fill="#E8C5AC" rx="10"/>
      <ellipse cx="250" cy="260" rx="75" ry="90" fill="url(#faceLight)"/>

      <!-- Hair Styling (Warm dark chestnut, elegant natural wave) -->
      <path d="M 165 260 C 165 170, 210 140, 250 140 C 290 140, 335 170, 335 260 C 335 340, 310 380, 305 420 C 300 450, 290 480, 285 500 C 280 480, 270 420, 270 420 C 270 420, 230 420, 230 420 C 230 420, 220 480, 215 500 C 210 480, 200 450, 195 420 C 190 380, 165 340, 165 260 Z" fill="#2E1C12"/>

      <!-- Serene Facial Features (Warm, grounded, trustworthy, compassionate) -->
      <path d="M 215 245 Q 230 240 240 248" stroke="#4A2A1A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 260 248 Q 270 240 285 245" stroke="#4A2A1A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Soft kind eyes -->
      <ellipse cx="228" cy="260" rx="8" ry="5" fill="#3D2314"/>
      <ellipse cx="272" cy="260" rx="8" ry="5" fill="#3D2314"/>
      <!-- Nose & gentle smile -->
      <path d="M 250 255 L 253 285 Q 248 290 242 288" stroke="#BF8965" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 235 310 Q 250 322 265 310" stroke="#A84C38" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Golden talisman pendant -->
      <path d="M 245 420 L 250 435 L 255 420 Z" fill="#D98A2C"/>
      <path d="M 230 380 Q 250 425 270 380" stroke="#D98A2C" stroke-width="1.5" fill="none"/>
    </svg>