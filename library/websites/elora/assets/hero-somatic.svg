<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroSun" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF5E5" stop-opacity="1"/>
      <stop offset="35%" stop-color="#EBE3D3" stop-opacity="1"/>
      <stop offset="70%" stop-color="#8F9E84" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4F6047" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F2DDBE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3D4D36" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#F7DFD0"/>
      <stop offset="50%" stop-color="#E8C7B0"/>
      <stop offset="100%" stop-color="#CA9E82"/>
    </linearGradient>
    <linearGradient id="hairFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D201A"/>
      <stop offset="100%" stop-color="#140E0C"/>
    </linearGradient>
    <linearGradient id="linenTunic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFEA"/>
      <stop offset="100%" stop-color="#D9CFBE"/>
    </linearGradient>
    <linearGradient id="mossDrape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#829478"/>
      <stop offset="100%" stop-color="#384932"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="fineBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#heroSun)"/>

  <!-- Atmospheric Light Waves & Somatic Geometry -->
  <circle cx="850" cy="200" r="380" fill="#FFE8C2" opacity="0.35" filter="url(#softGlow)"/>
  <circle cx="350" cy="650" r="450" fill="#32452D" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Organic Somatic Ambient Shapes -->
  <path d="M-50 450 C 200 380, 450 620, 800 500 C 1050 400, 1150 550, 1250 520 L 1250 800 L -50 800 Z" fill="url(#mossDrape)" opacity="0.85"/>
  <path d="M-50 580 C 300 480, 600 700, 950 580 C 1100 520, 1200 600, 1250 590 L 1250 800 L -50 800 Z" fill="#243420"/>

  <!-- Resting Client & Practitioner Scene Graphic Elements -->
  <!-- Linen therapy bolster -->
  <ellipse cx="460" cy="420" rx="340" ry="180" fill="url(#linenTunic)" opacity="0.95" transform="rotate(-6 460 420)"/>
  <ellipse cx="460" cy="420" rx="320" ry="160" fill="#E6DC Flora" opacity="0.4" transform="rotate(-6 460 420)"/>

  <!-- Hair & Serene Silhouette -->
  <path d="M 240 460 C 220 360, 320 280, 440 270 C 560 260, 640 330, 620 440 C 600 520, 520 560, 420 560 C 300 560, 250 520, 240 460 Z" fill="url(#hairFlow)" opacity="0.95"/>
  
  <!-- Face & Neck Profile in Peaceful Rest -->
  <path d="M 330 420 C 330 350, 400 310, 480 320 C 550 330, 580 390, 560 460 C 540 510, 470 540, 410 530 C 350 520, 330 470, 330 420 Z" fill="url(#skinTone)"/>
  
  <!-- Facial Harmony Lines (Eyes softly closed, gentle serene expression) -->
  <path d="M 440 380 Q 460 390 480 380" stroke="#7A4E35" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 505 385 Q 525 395 540 385" stroke="#7A4E35" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M 490 390 L 500 425 Q 492 430 480 428" stroke="#A86E4B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 470 455 Q 490 465 510 455" stroke="#965239" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Practitioner Gentle Hands (Somatic Crown Touch) -->
  <!-- Hand 1 near crown/temple -->
  <g transform="translate(540, 260) rotate(22)">
    <path d="M 0 60 C 20 20, 70 10, 110 30 C 130 40, 140 70, 130 100 C 110 130, 40 140, 10 110 Z" fill="url(#skinTone)"/>
    <path d="M 80 35 C 100 15, 130 15, 145 35 C 155 50, 145 75, 125 85" stroke="#B07A58" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 95 65 C 115 45, 145 50, 155 70 C 160 85, 150 100, 130 105" stroke="#B07A58" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Hand 2 near forehead/third-eye aura -->
  <g transform="translate(300, 280) rotate(-28)">
    <path d="M 30 60 C 50 20, 100 10, 140 30 C 160 40, 170 70, 160 100 C 140 130, 70 140, 40 110 Z" fill="url(#skinTone)"/>
    <path d="M 110 35 C 130 15, 160 15, 175 35" stroke="#B07A58" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Ceramic Singing Bowl & Botanical Studio Accents in Foreground Left -->
  <g transform="translate(100, 240)">
    <ellipse cx="80" cy="90" rx="75" ry="38" fill="#D49A5A"/>
    <ellipse cx="80" cy="85" rx="70" ry="32" fill="#B57C3E"/>
    <ellipse cx="80" cy="82" rx="60" ry="24" fill="#875824"/>
    <!-- Subtle wooden mallet -->
    <rect x="130" y="40" width="18" height="90" rx="9" fill="#5E3C1B" transform="rotate(35 130 40)"/>
  </g>

  <!-- Warm Sunbeams & Fine Tactile Lighting Overlay -->
  <polygon points="650,0 950,0 1200,750 850,750" fill="url(#warmLight)" opacity="0.45"/>
  <polygon points="400,0 700,0 900,750 550,750" fill="url(#warmLight)" opacity="0.35"/>
</svg>