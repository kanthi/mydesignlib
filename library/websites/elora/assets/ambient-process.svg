<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="saltLampGlow" cx="25%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FF9E4A"/>
          <stop offset="40%" stop-color="#E26D28" stop-opacity="0.8"/>
          <stop offset="80%" stop-color="#73280B" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#142116" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bgAmbient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#243825"/>
          <stop offset="50%" stop-color="#182A1C"/>
          <stop offset="100%" stop-color="#0E1810"/>
        </linearGradient>
      </defs>
      <rect width="900" height="550" fill="url(#bgAmbient)"/>

      <!-- Salt Lamp Glow -->
      <circle cx="220" cy="300" r="220" fill="url(#saltLampGlow)"/>

      <!-- Wooden Studio Surface -->
      <rect x="0" y="380" width="900" height="170" fill="#1C1814"/>
      <line x1="0" y1="380" x2="900" y2="380" stroke="#3D3228" stroke-width="3"/>

      <!-- Himalayan Salt Crystal Lamp -->
      <path d="M 180 380 C 160 300, 180 220, 220 200 C 260 220, 280 300, 260 380 Z" fill="#F78A3D"/>
      <path d="M 195 380 C 185 320, 200 240, 220 220 C 240 240, 250 320, 245 380 Z" fill="#FFB775"/>

      <!-- Tibetan Singing Bowl (Hand-hammered bronze) -->
      <g transform="translate(420, 280)">
        <ellipse cx="120" cy="100" rx="110" ry="55" fill="#D99B4E"/>
        <ellipse cx="120" cy="90" rx="100" ry="45" fill="#B3782C"/>
        <ellipse cx="120" cy="85" rx="85" ry="35" fill="#6B4515"/>
        <!-- Suede mallet resting beside bowl -->
        <rect x="200" y="40" width="22" height="100" rx="11" fill="#7A4D22" transform="rotate(30 200 40)"/>
        <rect x="200" y="40" width="22" height="40" rx="11" fill="#C9A075" transform="rotate(30 200 40)"/>
      </g>

      <!-- Polished Basalt River Stones (Balanced Stack) -->
      <g transform="translate(700, 310)">
        <ellipse cx="60" cy="70" rx="55" ry="22" fill="#383D39"/>
        <ellipse cx="60" cy="50" rx="42" ry="17" fill="#4B524D"/>
        <ellipse cx="60" cy="33" rx="30" ry="12" fill="#616B64"/>
        <ellipse cx="60" cy="18" rx="18" ry="8" fill="#7D8A81"/>
      </g>

      <!-- Delicate Aromatic Incense Smoke Wave -->
      <path d="M 360 380 Q 340 300 370 240 Q 390 180 360 120 Q 340 60 370 20" stroke="#F5EDE1" stroke-width="2" fill="none" opacity="0.35"/>
      <path d="M 363 380 Q 345 305 373 245 Q 393 185 365 125" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.5"/>
    </svg>