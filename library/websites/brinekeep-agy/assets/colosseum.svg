<svg viewBox="0 0 900 650" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm sunset wash gradient on right arches -->
    <linearGradient id="sunset-wash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF8F3" stop-opacity="0" />
      <stop offset="45%" stop-color="#E89B66" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#D96B27" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#C25315" stop-opacity="0.8" />
    </linearGradient>

    <!-- Base travertine gradient -->
    <linearGradient id="travertine-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C887B" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#8C887B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FAF8F3" stop-opacity="0" />
    </linearGradient>

    <!-- Stone texture pattern -->
    <pattern id="hatch-fine" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8C887B" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Sky soft tone -->
  <rect width="900" height="650" fill="transparent" />

  <g transform="translate(40, 60)" stroke="#6E6A5E" stroke-width="1.2" fill="none">
