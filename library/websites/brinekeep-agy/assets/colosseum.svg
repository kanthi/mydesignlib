      <path d="M 640 380 L 640 310 Q 660 280 680 310 L 680 380" />
      <path d="M 690 380 L 690 310 Q 710 280 730 310 L 730 380" />
      <path d="M 740 380 L 740 310 Q 760 280 775 310 L 775 380" />
    </g>

    <!-- Tier 1: Ground Arches (Doric) -->
