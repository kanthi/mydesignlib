      <path d="M 543 312 Q 560 292 577 312 L 577 378 L 543 378 Z" />
      <path d="M 593 312 Q 610 292 627 312 L 627 378 L 593 378 Z" />
      <path d="M 643 312 Q 660 292 677 312 L 677 378 L 643 378 Z" />
      <path d="M 693 312 Q 710 292 727 312 L 727 378 L 693 378 Z" />
      <path d="M 743 312 Q 758 292 773 312 L 773 378 L 743 378 Z" />
