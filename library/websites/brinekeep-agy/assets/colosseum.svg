    <path d="M 50 480 Q 400 560 780 480" stroke="#7A7568" stroke-width="2" />
    <path d="M 50 380 Q 400 440 780 380" stroke="#7A7568" stroke-width="1.5" />
    <path d="M 80 280 Q 400 330 780 280" stroke="#7A7568" stroke-width="1.5" />
    <path d="M 120 180 Q 400 220 780 180" stroke="#7A7568" stroke-width="2" />

    <!-- Attic Level (Top tier broken silhouette) -->
    <path d="M 460 70 L 780 70 L 780 180 L 460 180 Z" stroke="#6E6A5E" stroke-width="1.8" />
    <!-- Attic pilasters and corbels -->
    <path d="M 480 70 L 480 180 M 520 70 L 520 180 M 560 70 L 560 180 M 600 70 L 600 180 M 640 70 L 640 180 M 680 70 L 680 180 M 720 70 L 720 180 M 760 70 L 760 180" stroke="#7A7568" stroke-width="1" />
    <!-- Attic square windows -->
    <rect x="495" y="105" width="16" height="22" fill="#5A554A" />
    <rect x="535" y="105" width="16" height="22" fill="#5A554A" />
    <rect x="575" y="105" width="16" height="22" fill="#5A554A" />
    <rect x="615" y="105" width="16" height="22" fill="#5A554A" />
    <rect x="655" y="105" width="16" height="22" fill="#5A554A" />
    <rect x="695" y="105" width="16" height="22" fill="#5A554A" />
    <rect x="735" y="105" width="16" height="22" fill="#5A554A" />

    <!-- Tier 3: Upper Arches (Corinthian) -->
    <!-- Broken left silhouette -->
    <path d="M 240 190 Q 280 185 460 180" stroke="#6E6A5E" stroke-width="2" />
    <!-- Arches -->
    <g id="tier3-arches">
      <path d="M 250 280 L 250 220 Q 265 195 280 220 L 280 280" />
      <path d="M 290 280 L 290 220 Q 305 195 320 220 L 320 280" />
      <path d="M 330 280 L 330 220 Q 345 195 360 220 L 360 280" />
      <path d="M 370 280 L 370 220 Q 385 195 400 220 L 400 280" />
      <path d="M 410 280 L 410 220 Q 425 195 440 220 L 440 280" />
      <path d="M 450 280 L 450 220 Q 465 195 480 220 L 480 280" />
      <path d="M 490 280 L 490 220 Q 505 195 520 220 L 520 280" />
      <path d="M 530 280 L 530 220 Q 545 195 560 220 L 560 280" />
      <path d="M 570 280 L 570 220 Q 585 195 600 220 L 600 280" />
      <path d="M 610 280 L 610 220 Q 625 195 640 220 L 640 280" />
      <path d="M 650 280 L 650 220 Q 665 195 680 220 L 680 280" />
      <path d="M 690 280 L 690 220 Q 705 195 720 220 L 720 280" />
      <path d="M 730 280 L 730 220 Q 745 195 760 220 L 760 280" />
