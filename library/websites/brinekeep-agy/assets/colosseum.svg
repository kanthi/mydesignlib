      <path d="M 493 222 Q 505 205 517 222 L 517 278 L 493 278 Z" />
      <path d="M 533 222 Q 545 205 557 222 L 557 278 L 533 278 Z" />
      <path d="M 573 222 Q 585 205 597 222 L 597 278 L 573 278 Z" />
      <path d="M 613 222 Q 625 205 637 222 L 637 278 L 613 278 Z" />
      <path d="M 653 222 Q 665 205 677 222 L 677 278 L 653 278 Z" />
      <path d="M 693 222 Q 705 205 717 222 L 717 278 L 693 278 Z" />
      <path d="M 733 222 Q 745 205 757 222 L 757 278 L 733 278 Z" />

