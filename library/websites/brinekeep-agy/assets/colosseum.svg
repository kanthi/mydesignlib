  <!-- Glowing Terracotta Sunset Overlay on the Right Half of Colosseum -->
  <path d="M 450 30 Q 750 30 840 70 L 840 560 Q 550 580 420 540 Z" fill="url(#sunset-wash)" mix-blend-mode="multiply" />

  <!-- Architectural Framing & Bottom Fade Out -->
  <rect x="0" y="460" width="900" height="190" fill="url(#travertine-fade)" />
</svg>
