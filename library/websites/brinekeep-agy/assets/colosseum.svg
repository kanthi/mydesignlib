      <path d="M 110 480 L 110 410 Q 130 380 150 410 L 150 480" />
      <path d="M 160 480 L 160 410 Q 180 380 200 410 L 200 480" />
      <path d="M 210 480 L 210 410 Q 230 380 250 410 L 250 480" />
      <path d="M 260 480 L 260 410 Q 280 380 300 410 L 300 480" />
      <path d="M 310 480 L 310 410 Q 330 380 350 410 L 350 480" />
      <path d="M 360 480 L 360 410 Q 380 380 400 410 L 400 480" />
      <path d="M 410 480 L 410 410 Q 430 380 450 410 L 450 480" />
      <path d="M 460 480 L 460 410 Q 480 380 500 410 L 500 480" />
      <path d="M 510 480 L 510 410 Q 530 380 550 410 L 550 480" />
      <path d="M 560 480 L 560 410 Q 580 380 600 410 L 600 480" />
      <path d="M 610 480 L 610 410 Q 630 380 650 410 L 650 480" />
      <path d="M 660 480 L 660 410 Q 680 380 700 410 L 700 480" />
      <path d="M 710 480 L 710 410 Q 730 380 750 410 L 750 480" />
