<svg viewBox="0 0 400 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky-soft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ebfd6" />
      <stop offset="60%" stop-color="#c9d9e4" />
      <stop offset="100%" stop-color="#e8ede9" />
    </linearGradient>
    <linearGradient id="stone-lit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#695f54" />
      <stop offset="50%" stop-color="#8b7d6f" />
      <stop offset="100%" stop-color="#b8a695" />
    </linearGradient>
  </defs>

  <!-- Sky & Atmospheric Clouds -->
  <rect width="400" height="440" fill="url(#sky-soft)" />
  <circle cx="80" cy="120" r="90" fill="#ffffff" opacity="0.45" filter="blur(20px)" />
  <circle cx="190" cy="90" r="70" fill="#ffffff" opacity="0.5" filter="blur(15px)" />
  <circle cx="320" cy="140" r="100" fill="#ffffff" opacity="0.4" filter="blur(25px)" />

  <!-- Distant Landscape Horizon -->
  <path d="M 0 350 Q 150 330 400 360 L 400 440 L 0 440 Z" fill="#54584b" />
  <path d="M 0 370 Q 220 350 400 380 L 400 440 L 0 440 Z" fill="#3c4033" />

  <!-- Stepped Temple Pyramid -->
  <g transform="translate(40, 240)">
    <!-- Base Tier 1 -->
    <polygon points="10,160 310,160 280,125 40,125" fill="#6b6053" />
    <!-- Tier 2 -->
    <polygon points="40,125 280,125 255,95 65,95" fill="#786c5e" />
    <!-- Tier 3 -->
    <polygon points="65,95 255,95 235,70 85,70" fill="#887b6c" />
    <!-- Tier 4 -->
    <polygon points="85,70 235,70 215,48 105,48" fill="#998b7a" />
    <!-- Tier 5 (Top Temple Sanctuary) -->
    <polygon points="105,48 215,48 200,30 120,30" fill="#a89a89" />
    <rect x="135" y="10" width="50" height="20" fill="#b5a796" />
    <rect x="150" y="15" width="20" height="15" fill="#383028" />

    <!-- Central Staircase -->
    <polygon points="140,160 180,160 170,10 150,10" fill="#a39382" stroke="#5a4e42" stroke-width="0.8" />
    <!-- Stair Treads -->
    <line x1="141" y1="145" x2="179" y2="145" stroke="#483e33" stroke-width="1.2" />
    <line x1="143" y1="130" x2="177" y2="130" stroke="#483e33" stroke-width="1.2" />
    <line x1="145" y1="115" x2="175" y2="115" stroke="#483e33" stroke-width="1.2" />
    <line x1="147" y1="100" x2="173" y2="100" stroke="#483e33" stroke-width="1.2" />
    <line x1="149" y1="85" x2="171" y2="85" stroke="#483e33" stroke-width="1.2" />
    <line x1="151" y1="70" x2="169" y2="70" stroke="#483e33" stroke-width="1.2" />
    <line x1="153" y1="55" x2="167" y2="55" stroke="#483e33" stroke-width="1.2" />
    <line x1="155" y1="40" x2="165" y2="40" stroke="#483e33" stroke-width="1.2" />
    <line x1="157" y1="25" x2="163" y2="25" stroke="#483e33" stroke-width="1.2" />

    <!-- Architectural Hatching / Shadow -->
    <polygon points="10,160 140,160 150,10 135,10 120,30 105,48 85,70 65,95 40,125" fill="#000000" opacity="0.22" />
  </g>
</svg>
