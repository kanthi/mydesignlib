<svg viewBox="0 0 400 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="terracotta-lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df8253" />
      <stop offset="60%" stop-color="#cf6937" />
      <stop offset="100%" stop-color="#b04a1b" />
    </linearGradient>
    <linearGradient id="sky-warm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8bb7d8" />
      <stop offset="100%" stop-color="#dfecf5" />
    </linearGradient>
  </defs>

  <!-- Clear Desert Sky -->
  <rect width="400" height="440" fill="url(#sky-warm)" />

  <!-- Adobe Courtyard Architecture -->
  <!-- Left Wall in Shadow -->
  <polygon points="0,0 120,80 120,440 0,440" fill="#a0441a" />
  
  <!-- Right Wall in Warm Sunlight -->
  <polygon points="260,0 400,0 400,440 260,440" fill="url(#terracotta-lit)" />
  <polygon points="200,60 260,0 260,440 200,440" fill="#be5a2a" />

  <!-- Center Corridor Opening & Distant Courtyard -->
  <rect x="120" y="80" width="80" height="360" fill="#e8bb9b" />
  <!-- Distant Wall -->
  <rect x="120" y="80" width="80" height="180" fill="#df875b" />
  
  <!-- Ground Sand Pathway -->
  <polygon points="120,260 200,260 260,440 0,440" fill="#dfd0b5" />
  <polygon points="0,440 260,440 200,340 60,340" fill="#d2c1a3" />

  <!-- Sunlit Diagonal Cast Shadows -->
  <polygon points="120,80 200,160 200,440 120,440" fill="#000000" opacity="0.2" />

  <!-- Desert Botanical Shrubs & Agave Plants -->
  <g transform="translate(180, 360)">
    <!-- Bush 1 -->
    <ellipse cx="25" cy="20" rx="35" ry="18" fill="#586b4d" />
    <ellipse cx="20" cy="12" rx="28" ry="14" fill="#718663" />
    <ellipse cx="32" cy="8" rx="20" ry="10" fill="#8ca57b" />
    <!-- Small desert plant -->
    <ellipse cx="-20" cy="35" rx="22" ry="12" fill="#586b4d" />
    <ellipse cx="-22" cy="30" rx="16" ry="9" fill="#758c67" />
  </g>
</svg>
