<svg viewBox="0 0 400 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="marble-tint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfc7b6" />
      <stop offset="50%" stop-color="#eae4d7" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="sky-med" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#729ec0" />
      <stop offset="100%" stop-color="#c1d8e8" />
    </linearGradient>
  </defs>

  <!-- Mediterranean Sky -->
  <rect width="400" height="440" fill="url(#sky-med)" />

  <!-- Classical Architrave & Entablature Beam at top -->
  <rect x="0" y="30" width="400" height="45" fill="#eae4d7" stroke="#b0a794" stroke-width="1.5" />
  <line x1="0" y1="50" x2="400" y2="50" stroke="#c2baa7" stroke-width="1" />
  <line x1="0" y1="65" x2="400" y2="65" stroke="#9e9581" stroke-width="1.5" />

  <!-- Column 1 (Left background column) -->
  <g transform="translate(60, 75)">
    <!-- Capital -->
    <rect x="-10" y="0" width="60" height="15" fill="#e2dccf" stroke="#a39a88" />
    <!-- Shaft -->
    <rect x="0" y="15" width="40" height="320" fill="url(#marble-tint)" stroke="#a39a88" stroke-width="1" />
    <!-- Fluting lines -->
    <line x1="8" y1="15" x2="8" y2="335" stroke="#b8b09d" stroke-width="1" />
    <line x1="16" y1="15" x2="16" y2="335" stroke="#b8b09d" stroke-width="1" />
    <line x1="24" y1="15" x2="24" y2="335" stroke="#b8b09d" stroke-width="1" />
    <line x1="32" y1="15" x2="32" y2="335" stroke="#b8b09d" stroke-width="1" />
    <!-- Base -->
    <rect x="-8" y="335" width="56" height="20" fill="#d5cebf" stroke="#99907e" />
  </g>

  <!-- Column 2 (Middle foreground column) -->
  <g transform="translate(200, 75)">
    <!-- Capital with volutes -->
    <rect x="-15" y="0" width="80" height="20" fill="#f0eae0" stroke="#a39a88" />
    <!-- Shaft -->
    <rect x="0" y="20" width="50" height="315" fill="url(#marble-tint)" stroke="#9c9381" stroke-width="1.2" />
    <!-- Fluting lines -->
    <line x1="10" y1="20" x2="10" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <line x1="20" y1="20" x2="20" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <line x1="30" y1="20" x2="30" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <line x1="40" y1="20" x2="40" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <!-- Base -->
    <rect x="-12" y="335" width="74" height="25" fill="#dbd4c5" stroke="#99907e" />
  </g>

  <!-- Column 3 (Right foreground column) -->
  <g transform="translate(340, 75)">
    <!-- Capital -->
    <rect x="-15" y="0" width="80" height="20" fill="#f4efe6" stroke="#a39a88" />
    <!-- Shaft -->
    <rect x="0" y="20" width="60" height="315" fill="url(#marble-tint)" stroke="#9c9381" stroke-width="1.2" />
    <!-- Fluting lines -->
    <line x1="12" y1="20" x2="12" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <line x1="24" y1="20" x2="24" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <line x1="36" y1="20" x2="36" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <line x1="48" y1="20" x2="48" y2="335" stroke="#b5ad9a" stroke-width="1.5" />
    <!-- Base -->
    <rect x="-12" y="335" width="84" height="25" fill="#ded7c9" stroke="#99907e" />
  </g>

  <!-- Classical Marble Stylobate / Floor -->
  <rect x="0" y="395" width="400" height="45" fill="#d0c8b6" stroke="#8e8574" stroke-width="1.5" />
  <line x1="0" y1="410" x2="400" y2="410" stroke="#baa894" stroke-width="1" />
</svg>
