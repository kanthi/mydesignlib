<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" fill="none">
  <!-- Blueprint Grid Background -->
  <defs>
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25292D" stroke-width="0.5" stroke-opacity="0.35"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#25292D" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="sunbeamSummer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E55B32" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E55B32" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sunbeamWinter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A65A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#0E1113" rx="12"/>
  <rect width="1000" height="560" fill="url(#archGrid)" rx="12"/>

  <!-- Top Title & Coordinates -->
  <text x="40" y="50" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E55B32" letter-spacing="0.1em">SECTION AA' — SOLAR ENVELOPE &amp; CROSS VENTILATION</text>
  <text x="40" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" fill="#F4F4F6">Casa Lúmen / Passive House Thermal Dynamic Study</text>
  <text x="780" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7E8790" text-anchor="end">LAT 32°53' S / ELEV 1,150M</text>
  <text x="960" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7E8790" text-anchor="end">SCALE 1:50</text>

  <!-- Ground Line / Topography -->
  <path d="M 0 460 Q 200 450 350 430 T 600 390 T 850 340 L 1000 310 L 1000 560 L 0 560 Z" fill="#161B1E"/>
  <path d="M 0 460 Q 200 450 350 430 T 600 390 T 850 340 L 1000 310" stroke="#48535B" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="40" y="520" font-family="'JetBrains Mono', monospace" font-size="10" fill="#58636C">NATURAL ROCK GRADE / BEDROCK PINNED FOUNDATION</text>

  <!-- Summer Sun Angle Path (68 deg) -->
  <polygon points="250,90 280,90 560,340 460,340" fill="url(#sunbeamSummer)"/>
  <line x1="250" y1="90" x2="560" y2="340" stroke="#E55B32" stroke-width="1.5" stroke-dasharray="6 3"/>
  <circle cx="250" cy="90" r="14" fill="#E55B32" fill-opacity="0.2"/>
  <circle cx="250" cy="90" r="6" fill="#E55B32"/>
  <text x="275" y="95" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E55B32">SUMMER SOLSTICE 68° (BLOCKED BY DEEP EAVES)</text>

  <!-- Winter Sun Angle Path (32 deg) -->
  <polygon points="120,190 150,190 620,400 400,400" fill="url(#sunbeamWinter)"/>
  <line x1="120" y1="190" x2="620" y2="400" stroke="#F2A65A" stroke-width="1.5" stroke-dasharray="6 3"/>
  <circle cx="120" cy="190" r="14" fill="#F2A65A" fill-opacity="0.2"/>
  <circle cx="120" cy="190" r="6" fill="#F2A65A"/>
  <text x="145" y="195" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F2A65A">WINTER SOLSTICE 32° (DEEP SOLAR GAIN ONTO THERMAL FLOOR)</text>

  <!-- Structural House Outline -->
  <!-- Cantilever Roof -->
  <polygon points="320,240 760,180 770,205 350,265" fill="#D67D3E" fill-opacity="0.15" stroke="#E55B32" stroke-width="2.5"/>
  <text x="560" y="200" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E55B32">4.2M CANTILEVERED GLULAM OAK CANOPY</text>

  <!-- Rammed Earth Spine (Back Wall) -->
  <rect x="340" y="260" width="45" height="150" fill="#3D352E" stroke="#8C7355" stroke-width="2"/>
  <!-- Rammed earth strata lines -->
  <line x1="340" y1="280" x2="385" y2="280" stroke="#685542" stroke-width="1"/>
  <line x1="340" y1="300" x2="385" y2="300" stroke="#524335" stroke-width="1"/>
  <line x1="340" y1="320" x2="385" y2="320" stroke="#685542" stroke-width="1"/>
  <line x1="340" y1="340" x2="385" y2="340" stroke="#524335" stroke-width="1"/>
  <line x1="340" y1="370" x2="385" y2="370" stroke="#685542" stroke-width="1"/>
  <line x1="340" y1="390" x2="385" y2="390" stroke="#524335" stroke-width="1"/>
  <text x="210" y="325" font-family="'JetBrains Mono', monospace" font-size="10" fill="#C4AB80">450MM RAMMED EARTH</text>
  <text x="210" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8C7355">THERMAL BATTERY MASS</text>
  <line x1="330" y1="330" x2="340" y2="330" stroke="#8C7355" stroke-width="1"/>

  <!-- Interior Floor / Slab -->
  <polygon points="340,410 740,350 740,375 340,435" fill="#242B30" stroke="#52606D" stroke-width="2"/>
  <text x="440" y="445" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818E9B">INSULATED CONCRETE SCREED / HYDRONIC LOOPS</text>

  <!-- Glass Curtain Wall -->
  <line x1="680" y1="210" x2="680" y2="360" stroke="#7BD5F5" stroke-width="3"/>
  <rect x="677" y="210" width="6" height="150" fill="#7BD5F5" fill-opacity="0.2"/>
  <text x="705" y="290" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7BD5F5">TRIPLE-GLAZED ARGON</text>
  <text x="705" y="305" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5BAFCB">Ug = 0.58 W/(m²K)</text>

  <!-- Outdoor Deck Terrace -->
  <polygon points="680,360 860,330 860,345 680,375" fill="#5A4738" stroke="#B89474" stroke-width="1.5"/>
  <text x="760" y="375" font-family="'JetBrains Mono', monospace" font-size="10" fill="#B89474">NORTH TERRACE</text>

  <!-- Natural Cross-Ventilation Airflow Arrow -->
  <path d="M 720 340 Q 640 310 520 310 T 360 250" fill="none" stroke="#5EEAD4" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="355,246 368,247 362,258" fill="#5EEAD4"/>
  <text x="470" y="295" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5EEAD4">PREVAILING KATABATIC VALLEY BREEZE (PASSIVE FLUSH)</text>

  <!-- Elevation Dimensions -->
  <line x1="780" y1="180" x2="780" y2="350" stroke="#7E8790" stroke-width="1"/>
  <line x1="775" y1="180" x2="785" y2="180" stroke="#7E8790" stroke-width="1"/>
  <line x1="775" y1="350" x2="785" y2="350" stroke="#7E8790" stroke-width="1"/>
  <text x="795" y="270" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E8790">3.60M CLEAR</text>

  <line x1="340" y1="455" x2="740" y2="395" stroke="#7E8790" stroke-width="1"/>
  <text x="520" y="420" font-family="'JetBrains Mono', monospace" font-size="10" fill="#7E8790">14.80M ENVELOPE SPAN</text>
</svg>
