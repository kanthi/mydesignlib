<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="loop-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#2563EB" />
    </pattern>
    <pattern id="loop-dense" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.2" fill="#1D4ED8" />
    </pattern>
  </defs>

  <!-- Technical Corner Ticks -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="24" y1="30" x2="36" y2="30" />
    <line x1="30" y1="24" x2="30" y2="36" />
    <line x1="604" y1="30" x2="616" y2="30" />
    <line x1="610" y1="24" x2="610" y2="36" />
    <line x1="24" y1="390" x2="36" y2="390" />
    <line x1="30" y1="384" x2="30" y2="396" />
    <line x1="604" y1="390" x2="616" y2="390" />
    <line x1="610" y1="384" x2="610" y2="396" />
  </g>

  <!-- Outer Technical Box -->
  <rect x="30" y="30" width="580" height="360" rx="4" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Isometric Infinity Loop (Figure-8 Ribbon) -->
  <g transform="translate(320, 220)">
    <!-- Base Ribbon Shadow -->
    <path d="M-150 40 C-220 80 -160 120 -80 80 C0 40 40 40 80 80 C160 120 220 80 150 40 C80 0 0 0 -80 40 Z" fill="#000000" opacity="0.05" />

    <!-- Infinity Track Under-Pass Ribbon -->
    <path d="M-60 40 C0 0 60 0 140 25 C200 45 200 95 140 115 C80 135 10 100 -50 60" 
          stroke="#2563EB" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M-60 40 C0 0 60 0 140 25 C200 45 200 95 140 115 C80 135 10 100 -50 60" 
          stroke="url(#loop-dots)" stroke-width="24" stroke-linecap="round" fill="none" />

    <!-- Infinity Track Over-Pass Ribbon -->
    <path d="M50 60 C10 100 -60 135 -140 115 C-200 95 -200 45 -140 25 C-60 5 -10 5 50 60" 
          stroke="#1D4ED8" stroke-width="28" stroke-linecap="round" fill="none" />
    <path d="M50 60 C10 100 -60 135 -140 115 C-200 95 -200 45 -140 25 C-60 5 -10 5 50 60" 
          stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" fill="none" />
    <path d="M50 60 C10 100 -60 135 -140 115 C-200 95 -200 45 -140 25 C-60 5 -10 5 50 60" 
          stroke="url(#loop-dots)" stroke-width="20" stroke-linecap="round" fill="none" />

    <!-- Left Curve: Isometric Code Terminal Card </ > -->
    <g transform="translate(-130, -30)">
      <!-- Card Body -->
      <path d="M-50 -40 L30 -70 L60 -20 L-20 10 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
      <path d="M-20 10 L60 -20 L60 -8 L-20 22 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" />
      <path d="M-50 -40 L-20 10 L-20 22 L-50 -28 Z" fill="url(#loop-dense)" stroke="#2563EB" stroke-width="1.5" />
      
      <!-- Terminal Header Bar -->
      <path d="M-45 -38 L30 -66 L36 -56 L-39 -28 Z" fill="#EFF6FF" />
      <circle cx="-35" cy="-35" r="2.5" fill="#EF4444" />
      <circle cx="-27" cy="-38" r="2.5" fill="#F59E0B" />
      <circle cx="-19" cy="-41" r="2.5" fill="#10B981" />

      <!-- Code Bracket Symbol </ > -->
      <g stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(5, -28)">
        <!-- < -->
        <path d="M-14 -6 L-24 0 L-14 6" />
        <!-- / -->
        <line x1="-8" y1="8" x2="4" y2="-8" />
        <!-- > -->
        <path d="M10 -6 L20 0 L10 6" />
      </g>
    </g>

    <!-- Right Curve: Isometric Verification Checklist & Cryptographic Padlock -->
    <g transform="translate(130, 20)">
      <!-- Checklist Panel -->
      <path d="M-35 -70 L40 -45 L20 10 L-55 -15 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
      <path d="M20 10 L40 -45 L40 -35 L20 20 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" />
      <path d="M-55 -15 L20 10 L20 20 L-55 -5 Z" fill="url(#loop-dense)" stroke="#2563EB" stroke-width="1.5" />

      <!-- Check items -->
      <g stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="-30" y1="-50" x2="10" y2="-37" />
        <line x1="-35" y1="-32" x2="5" y2="-19" />
        <line x1="-40" y1="-14" x2="0" y2="-1" />
      </g>

      <!-- Isometric 3D Padlock Resting against card -->
      <g transform="translate(0, 15)">
        <!-- Shackle -->
        <path d="M-10 -15 C-10 -30 10 -30 10 -15 L10 0 L-10 0 Z" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
        <!-- Body -->
        <path d="M-22 0 L18 -12 L28 15 L-12 27 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.8" />
        <path d="M-12 27 L28 15 L28 27 L-12 39 Z" fill="url(#loop-dense)" stroke="#1D4ED8" stroke-width="1.8" />
        <path d="M-22 0 L-12 27 L-12 39 L-22 12 Z" fill="#1E40AF" stroke="#1D4ED8" stroke-width="1.8" />
        <!-- Keyhole -->
        <circle cx="6" cy="7" r="2.5" fill="#FFFFFF" />
        <line x1="6" y1="9" x2="7" y2="15" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Technical Telemetry -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#2563EB" font-weight="700">
    <text x="44" y="360">PIPELINE: CONTINUOUS_INTEGRITY</text>
    <text x="44" y="374" fill="#64748B" font-weight="400">ENCRYPTION: HARDWARE_KEYED // ZERO_LEAKAGE</text>
    <text x="580" y="374" fill="#2563EB" text-anchor="end">STATUS: ACTIVE_LOOP</text>
  </g>
</svg>
