<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Halftone Dot Pattern for 3D Facets -->
    <pattern id="halftone-dense" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3.2" fill="#2563EB" />
    </pattern>
    <pattern id="halftone-medium" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#3B82F6" />
    </pattern>
    <pattern id="halftone-light" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.2" fill="#60A5FA" />
    </pattern>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Technical Blueprint Corner Ticks & Coordinates -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <!-- Top-left Crosshair -->
    <line x1="24" y1="30" x2="36" y2="30" />
    <line x1="30" y1="24" x2="30" y2="36" />
    <!-- Top-right Crosshair -->
    <line x1="604" y1="30" x2="616" y2="30" />
    <line x1="610" y1="24" x2="610" y2="36" />
    <!-- Bottom-left Crosshair -->
    <line x1="24" y1="390" x2="36" y2="390" />
    <line x1="30" y1="384" x2="30" y2="396" />
    <!-- Bottom-right Crosshair -->
    <line x1="604" y1="390" x2="616" y2="390" />
    <line x1="610" y1="384" x2="610" y2="396" />
  </g>

  <!-- Outer Technical Bounding Box -->
  <rect x="30" y="30" width="580" height="360" rx="4" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Isometric Base Pedestal Layer 1 (Bottom Face) -->
  <path d="M120 270 L320 370 L520 270 L320 170 Z" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Isometric Base Pedestal Thickness -->
  <path d="M120 270 L120 290 L320 390 L320 370 Z" fill="url(#halftone-dense)" stroke="#2563EB" stroke-width="1.2" />
  <path d="M320 370 L320 390 L520 290 L520 270 Z" fill="url(#halftone-medium)" stroke="#3B82F6" stroke-width="1.2" />

  <!-- Base Pedestal Top Step -->
  <path d="M160 250 L320 330 L480 250 L320 170 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
  <path d="M160 250 L160 262 L320 342 L320 330 Z" fill="url(#halftone-dense)" stroke="#2563EB" stroke-width="1" />
  <path d="M320 330 L320 342 L480 262 L480 250 Z" fill="url(#halftone-light)" stroke="#3B82F6" stroke-width="1" />

  <!-- Isometric Upright 3D Shield (Left Facet) -->
  <path d="M320 110 L220 160 L220 230 C220 280 320 320 320 320 L320 110 Z" 
        fill="url(#shieldGrad)" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M320 110 L220 160 L220 230 C220 280 320 320 320 320 L320 110 Z" 
        fill="url(#halftone-medium)" opacity="0.6" />

  <!-- Isometric Upright 3D Shield (Right Facet) -->
  <path d="M320 110 L420 160 L420 230 C420 280 320 320 320 320 L320 110 Z" 
        fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M320 110 L420 160 L420 230 C420 280 320 320 320 320 L320 110 Z" 
        fill="url(#halftone-light)" opacity="0.4" />

  <!-- Central Crest / Warning Triangle inside Shield -->
  <g transform="translate(320, 215) scale(0.9)">
    <path d="M0 -45 L35 15 L-35 15 Z" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" />
    <line x1="0" y1="-22" x2="0" y2="-2" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="7" r="1.8" fill="#2563EB" />
  </g>

  <!-- Isometric 3D Magnifying Glass Loupe Floating in Foreground -->
  <g transform="translate(390, 190)">
    <!-- Shadow projection -->
    <ellipse cx="0" cy="70" rx="60" ry="24" fill="#000000" opacity="0.08" />

    <!-- Loupe Outer Ring (Isometric Ellipse) -->
    <ellipse cx="0" cy="0" rx="64" ry="38" fill="url(#shieldGrad)" stroke="#1D4ED8" stroke-width="3.5" transform="rotate(-25)" />
    <!-- Loupe Inner Lens -->
    <ellipse cx="0" cy="0" rx="52" ry="28" fill="#EFF6FF" fill-opacity="0.45" stroke="#3B82F6" stroke-width="1.8" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="52" ry="28" fill="url(#halftone-dense)" opacity="0.25" transform="rotate(-25)" />

    <!-- Loupe Lens Glare -->
    <path d="M-28 -12 Q0 -22 30 -8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" transform="rotate(-25)" />

    <!-- Loupe Handle (Isometric Cylinder extending down-right) -->
    <path d="M48 20 L105 50 L95 62 L38 32 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="2" />
    <path d="M48 20 L105 50 L95 62 L38 32 Z" fill="url(#halftone-dense)" opacity="0.8" />
    <!-- Handle grip tip -->
    <ellipse cx="100" cy="56" rx="8" ry="5" fill="#1E40AF" transform="rotate(30 100 56)" />
  </g>

  <!-- Technical Telemetry Badges & Floating Nodes -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#2563EB" font-weight="700">
    <!-- Top-left status -->
    <text x="44" y="52">NODE_ID: CM-SHIELD-01</text>
    <text x="44" y="66" fill="#64748B" font-weight="400">ZERO_TRUST_VERIFIED // 256-BIT</text>

    <!-- Interactive Data Pins -->
    <circle cx="210" cy="150" r="3" fill="#2563EB" />
    <line x1="210" y1="150" x2="160" y2="120" stroke="#2563EB" stroke-width="1" stroke-dasharray="2 2" />
    <rect x="80" y="106" width="76" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
    <text x="86" y="120" font-size="8">SIG_SCAN: 0x8F</text>

    <circle cx="430" cy="240" r="3" fill="#2563EB" />
    <line x1="430" y1="240" x2="480" y2="280" stroke="#2563EB" stroke-width="1" stroke-dasharray="2 2" />
    <rect x="484" y="270" width="86" height="20" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
    <text x="490" y="284" font-size="8">LATENCY: 0.8ms</text>
  </g>
</svg>
