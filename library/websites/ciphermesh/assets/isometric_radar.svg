<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="radar-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#3B82F6" opacity="0.6" />
    </pattern>
    <pattern id="radar-dense" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.8" fill="#2563EB" />
    </pattern>
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Technical Corner Ticks -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="24" y1="30" x2="36" y2="30" />
    <line x1="30" y1="24" x2="30" y2="36" />
    <line x1="604" y1="30" x2="616" y2="30" />
    <line x1="610" y1="24" x2="610" y2="36" />
    <line x1="24" y1="390" x2="36" y2="390" />
    <line x1="30" y1="384" x2="30" y2="396" />
    <line x1="604" y1="390" x2="616" y2="390" />
    <line x1="610" y1="384" x2="610" y2="396" />
  </g>

  <!-- Outer Technical Box -->
  <rect x="30" y="30" width="580" height="360" rx="4" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Technical Icons top-left -->
  <g stroke="#2563EB" stroke-width="1.5" fill="none">
    <!-- Starburst -->
    <path d="M46 52 L56 52 M51 47 L51 57 M47 48 L55 56 M47 56 L55 48" />
    <!-- Scan target -->
    <path d="M68 47 L76 47 M68 47 L68 55 M86 47 L78 47 M86 47 L86 55 M68 62 L68 70 M68 70 L76 70 M86 70 L78 70 M86 70 L86 62" />
    <!-- Window/Shield -->
    <rect x="98" y="47" width="18" height="14" rx="2" />
    <line x1="98" y1="52" x2="116" y2="52" />
  </g>

  <!-- Main Isometric Radar Ellipse Base -->
  <g transform="translate(320, 230)">
    <!-- Base Platform Rim -->
    <ellipse cx="0" cy="30" rx="220" ry="110" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Depth Extrusion -->
    <path d="M-220 30 C-220 90 220 90 220 30 L220 48 C220 108 -220 108 -220 48 Z" fill="url(#radar-dense)" stroke="#2563EB" stroke-width="1.2" />

    <!-- Top Radar Dish Face -->
    <ellipse cx="0" cy="0" rx="210" ry="105" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="210" ry="105" fill="url(#radar-dots)" opacity="0.4" />

    <!-- Concentric Range Rings -->
    <ellipse cx="0" cy="0" rx="160" ry="80" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 4" />
    <ellipse cx="0" cy="0" rx="110" ry="55" fill="none" stroke="#2563EB" stroke-width="1.2" />
    <ellipse cx="0" cy="0" rx="60" ry="30" fill="none" stroke="#60A5FA" stroke-width="1" />

    <!-- Crosshair Axes -->
    <line x1="-210" y1="0" x2="210" y2="0" stroke="#93C5FD" stroke-width="1.2" />
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#93C5FD" stroke-width="1.2" />
    <line x1="-148" y1="-74" x2="148" y2="74" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="-148" y1="74" x2="148" y2="-74" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Rotating Radar Sweep Cone Sector -->
    <path d="M0 0 L150 -55 C190 -20 205 10 205 30 Z" fill="url(#sweepGrad)" stroke="#2563EB" stroke-width="1.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Center Radar Core / Node -->
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#2563EB" />
    <ellipse cx="0" cy="-4" rx="14" ry="7" fill="#60A5FA" />
    <circle cx="0" cy="-5" r="3" fill="#FFFFFF" />

    <!-- Detected Threat Blips -->
    <g transform="translate(100, -35)">
      <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
      <circle cx="0" cy="0" r="9" fill="none" stroke="#EF4444" stroke-width="1">
        <animate attributeName="r" values="4.5;14;4.5" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>

    <g transform="translate(-115, 25)">
      <circle cx="0" cy="0" r="3.5" fill="#2563EB" />
      <circle cx="0" cy="0" r="7" fill="none" stroke="#2563EB" stroke-width="1" />
    </g>

    <g transform="translate(65, 45)">
      <circle cx="0" cy="0" r="3.5" fill="#2563EB" />
    </g>

    <!-- Peripheral Perimeter Bar Chart / Signal Spectrum -->
    <g transform="translate(130, -85)">
      <rect x="0" y="20" width="5" height="15" fill="#2563EB" />
      <rect x="8" y="10" width="5" height="25" fill="#2563EB" />
      <rect x="16" y="5" width="5" height="30" fill="#3B82F6" />
      <rect x="24" y="15" width="5" height="20" fill="#60A5FA" />
      <rect x="32" y="22" width="5" height="13" fill="#93C5FD" />
    </g>

    <!-- Peripheral Shield Node on Rim -->
    <g transform="translate(155, 30) scale(0.65)">
      <path d="M0 -30 L25 -10 L25 15 C25 35 0 50 0 50 C0 50 -25 35 -25 15 L-25 -10 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" />
      <path d="M0 -15 L12 0 L-2 15" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Technical Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#2563EB" font-weight="700">
    <text x="44" y="360">PERIMETER_STATUS: ARMED</text>
    <text x="44" y="374" fill="#64748B" font-weight="400">RADAR_SWEEP: 360° // FREQ: 9.4 GHz</text>
    <text x="470" y="374" fill="#EF4444" text-anchor="end">ANOMALY_DETECTED // IP_BLOCK: ACTIVE</text>
  </g>
</svg>
