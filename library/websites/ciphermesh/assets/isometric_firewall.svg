<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="fw-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#2563EB" />
    </pattern>
    <pattern id="fw-light" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#60A5FA" />
    </pattern>
  </defs>

  <!-- Technical Corner Ticks -->
  <g stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="24" y1="30" x2="36" y2="30" />
    <line x1="30" y1="24" x2="30" y2="36" />
    <line x1="604" y1="30" x2="616" y2="30" />
    <line x1="610" y1="24" x2="610" y2="36" />
    <line x1="24" y1="390" x2="36" y2="390" />
    <line x1="30" y1="384" x2="30" y2="396" />
    <line x1="604" y1="390" x2="616" y2="390" />
    <line x1="610" y1="384" x2="610" y2="396" />
  </g>

  <!-- Outer Technical Box -->
  <rect x="30" y="30" width="580" height="360" rx="4" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Isometric Brick Firewall Wall Structure -->
  <g transform="translate(360, 200)">
    <!-- Base shadow -->
    <path d="M-180 120 L80 20 L240 100 L-20 200 Z" fill="#000000" opacity="0.04" />

    <!-- Isometric Brick Blocks (Angled 30/30 degrees) -->
    <!-- Layer 1 (Bottom row of bricks) -->
    <!-- Brick 1 -->
    <path d="M-80 110 L-30 85 L10 105 L-40 130 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M-40 130 L10 105 L10 135 L-40 160 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M-80 110 L-40 130 L-40 160 L-80 140 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Brick 2 -->
    <path d="M10 105 L60 80 L100 100 L50 125 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M50 125 L100 100 L100 130 L50 155 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M10 105 L50 125 L50 155 L10 135 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Brick 3 -->
    <path d="M100 100 L150 75 L190 95 L140 120 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M140 120 L190 95 L190 125 L140 150 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M100 100 L140 120 L140 150 L100 130 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Layer 2 (Middle row of bricks) -->
    <!-- Brick 4 -->
    <path d="M-55 75 L-5 50 L35 70 L-15 95 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M-15 95 L35 70 L35 100 L-15 125 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M-55 75 L-15 95 L-15 125 L-55 105 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Brick 5 -->
    <path d="M35 70 L85 45 L125 65 L75 90 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M75 90 L125 65 L125 95 L75 120 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M35 70 L75 90 L75 120 L35 100 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Layer 3 (Top row of bricks) -->
    <!-- Brick 6 -->
    <path d="M-30 40 L20 15 L60 35 L10 60 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M10 60 L60 35 L60 65 L10 90 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M-30 40 L10 60 L10 90 L-30 70 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Brick 7 -->
    <path d="M60 35 L110 10 L150 30 L100 55 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
    <path d="M100 55 L150 30 L150 60 L100 85 Z" fill="url(#fw-dots)" stroke="#2563EB" stroke-width="1.4" />
    <path d="M60 35 L100 55 L100 85 L60 65 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4" />

    <!-- Central Interlocking Defense Shield in Front of Wall -->
    <g transform="translate(10, 80) scale(1.15)">
      <!-- Shield outline -->
      <path d="M0 -50 L42 -25 L42 20 C42 55 0 80 0 80 C0 80 -42 55 -42 20 L-42 -25 Z" 
            fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.8" stroke-linejoin="round" />
      <path d="M0 -50 L42 -25 L42 20 C42 55 0 80 0 80 C0 80 -42 55 -42 20 L-42 -25 Z" 
            fill="url(#fw-light)" opacity="0.5" />
      <!-- Checkmark emblem -->
      <path d="M-15 15 L-4 26 L20 2" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Malicious Packet Rays / Threat Vectors Incoming from Left -->
    <g stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round">
      <line x1="-220" y1="20" x2="-20" y2="70" stroke-dasharray="4 4" />
      <line x1="-240" y1="70" x2="-35" y2="90" stroke-dasharray="6 3" />
      <line x1="-210" y1="120" x2="-25" y2="105" stroke-dasharray="5 5" />
      <line x1="-190" y1="150" x2="-15" y2="120" stroke-dasharray="4 4" />

      <!-- Deflection Bursts at Impact -->
      <circle cx="-20" cy="70" r="3" fill="#2563EB" />
      <circle cx="-35" cy="90" r="4" fill="#2563EB" />
      <circle cx="-25" cy="105" r="3" fill="#2563EB" />
      <circle cx="-15" cy="120" r="3" fill="#2563EB" />
      
      <!-- Deflected rays bouncing back -->
      <line x1="-35" y1="90" x2="-80" y2="50" stroke="#93C5FD" stroke-width="1.2" />
      <line x1="-25" y1="105" x2="-75" y2="135" stroke="#93C5FD" stroke-width="1.2" />
    </g>
  </g>

  <!-- Technical Telemetry -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#2563EB" font-weight="700">
    <text x="44" y="360">FIREWALL_THROUGHPUT: 40 Gbps</text>
    <text x="44" y="374" fill="#64748B" font-weight="400">ISOLATION: 100% // PACKET_DROP: 0.0001%</text>
    <text x="580" y="374" fill="#2563EB" text-anchor="end">AI_FILTER: ENABLED [ACTIVE_DEFENSE]</text>
  </g>
</svg>
