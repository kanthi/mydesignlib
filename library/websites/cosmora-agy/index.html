  <style>
    /* =========================================================================
       1. SCALING & DESIGN SYSTEM TOKENS
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dw: 1353;
      --dh: 1163;
      --gutter: 25;
      --u: max(min(.72px, calc(100vh / 700)), min(calc(100vw / 1353), calc(100vh / 1163)));
      --dh-px: calc(1163 * var(--u));
      --vshift: calc(max(0px, (100vh - var(--dh-px))) * .42);
      --ink: #ffffff;
      --cyan: #79dce8;
      --cyan-logo: #5fd0e1;
      --rule: rgba(255, 255, 255, .23);
      --btn-ink: #071227;
      --font-serif: 'Prata', Georgia, serif;
      --font-body: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
      --font-logo: 'Poppins', sans-serif;
    }

    @supports (height: 100dvh) {
      :root {
        --u: max(min(.72px, calc(100dvh / 700)), min(calc(100vw / 1353), calc(100dvh / 1163)));
        --vshift: calc(max(0px, (100dvh - var(--dh-px))) * .42);
      }
    }

    html, body {
      height: 100%;
    }

    body {
      background: #04101f;
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    /* =========================================================================
       2. FULL-VIEWPORT STAGE & SKY
       ========================================================================= */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .sky {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .sky video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .22s linear;
    }

    .sky video.is-active {
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .sky video {
        display: none;
      }
    }

    /* =========================================================================
       3. UI LAYER & NAVIGATION
       ========================================================================= */
    .ui {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 6;
      height: calc(88 * var(--u));
    }

    .navbar::after {
      content: "";
      position: absolute;
      left: calc(25 * var(--u));
      right: calc(49 * var(--u));
      top: calc(86 * var(--u));
      height: calc(2 * var(--u));
      background: var(--rule);
    }

    .navrow {
      position: absolute;
      left: calc(25 * var(--u));
      right: calc(49 * var(--u));
      top: 0;
      height: calc(86 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-logo);
      font-weight: 600;
      font-size: calc(20 * var(--u));
      letter-spacing: calc(-0.15 * var(--u));
      line-height: 1;
      color: #ffffff;
      text-decoration: none;
      white-space: nowrap;
      position: relative;
      top: calc(-1 * var(--u));
    }

    .logo i {
      font-style: normal;
      color: var(--cyan-logo);
    }

    .burger {
      display: none;
      position: relative;
      width: calc(46 * var(--u));
      height: calc(46 * var(--u));
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(6 * var(--u));
      flex: none;
    }

    .burger span {
      display: block;
      width: calc(24 * var(--u));
      height: calc(2 * var(--u));
      border-radius: calc(2 * var(--u));
      background: #ffffff;
      transition: transform .28s cubic-bezier(.4, 0, .2, 1), opacity .18s linear;
    }

    .navrow[data-open="true"] .burger span:nth-child(1) {
      transform: translateY(calc(8 * var(--u))) rotate(45deg);
    }
    .navrow[data-open="true"] .burger span:nth-child(2) {
      opacity: 0;
    }
    .navrow[data-open="true"] .burger span:nth-child(3) {
      transform: translateY(calc(-8 * var(--u))) rotate(-45deg);
    }

    .links {
      display: flex;
      align-items: center;
    }

    .links a {
      position: relative;
      display: flex;
      align-items: center;
      height: calc(86 * var(--u));
      font-size: calc(18.4 * var(--u));
      font-weight: 400;
      line-height: 1;
      color: #ffffff;
      text-decoration: none;
      padding: 0 calc(17.5 * var(--u));
      letter-spacing: calc(-1 * var(--u));
      white-space: nowrap;
      transition: color 0.18s ease;
    }

    .links a:hover {
      color: var(--cyan);
    }

    .links a[aria-current="page"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc(83.5 * var(--u));
      height: calc(4 * var(--u));
      background: var(--cyan);
      border-radius: calc(1 * var(--u));
    }

    .links a:nth-child(2) { margin-left: calc(24 * var(--u)); }
    .links a:nth-child(3) { margin-left: calc(26 * var(--u)); letter-spacing: calc(-1.75 * var(--u)); }
    .links a:nth-child(4) { margin-left: calc(27 * var(--u)); }

    .links a.enroll {
      margin-left: calc(28.5 * var(--u));
      width: calc(107 * var(--u));
      height: calc(38 * var(--u));
      border-radius: calc(19 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(17 * var(--u));
      font-weight: 600;
      letter-spacing: calc(-0.75 * var(--u));
      line-height: 1;
      color: var(--btn-ink);
      text-decoration: none;
      padding-top: calc(2 * var(--u));
      background: linear-gradient(180deg, #ffffff 0%, #d8ecfe 9%, #dceefe 72%, #f4f9ff 100%);
      box-shadow: 0 calc(3 * var(--u)) calc(14 * var(--u)) rgba(255, 255, 255, .22),
                  inset 0 0 0 calc(1.5 * var(--u)) rgba(255, 255, 255, .92);
      flex: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .links a.enroll:hover {
      transform: translateY(-1px);
      box-shadow: 0 calc(6 * var(--u)) calc(20 * var(--u)) rgba(255, 255, 255, .35);
    }

    /* =========================================================================
       4. HERO CENTER STAGE COPY & CONTROLS
       ========================================================================= */
    .copy {
      position: absolute;
      inset: 0;
      transform: translateY(var(--vshift));
      pointer-events: none;
    }

    .copy a, .copy button {
      pointer-events: auto;
    }

    .col {
      position: absolute;
      left: 0;
      right: calc(var(--gutter) * var(--u));
      text-align: center;
    }

    .eyebrow {
      top: calc(160 * var(--u));
      font-size: calc(22 * var(--u));
      font-weight: 500;
      letter-spacing: calc(6.5 * var(--u));
      text-indent: calc(6.5 * var(--u));
      color: #ffffff;
      opacity: 0.9;
    }

    h1.title {
      top: calc(212 * var(--u));
      font-family: var(--font-serif);
      font-size: calc(128 * var(--u));
      font-weight: 400;
      letter-spacing: calc(2 * var(--u));
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    }

    .rule {
      top: calc(364 * var(--u));
      display: flex;
      justify-content: center;
    }

    .rule span {
      display: block;
      width: calc(108 * var(--u));
      height: calc(4 * var(--u));
      background: var(--cyan);
      border-radius: calc(2 * var(--u));
    }

    p.lede {
      top: calc(398 * var(--u));
      font-size: calc(18.5 * var(--u));
      line-height: calc(30 * var(--u));
      color: rgba(255, 255, 255, 0.88);
      max-width: calc(730 * var(--u));
      margin: 0 auto;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
    }

    .cta {
      top: calc(534 * var(--u));
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: calc(216 * var(--u));
      height: calc(66 * var(--u));
      border-radius: calc(33 * var(--u));
      font-size: calc(17 * var(--u));
      font-weight: 700;
      letter-spacing: 0;
      text-indent: 0;
      line-height: 1;
      color: var(--btn-ink);
      text-decoration: none;
      padding-top: calc(2 * var(--u));
      background: linear-gradient(180deg, #ffffff 0%, #d6e8f8 4%, #d9ecfe 72%, #ffffff 100%);
      box-shadow: 0 calc(10 * var(--u)) calc(18 * var(--u)) calc(-8 * var(--u)) rgba(255, 255, 255, .50),
                  0 0 calc(26 * var(--u)) rgba(255, 255, 255, .18),
                  inset 0 0 0 calc(2 * var(--u)) rgba(255, 255, 255, .9);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta a:hover {
      transform: scale(1.03);
      box-shadow: 0 calc(14 * var(--u)) calc(24 * var(--u)) rgba(255, 255, 255, .6);
    }

    /* =========================================================================
       5. ROTATING SIDE PLANETS & LABELS
       ========================================================================= */
    .planet {
      position: absolute;
      z-index: 2;
      padding: 0;
      border: 0;
      background: none;
      -webkit-appearance: none;
      appearance: none;
      line-height: 0;
      cursor: pointer;
      pointer-events: auto;
      transition: transform .45s cubic-bezier(.22, 1, .36, 1);
    }

    .planet img {
      display: none;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
    }

    .planet img.is-shown {
      display: block;
    }

    .planet:hover {
      transform: scale(1.06);
    }

    .planet:active {
      transform: scale(.98);
    }

    .planet-l {
      width: calc(143 * var(--u));
      left: calc(-69.5 * var(--u));
      top: calc(-38.3 * var(--u));
    }

    .planet-r {
      width: calc(143 * var(--u));
      right: calc(-64.7 * var(--u));
      top: calc(-40.6 * var(--u));
    }

    .label {
      position: absolute;
      top: calc(33 * var(--u));
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: calc(17.8 * var(--u));
      letter-spacing: calc(4.6 * var(--u));
      line-height: 1;
      color: #ffffff;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }

    .label.label-l {
      left: calc(111 * var(--u));
    }

    .label.label-r {
      right: calc(104 * var(--u));
    }

    /* Bottom Down-Arrow Scroll Control */
    .scroll {
      position: absolute;
      z-index: 4;
      left: 50%;
      margin-left: calc((-48 - (var(--gutter) / 2)) * var(--u));
      bottom: calc(68 * var(--u));
      width: calc(96 * var(--u));
      height: calc(96 * var(--u));
      border-radius: 50%;
      background: rgba(24, 30, 42, .70);
      -webkit-backdrop-filter: blur(calc(6 * var(--u)));
      backdrop-filter: blur(calc(6 * var(--u)));
      border: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .scroll:hover {
      background: rgba(36, 45, 64, .9);
      transform: translateY(-2px);
    }

    .scroll svg {
      width: calc(20 * var(--u));
      height: calc(25 * var(--u));
      display: block;
    }

    /* Focus accessibility */
    .scroll:focus-visible, .links a:focus-visible, .enroll:focus-visible,
    .cta a:focus-visible, .logo:focus-visible {
      outline: calc(2 * var(--u)) solid var(--cyan);
      outline-offset: calc(3 * var(--u));
    }

    .planet:focus-visible {
      outline: calc(2 * var(--u)) solid var(--cyan);
      outline-offset: calc(6 * var(--u));
      border-radius: 50%;
    }

    /* =========================================================================
       6. RESPONSIVE BREAKPOINTS
       ========================================================================= */
    /* A) Nav collapse below 1030px */
    @media (max-width: 1030px), (max-height: 620px) {
      .navrow {
        left: calc(25 * var(--u));
        right: calc(25 * var(--u));
      }
      .burger {
        display: flex;
      }
      .links {
        position: absolute;
        top: calc(96 * var(--u));
        right: 0;
        z-index: 5;
        width: min(calc(324 * var(--u)), calc(100vw - 50 * var(--u)));
        flex-direction: column;
        align-items: stretch;
        padding: calc(12 * var(--u));
        border-radius: calc(20 * var(--u));
        background: rgba(9, 21, 42, .88);
        backdrop-filter: blur(calc(18 * var(--u)));
        -webkit-backdrop-filter: blur(calc(18 * var(--u)));
        border: calc(1 * var(--u)) solid rgba(255, 255, 255, .14);
        box-shadow: 0 calc(18 * var(--u)) calc(44 * var(--u)) rgba(2, 8, 20, .55);
        opacity: 0;
        visibility: hidden;
        transform: translateY(calc(-10 * var(--u)));
        transition: opacity .24s ease, transform .28s cubic-bezier(.4, 0, .2, 1), visibility .28s;
      }
      .navrow[data-open="true"] .links {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .links a:nth-child(n) {
        margin-left: 0;
        height: auto;
        justify-content: flex-start;
        padding: calc(14 * var(--u)) calc(16 * var(--u));
        font-size: calc(19 * var(--u));
        letter-spacing: calc(-.6 * var(--u));
      }
      .links a + a {
        border-top: calc(1 * var(--u)) solid rgba(255, 255, 255, .08);
      }
      .links a[aria-current="page"]::after {
        top: auto;
        bottom: calc(9 * var(--u));
        left: calc(16 * var(--u));
        right: auto;
        width: calc(26 * var(--u));
        height: calc(3 * var(--u));
      }
      .links a.enroll {
        margin: calc(14 * var(--u)) 0 calc(2 * var(--u));
        width: 100%;
        height: calc(46 * var(--u));
        border-radius: calc(23 * var(--u));
        justify-content: center;
        padding-top: calc(2 * var(--u));
        font-size: calc(18 * var(--u));
        letter-spacing: calc(-.4 * var(--u));
        border-top: 0;
      }
      .links a.enroll::after {
        content: none;
      }
    }

    /* B) Tablet */
    @media (min-width: 580px) and (max-width: 1030px) and (min-height: 621px) {
      :root {
        --gutter: 0;
        --u: min(max(min(.85px, calc(100vh / 780)), min(calc(100vw / 900), calc(100vh / 1163))), 1.15px);
        --dh-px: calc(1120 * var(--u));
        --vshift: calc(max(0px, (100vh - var(--dh-px))) * .38);
      }
      .navbar::after {
        left: calc(25 * var(--u));
        right: calc(25 * var(--u));
      }
      p.lede br {
        display: none;
      }
      p.lede {
        max-width: calc(620 * var(--u));
        margin-left: auto;
        margin-right: auto;
      }
      .label.label-r {
        right: calc(116 * var(--u));
      }
    }

    /* C) Phone */
    @media (max-width: 579px), (max-height: 620px) {
      :root {
        --gutter: 0;
        --u: max(min(.92px, calc(100vh / 620)), min(calc(100vw / 430), calc(100vh / 880)));
        --dh-px: calc(880 * var(--u));
        --vshift: calc(max(0px, (100vh - var(--dh-px))) * .34);
      }
      .navbar {
        height: calc(76 * var(--u));
      }
      .navbar::after {
        left: calc(24 * var(--u));
        right: calc(24 * var(--u));
        top: calc(74 * var(--u));
      }
      .navrow {
        left: calc(24 * var(--u));
        right: calc(24 * var(--u));
        height: calc(74 * var(--u));
      }
      .links {
        top: calc(84 * var(--u));
      }
      .copy {
        top: calc(76 * var(--u));
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(48 * var(--u)) calc(26 * var(--u)) 0;
      }
      .col {
        position: static;
        width: 100%;
        right: auto;
      }
      .eyebrow {
        font-size: calc(20 * var(--u));
        letter-spacing: calc(5 * var(--u));
        text-indent: calc(5 * var(--u));
      }
      h1.title {
        font-size: calc(78 * var(--u));
        margin-top: calc(12 * var(--u));
      }
      .rule {
        margin-top: calc(16 * var(--u));
        height: calc(4 * var(--u));
      }
      .rule span {
        width: calc(84 * var(--u));
      }
      p.lede {
        margin-top: calc(16 * var(--u));
        font-size: calc(15.5 * var(--u));
        line-height: calc(24 * var(--u));
        max-width: calc(400 * var(--u));
      }
      p.lede br {
        display: none;
      }
      .cta {
        top: auto;
        margin-top: calc(28 * var(--u));
        height: calc(60 * var(--u));
        position: relative;
      }
      .cta a {
        width: calc(190 * var(--u));
        height: calc(60 * var(--u));
        border-radius: calc(30 * var(--u));
      }
      .label {
        top: 50%;
        transform: translateY(-50%);
        font-size: calc(16 * var(--u));
        letter-spacing: calc(4 * var(--u));
      }
      .label.label-l {
        left: calc(56 * var(--u));
      }
      .label.label-r {
        right: calc(60 * var(--u));
      }
      .planet-l {
        width: calc(89 * var(--u));
        left: calc(-44.5 * var(--u));
        top: calc(-17 * var(--u));
      }
      .planet-r {
        width: calc(89 * var(--u));
        right: calc(-44.5 * var(--u));
        top: calc(-18.3 * var(--u));
      }
      .scroll {
        width: calc(74 * var(--u));
        height: calc(74 * var(--u));
        margin-left: calc(-37 * var(--u));
        bottom: calc(42 * var(--u));
      }
      .scroll svg {
        width: calc(15.5 * var(--u));
        height: calc(19.5 * var(--u));
      }
    }

    @media (max-width: 500px) {
      .label {
        top: calc(100% + 28 * var(--u));
        transform: none;
        font-size: calc(14 * var(--u));
      }
      .label.label-l { left: calc(8 * var(--u)); }
      .label.label-r { right: calc(8 * var(--u)); }
    }

    /* =========================================================================
       7. ONE-SHOT ENTRANCE ANIMATIONS
       ========================================================================= */
    @keyframes ent-reveal { from { transform: translateY(115%); } to { transform: translateY(0); } }
    @keyframes ent-rise   { from { opacity: 0; transform: translateY(var(--rise, 10px)); } to { opacity: 1; transform: none; } }
    @keyframes ent-settle { from { opacity: 0; transform: translateY(var(--rise, 8px)) scale(.965); } to { opacity: 1; transform: none; } }
    @keyframes ent-draw   { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes ent-fade   { from { opacity: 0; } to { opacity: 1; } }

    .anim {
      --e-expo: cubic-bezier(.16, 1, .3, 1);
      --e-quint: cubic-bezier(.22, 1, .36, 1);
      --e-slow: cubic-bezier(.4, 0, .2, 1);
    }
    .ent-mask, .ent-line { display: block; }
    .anim .ent-mask { overflow: hidden; padding-top: .18em; margin-top: -.18em; }
    .anim .ent-line { transform: translateY(115%); will-change: transform; }
    .anim .navbar::after, .anim .links a[aria-current="page"]::after, .anim .rule span { transform: scaleX(0); }
    .anim .logo, .anim .links a, .anim .burger, .anim p.lede, .anim .label, .anim .cta a,
    .anim .scroll, .anim .sky { opacity: 0; }
    .anim .sky { will-change: opacity; }

    .anim.play .sky                               { animation: ent-fade 1.6s var(--e-slow) .25s both; }
    .anim.play .navbar::after                     { animation: ent-draw .9s var(--e-expo) .12s both; }
    .anim.play .logo                              { --rise: calc(8 * var(--u)); animation: ent-rise .6s var(--e-quint) .20s both; }
    .anim.play .links a:nth-child(1)              { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .26s both; }
    .anim.play .links a:nth-child(2)              { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .31s both; }
    .anim.play .links a:nth-child(3)              { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .36s both; }
    .anim.play .links a:nth-child(4)              { --rise: calc(8 * var(--u)); animation: ent-rise .55s var(--e-quint) .41s both; }
    .anim.play .links a.enroll, .anim.play .burger{ --rise: calc(8 * var(--u)); animation: ent-settle .6s var(--e-quint) .46s both; }
    .anim.play .links a[aria-current]::after      { animation: ent-draw .55s var(--e-expo) .60s both; }
    .anim.play .eyebrow .ent-line                 { animation: ent-reveal .75s var(--e-expo) .30s both; }
    .anim.play h1.title .ent-line                 { animation: ent-reveal .95s var(--e-expo) .44s both; }
    .anim.play .rule span                         { animation: ent-draw .65s var(--e-expo) .78s both; }
    .anim.play p.lede                             { --rise: calc(12 * var(--u)); animation: ent-rise .7s var(--e-quint) .86s both; }
    .anim.play .label.label-l                     { --rise: calc(8 * var(--u)); animation: ent-rise .6s var(--e-quint) 1.04s both; }
    .anim.play .label.label-r                     { --rise: calc(8 * var(--u)); animation: ent-rise .6s var(--e-quint) 1.10s both; }
    .anim.play .cta a                             { --rise: calc(8 * var(--u)); animation: ent-settle .7s var(--e-quint) 1.14s both; }
    .anim.play .scroll                            { animation: ent-settle .6s var(--e-quint) 1.42s both; }
  </style>
</head>

<body>
  <div class="stage">
    <!-- Sky & Looping Video Layers -->
    <div class="sky" id="sky-backdrop">
      <video
        data-planet="earth"
        class="is-active"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202422_3ffb4889-c520-432d-8458-038009eb40df.mp4"
        poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png"
        aria-hidden="true"
      ></video>

      <video
        data-planet="venus"
        muted
        loop
        playsinline
        preload="none"
        data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202422_b211cd74-013b-4dd3-bfd0-64491d8696fa.mp4"
        poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png"
        aria-hidden="true"
      ></video>

      <video
        data-planet="mars"
        muted
        loop
        playsinline
        preload="none"
        data-src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202422_51eae59a-2459-4c84-907c-cc5edfe5fea7.mp4"
        poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png"
        aria-hidden="true"
      ></video>
    </div>

    <!-- UI Overlay Layer -->
    <div class="ui">
      <!-- Navbar -->
      <header class="navbar">
        <div class="navrow" id="navrow">
          <a class="logo" href="#">cosmora<i>.ai</i></a>

          <nav class="links" id="site-nav" aria-label="Main Navigation">
            <a href="#planets" aria-current="page">Planets</a>
            <a href="#curriculum">Curriculum</a>
            <a href="#observatory">Observatory</a>
            <a href="#dispatches">Dispatches</a>
            <a class="enroll" href="#enroll" onclick="alert('Welcome to Cosmora Expedition Enrollment!'); return false;">Enroll</a>
          </nav>

          <button class="burger" id="burger-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <!-- Central Orbital Copy & Interactive Planet Controls -->
      <div class="copy">
        <div class="col eyebrow">
          <span class="ent-mask"><span class="ent-line">PLANET</span></span>
        </div>

        <h1 class="col title">
          <span class="ent-mask"><span class="ent-line" id="planet-title">EARTH</span></span>
        </h1>

        <div class="col rule"><span></span></div>

        <p class="col lede" id="planet-lede">
          Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!
        </p>

        <!-- Dynamic Planet Switcher Slots -->
        <div class="col cta">
          <!-- Left Planet Slot Button -->
          <button class="planet planet-l" id="slot-l" type="button" data-slot="l" aria-label="Switch planet">
            <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png" />
            <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png" />
            <img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png" />
          </button>

          <!-- Right Planet Slot Button -->
          <button class="planet planet-r" id="slot-r" type="button" data-slot="r" aria-label="Switch planet">
            <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png" />
            <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png" />
            <img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png" />
          </button>

          <a href="#get-started" onclick="alert('Cosmora Interactive Course Module Unlocked!'); return false;">GET STARTED</a>

          <span class="label label-l" id="label-l"></span>
          <span class="label label-r" id="label-r"></span>
        </div>
      </div>
    </div>

    <!-- Scroll Down Control -->
    <button class="scroll" id="scroll-btn" type="button" aria-label="Explore planetary data">
      <svg viewBox="0 0 26 33" fill="none" aria-hidden="true">
        <path d="M13 1.5 V31.5 M1.9 20.4 L13 31.5 L24.1 20.4" stroke="#ffffff" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
    </button>
  </div>

  <script>
    (function () {
      const ORDER = ['earth', 'venus', 'mars'];

      const PLANETS = {
        earth: {
          name: 'EARTH',
          still: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',
          lede: "Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!"
        },
        venus: {
          name: 'VENUS',
          still: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',
          lede: "The hottest world in our solar system, wrapped in dense clouds of sulfuric acid. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!"
        },
        mars: {
          name: 'MARS',
          still: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png',
          lede: "The rust-red desert world, home to the tallest volcano we know of. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!"
        }
      };

      let currentPlanet = 'earth';

      const sky = document.getElementById('sky-backdrop');
      const videos = sky.querySelectorAll('video');
      const titleEl = document.getElementById('planet-title');
      const ledeEl = document.getElementById('planet-lede');
      const slotL = document.getElementById('slot-l');
      const slotR = document.getElementById('slot-r');
      const labelL = document.getElementById('label-l');
      const labelR = document.getElementById('label-r');

      function warm(planet) {
        const vid = sky.querySelector(`video[data-planet="${planet}"]`);
        if (vid && !vid.src && vid.dataset.src) {
          vid.preload = 'auto';
          vid.src = vid.dataset.src;
          vid.load();
        }
      }

      function show(next) {
        if (!PLANETS[next]) return;
        currentPlanet = next;

        // 1. Switch background video
        videos.forEach(function (vid) {
          const isMatch = vid.dataset.planet === next;
          if (isMatch) {
            if (!vid.src && vid.dataset.src) {
              vid.src = vid.dataset.src;
            }
            vid.classList.add('is-active');
            vid.play().catch(function () {});
          } else {
            vid.classList.remove('is-active');
            vid.pause();
          }
        });

        // 2. Set fallback sky background still
        sky.style.backgroundImage = `url('${PLANETS[next].still}')`;

        // 3. Update title and description
        titleEl.textContent = PLANETS[next].name;
        ledeEl.innerHTML = PLANETS[next].lede;

        // 4. Update the two side slots with the remaining planets
        const remaining = ORDER.filter(p => p !== next);
        const pLeft = remaining[0];
        const pRight = remaining[1];

        // Slot Left
        slotL.dataset.planet = pLeft;
        slotL.setAttribute('aria-label', 'Show ' + PLANETS[pLeft].name);
        slotL.querySelectorAll('img').forEach(img => {
          img.classList.toggle('is-shown', img.dataset.planet === pLeft);
        });
        labelL.textContent = PLANETS[pLeft].name;

        // Slot Right
        slotR.dataset.planet = pRight;
        slotR.setAttribute('aria-label', 'Show ' + PLANETS[pRight].name);
        slotR.querySelectorAll('img').forEach(img => {
          img.classList.toggle('is-shown', img.dataset.planet === pRight);
        });
        labelR.textContent = PLANETS[pRight].name;
      }

      slotL.addEventListener('click', function () { show(this.dataset.planet); });
      slotR.addEventListener('click', function () { show(this.dataset.planet); });

      slotL.addEventListener('pointerenter', function () { warm(this.dataset.planet); });
      slotR.addEventListener('pointerenter', function () { warm(this.dataset.planet); });

      // Initialize Earth
      show('earth');

      // Preload remaining videos in idle time
      setTimeout(function () {
        warm('venus');
        warm('mars');
      }, 2500);

      // Burger toggle navigation
      const navrow = document.getElementById('navrow');
      const burger = document.getElementById('burger-toggle');

      function setBurger(open) {
        navrow.dataset.open = String(open);
        burger.setAttribute('aria-expanded', String(open));
        burger.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
      }

      burger.addEventListener('click', function (e) {
        e.stopPropagation();
        setBurger(navrow.dataset.open !== 'true');
      });

      document.addEventListener('click', function (e) {
        if (!navrow.contains(e.target)) {
          setBurger(false);
        }
      });

      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && navrow.dataset.open === 'true') {
          setBurger(false);
          burger.focus();
        }
      });

      // Entrance animation trigger
      if (document.documentElement.classList.contains('anim')) {
        document.fonts.ready.then(function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.classList.add('play');
              setTimeout(function () {
                document.documentElement.classList.remove('anim', 'play');
              }, 2200);
            });
          });
        });
      }
    })();
  </script>
</body>
</html>
