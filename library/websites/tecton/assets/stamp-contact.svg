<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Circle path for text alignment (r=42, cx=60, cy=60) -->
    <path id="textCircle" d="M 60,60 m -42,0 a 42,42 0 1,1 84,0 a 42,42 0 1,1 -84,0" />
  </defs>
  
  <!-- Outer Blue Disc -->
  <circle cx="60" cy="60" r="58" fill="#1D4ED8" />

  <!-- Rotating Circular Text -->
  <g class="stamp-rotator">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="2.8">
      <textPath href="#textCircle" startOffset="0%">
        CONTACT US • CONTACT US • CONTACT US • 
      </textPath>
    </text>
  </g>

  <!-- Center Arrow -->
  <circle cx="60" cy="60" r="22" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />
  <path d="M 52 52 L 68 68 M 68 68 H 56 M 68 68 V 56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
