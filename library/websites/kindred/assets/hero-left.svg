<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fdf4e2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e8d5b5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="plumShade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d1b24" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#512731" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#512731" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#ede5d8" />
  
  <!-- Warm window light ray across wall -->
  <polygon points="0,0 260,0 380,300 0,300" fill="#fdf7ec" opacity="0.85" />
  <polygon points="60,0 200,0 300,300 120,300" fill="#fffdfa" opacity="0.6" />

  <!-- Wooden tabletop angle -->
  <path d="M 0,160 L 400,120 L 400,300 L 0,300 Z" fill="#d9c3a5" />
  <!-- Folded linen cloth -->
  <path d="M 40,150 C 90,145 160,155 240,140 C 270,160 290,210 260,260 C 180,270 90,260 30,220 Z" fill="#f9f6f2" opacity="0.95" />
  <path d="M 50,155 C 100,150 150,158 220,146 C 240,165 255,200 235,240 C 170,250 95,245 42,210 Z" fill="#f2ede4" opacity="0.5" />

  <!-- Ceramic coffee mug with steam -->
  <ellipse cx="140" cy="180" rx="38" ry="14" fill="#a48c94" opacity="0.3" />
  <rect x="110" y="125" width="46" height="52" rx="6" fill="#f7f3ee" stroke="#512731" stroke-width="1.5" />
  <path d="M 156,135 C 170,135 174,155 156,160" fill="none" stroke="#512731" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="133" cy="126" rx="23" ry="7" fill="#42201b" />
  <ellipse cx="133" cy="126" rx="20" ry="5" fill="#5a3124" />
  <ellipse cx="130" cy="125" rx="14" ry="3" fill="#f9f6f2" opacity="0.25" />

  <!-- Sprig of fresh eucalyptus / olive in small vase -->
  <ellipse cx="280" cy="205" rx="25" ry="9" fill="#512731" opacity="0.2" />
  <path d="M 270,160 C 265,180 268,205 280,205 C 292,205 295,180 290,160 Z" fill="#a48c94" opacity="0.7" />
  <!-- Leaves -->
  <path d="M 280,160 Q 285,110 305,80" fill="none" stroke="#685549" stroke-width="2" />
  <ellipse cx="292" cy="130" rx="14" ry="7" transform="rotate(-30 292 130)" fill="#786c5e" opacity="0.8" />
  <ellipse cx="282" cy="105" rx="12" ry="6" transform="rotate(25 282 105)" fill="#8a7c6e" opacity="0.8" />
  <ellipse cx="302" cy="85" rx="10" ry="5" transform="rotate(-40 302 85)" fill="#9c8e80" opacity="0.85" />

  <!-- Morning ambient warmth vignette -->
  <rect width="400" height="300" fill="url(#warmLight)" opacity="0.5" />
  <rect width="400" height="300" fill="url(#plumShade)" opacity="0.3" />
</svg>