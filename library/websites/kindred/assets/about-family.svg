<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="100%" height="100%">
  
  <defs>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fdf4e2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e8d5b5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="plumShade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d1b24" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#512731" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#512731" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="520" height="400" fill="#eee5d7" />

  <!-- Garden terrace background -->
  <polygon points="0,0 520,0 520,240 0,260" fill="#f6efe3" />
  <path d="M 0,180 Q 260,160 520,180 L 520,400 L 0,400 Z" fill="#dfd0bd" />

  <!-- Gentle olive tree branches framing top -->
  <path d="M 0,20 Q 140,50 240,20" fill="none" stroke="#716254" stroke-width="3" />
  <ellipse cx="70" cy="35" rx="16" ry="7" transform="rotate(25 70 35)" fill="#7d7b69" opacity="0.8" />
  <ellipse cx="120" cy="45" rx="18" ry="8" transform="rotate(-15 120 45)" fill="#8e8b77" opacity="0.85" />
  <ellipse cx="180" cy="30" rx="15" ry="7" transform="rotate(35 180 30)" fill="#7d7b69" opacity="0.8" />
  <ellipse cx="230" cy="22" rx="14" ry="6" transform="rotate(-20 230 22)" fill="#8e8b77" opacity="0.85" />

  <!-- Long wooden communal table -->
  <polygon points="40,230 480,230 460,360 60,360" fill="#bfa78f" stroke="#512731" stroke-width="1.5" />
  <polygon points="120,230 400,230 380,360 140,360" fill="#f9f6f2" opacity="0.9" />

  <!-- Bread board with sourdough loaf -->
  <ellipse cx="260" cy="290" rx="55" ry="24" fill="#a48366" stroke="#512731" stroke-width="1.2" />
  <ellipse cx="260" cy="285" rx="38" ry="16" fill="#694025" />
  <line x1="245" y1="272" x2="245" y2="295" stroke="#faeeb3" stroke-width="2" opacity="0.7" />
  <line x1="260" y1="270" x2="260" y2="298" stroke="#faeeb3" stroke-width="2" opacity="0.7" />
  <line x1="275" y1="272" x2="275" y2="295" stroke="#faeeb3" stroke-width="2" opacity="0.7" />

  <!-- Tea cups on saucers -->
  <ellipse cx="170" cy="295" rx="20" ry="9" fill="#512731" opacity="0.15" />
  <ellipse cx="170" cy="290" rx="16" ry="6" fill="#fdfbf9" stroke="#512731" stroke-width="1.2" />
  <ellipse cx="170" cy="289" rx="12" ry="4" fill="#a48c94" opacity="0.6" />

  <ellipse cx="350" cy="295" rx="20" ry="9" fill="#512731" opacity="0.15" />
  <ellipse cx="350" cy="290" rx="16" ry="6" fill="#fdfbf9" stroke="#512731" stroke-width="1.2" />
  <ellipse cx="350" cy="289" rx="12" ry="4" fill="#a48c94" opacity="0.6" />

  <!-- Gentle editorial caption box overlay -->
  <rect x="70" y="320" width="380" height="42" rx="4" fill="#512731" opacity="0.92" />
  <text x="260" y="346" font-family="sans-serif" font-size="12" font-weight="500" letter-spacing="0.08em" fill="#f9f6f2" text-anchor="middle">
    KINDRED ANNUAL HARVEST &amp; FOUNDERS GATHERING — MILLBROOK
  </text>

  <rect width="520" height="400" fill="url(#warmLight)" opacity="0.35" />
  <rect width="520" height="400" fill="url(#plumShade)" opacity="0.2" />
</svg>