<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fdf4e2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e8d5b5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="plumShade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d1b24" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#512731" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#512731" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#f0e9dc" />

  <!-- Architectural window shadow bars -->
  <path d="M 120,0 L 260,300 L 210,300 L 80,0 Z" fill="#512731" opacity="0.08" />
  <path d="M 240,0 L 380,300 L 340,300 L 210,0 Z" fill="#512731" opacity="0.08" />
  <polygon points="0,0 400,0 400,160 0,220" fill="#fff9ef" opacity="0.7" />

  <!-- Wooden Floorboards -->
  <line x1="0" y1="210" x2="400" y2="180" stroke="#d5c4af" stroke-width="1.5" />
  <line x1="0" y1="250" x2="400" y2="225" stroke="#d5c4af" stroke-width="1.5" />
  <line x1="0" y1="290" x2="400" y2="270" stroke="#d5c4af" stroke-width="1.5" />

  <!-- Wooden architectural building blocks pyramid -->
  <ellipse cx="180" cy="245" rx="70" ry="16" fill="#512731" opacity="0.18" />
  
  <!-- Base block 1 (butter yellow) -->
  <polygon points="120,210 160,200 190,210 150,222" fill="#faeeb3" stroke="#512731" stroke-width="1.2" />
  <polygon points="120,210 150,222 150,246 120,234" fill="#eddca0" stroke="#512731" stroke-width="1.2" />
  <polygon points="150,222 190,210 190,234 150,246" fill="#dfcd90" stroke="#512731" stroke-width="1.2" />

  <!-- Base block 2 (warm terracotta plum) -->
  <polygon points="195,208 235,198 265,208 225,220" fill="#bd9fa7" stroke="#512731" stroke-width="1.2" />
  <polygon points="195,208 225,220 225,244 195,232" fill="#a4848d" stroke="#512731" stroke-width="1.2" />
  <polygon points="225,220 265,208 265,232 225,244" fill="#8f6e77" stroke="#512731" stroke-width="1.2" />

  <!-- Arch top block (linen neutral) -->
  <polygon points="155,175 195,165 225,175 185,187" fill="#fdfbf7" stroke="#512731" stroke-width="1.2" />
  <polygon points="155,175 185,187 185,209 155,197" fill="#ede8dc" stroke="#512731" stroke-width="1.2" />
  <polygon points="185,187 225,175 225,197 185,209" fill="#d9d3c5" stroke="#512731" stroke-width="1.2" />

  <!-- Open storybook leaning against blocks -->
  <polygon points="250,195 295,175 320,200 270,225" fill="#fdfdfc" stroke="#512731" stroke-width="1.2" />
  <polygon points="220,195 250,195 270,225 240,225" fill="#ece6dc" stroke="#512731" stroke-width="1.2" />
  
  <rect width="400" height="300" fill="url(#warmLight)" opacity="0.4" />
  <rect width="400" height="300" fill="url(#plumShade)" opacity="0.25" />
</svg>