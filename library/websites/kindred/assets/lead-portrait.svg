<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="100%" height="100%">
  
  <defs>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fdf4e2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e8d5b5" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="plumShade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d1b24" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#512731" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#512731" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="460" height="560" fill="#ede3d5" />

  <!-- Soft organic backdrop gradient -->
  <radialGradient id="sunGlow" cx="60%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#fff8ed" stop-opacity="1" />
    <stop offset="60%" stop-color="#edd9bf" stop-opacity="0.7" />
    <stop offset="100%" stop-color="#d6bca0" stop-opacity="0.4" />
  </radialGradient>
  <rect width="460" height="560" fill="url(#sunGlow)" />

  <!-- Architectural window frame & sheer curtains -->
  <rect x="30" y="40" width="400" height="480" rx="4" fill="none" stroke="#512731" stroke-opacity="0.12" stroke-width="1.5" />
  <line x1="230" y1="40" x2="230" y2="520" stroke="#512731" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Parent & child silhouette in warm plum and terracotta tones -->
  <ellipse cx="230" cy="530" rx="140" ry="70" fill="#512731" opacity="0.8" />
  <path d="M 120,530 C 130,360 170,270 230,270 C 290,270 330,360 340,530 Z" fill="#401e26" />
  <path d="M 230,270 L 230,530" stroke="#f7eaa5" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3" />

  <!-- Parent head -->
  <ellipse cx="230" cy="210" rx="44" ry="54" fill="#cca892" />
  <path d="M 180,210 C 180,140 270,130 280,200 C 265,190 240,185 210,195 C 190,200 185,210 180,210 Z" fill="#36171e" />

  <!-- Toddler leaning into shoulder -->
  <ellipse cx="175" cy="330" rx="34" ry="40" fill="#d9b6a0" />
  <path d="M 150,320 C 145,280 200,270 205,310 C 195,300 180,300 165,310 Z" fill="#694030" />
  <path d="M 140,360 C 130,420 150,490 190,500 C 220,490 230,430 220,360 Z" fill="#faeeb3" />

  <!-- The Open Book held between both pairs of hands -->
  <polygon points="175,410 220,395 265,410 220,425" fill="#fdfcf8" stroke="#512731" stroke-width="1.5" />
  <line x1="220" y1="395" x2="220" y2="425" stroke="#512731" stroke-width="1.5" />
  <line x1="185" y1="406" x2="210" y2="400" stroke="#512731" stroke-width="1" stroke-opacity="0.4" />
  <line x1="185" y1="412" x2="210" y2="406" stroke="#512731" stroke-width="1" stroke-opacity="0.4" />
  <line x1="230" y1="400" x2="255" y2="406" stroke="#512731" stroke-width="1" stroke-opacity="0.4" />
  <line x1="230" y1="406" x2="255" y2="412" stroke="#512731" stroke-width="1" stroke-opacity="0.4" />

  <!-- Warm cinematic lighting overlays -->
  <rect width="460" height="560" fill="url(#warmLight)" opacity="0.3" />
  <rect width="460" height="560" fill="url(#plumShade)" opacity="0.25" />
</svg>