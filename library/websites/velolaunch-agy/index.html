<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>VeloLaunch — Describe an app. We'll build it.</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z97ZD3EVSF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Z97ZD3EVSF');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --u: min(0.06410256vw, 0.12400794vh);
      --vu: 0.09920635vh;
      --inset-top: 41;
      --inset-bottom: 74;
    }
    @supports (height: 100dvh) {
      --u: min(0.06410256vw, 0.12400794dvh);
      --vu: 0.09920635dvh;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0d12;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0a0d12;
    }

    .stage-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .frame {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
    }

    /* Navbar */
    .nav {
      height: calc(43 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: calc(12 * var(--u));
      text-decoration: none;
      color: #ffffff;
    }
    .brand-mark {
      width: calc(34 * var(--u));
      height: calc(34 * var(--u));
      border-radius: 50%;
      background: #9C86CE;
      display: grid;
      place-items: center;
    }
    .brand-mark-inner {
      width: calc(17.2 * var(--u));
      height: calc(17.2 * var(--u));
      border-radius: 50%;
      background: #ffffff;
      display: grid;
      place-items: center;
    }
    .brand-mark-core {
      width: calc(7.4 * var(--u));
      height: calc(7.4 * var(--u));
      border-radius: 50%;
      background: #151519;
    }

    .brand-text {
      font-size: calc(18.5 * var(--u));
      font-weight: 500;
      letter-spacing: -0.0154em;
      text-shadow: 0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, 0.3);
    }

    .nav-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: calc(50 * var(--u));
    }
    .nav-links a {
      color: #ffffff;
      font-size: calc(18 * var(--u));
      font-weight: 400;
      text-decoration: none;
      letter-spacing: -0.0115em;
      text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, 0.32);
      transition: opacity 0.18s ease;
    }
    .nav-links a:hover { opacity: 0.72; }

    .btn-cta {
      width: calc(140 * var(--u));
      height: calc(43 * var(--u));
      border-radius: calc(12 * var(--u));
      background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: calc(15.7 * var(--u));
      font-weight: 500;
      letter-spacing: -0.0127em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255,255,255,.1), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0,0,0,.28);
      transition: filter 0.2s;
    }
    .btn-cta:hover { filter: brightness(1.18); }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(51 * var(--vu));
    }

    .hero-h1 {
      font-size: calc(36.25 * var(--u));
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.0018em;
      text-align: center;
      text-shadow: 0 calc(2 * var(--u)) calc(16 * var(--u)) rgba(0, 0, 0, 0.4);
    }

    /* Composer Card */
    .card {
      width: calc(708 * var(--u));
      height: calc(143 * var(--u));
      border-radius: calc(26 * var(--u));
      background: rgba(22, 26, 34, 0.65);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 calc(8 * var(--u)) calc(32 * var(--u)) rgba(0, 0, 0, 0.4);
      position: relative;
      padding: calc(20 * var(--u)) calc(24 * var(--u));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-textarea {
      background: transparent;
      border: 0;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: calc(14.5 * var(--u));
      resize: none;
      width: 100%;
      height: calc(48 * var(--u));
      line-height: 1.4;
    }
    .card-textarea::placeholder { color: #888d96; }

    /* Tools Strip */
    .tools {
      position: relative;
      height: calc(30 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chips {
      display: flex;
      align-items: center;
      gap: calc(6 * var(--u));
    }
    .chip {
      height: calc(30 * var(--u));
      padding: 0 calc(12 * var(--u));
      border-radius: calc(9 * var(--u));
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #c9ccd4;
      font-size: calc(11 * var(--u));
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: calc(4 * var(--u));
      cursor: pointer;
      transition: background 0.2s;
    }
    .chip:hover { background: rgba(255, 255, 255, 0.16); color: #ffffff; }

    .right-cluster {
      display: flex;
      align-items: center;
      gap: calc(16 * var(--u));
    }

    .model-selector {
      display: inline-flex;
      align-items: center;
      gap: calc(6 * var(--u));
      color: #98999C;
      font-size: calc(11 * var(--u));
      cursor: pointer;
    }
    .model-selector:hover { color: #ffffff; }

    .attach-icon {
      color: #A9AAAD;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .attach-icon:hover { color: #ffffff; }

    .send-circle {
      width: calc(35 * var(--u));
      height: calc(35 * var(--u));
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6e26 0%, #e0520a 100%);
      border: 0;
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 calc(2 * var(--u)) calc(10 * var(--u)) rgba(255, 110, 38, 0.4);
      transition: transform 0.2s;
    }
    .send-circle:hover { transform: scale(1.06); }

    /* Footer Proof */
    .proof {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: calc(16 * var(--vu));
    }
    .proof-label {
      font-size: calc(13 * var(--u));
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.0065em;
    }
    .proof-logos {
      display: flex;
      align-items: center;
      gap: calc(48 * var(--u));
      opacity: 0.6;
    }
    .proof-logo {
      font-size: calc(14 * var(--u));
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffffff;
    }

    /* Mobile Reflow (<768px) */
    @media (max-width: 768px) {
      body { overflow-y: auto; height: auto; }
      .frame {
        position: relative;
        padding: 1.5rem 1rem 3rem;
        height: auto;
        min-height: 100vh;
        gap: 3rem;
      }
      .nav-links { display: none; }
      .brand-text { font-size: 1.1rem; }
      .btn-cta { width: auto; height: auto; padding: 0.6rem 1.2rem; font-size: 0.85rem; }
      .hero-h1 { font-size: 2rem; }
      .card {
        width: 100%;
        height: auto;
        min-height: 180px;
        padding: 1.2rem;
        border-radius: 1.25rem;
      }
      .card-textarea { font-size: 1rem; height: 60px; }
      .tools {
        flex-direction: column;
        align-items: stretch;
        height: auto;
        gap: 1rem;
      }
      .chips { flex-wrap: wrap; }
      .chip { height: 2rem; font-size: 0.8rem; }
      .right-cluster { justify-content: space-between; }
      .send-circle { width: 2.25rem; height: 2.25rem; }
      .proof-logos { gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <!-- Dawn Landscape Looping Background Video -->
    <video class="stage-video" autoplay muted loop playsinline preload="auto" poster="./preview.jpg">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_124724_bc041163-d651-425f-aea3-2acc1efc2c96.mp4" type="video/mp4" />
    </video>

    <!-- Content Frame -->
    <div class="frame">
      <!-- Navbar -->
      <header class="nav">
        <a href="#top" class="brand" aria-label="VeloLaunch home">
          <div class="brand-mark">
            <div class="brand-mark-inner">
              <div class="brand-mark-core"></div>
            </div>
          </div>
          <span class="brand-text">VeloLaunch</span>
        </a>

        <nav class="nav-links">
          <a href="#features">Features</a>
          <a href="#examples">Examples</a>
          <a href="#pricing">Pricing</a>
          <a href="#docs">Docs</a>
        </nav>

        <button type="button" class="btn-cta" onclick="alert('Accessing VeloLaunch Studio...')">
          Get Started
        </button>
      </header>

      <!-- Hero & Composer -->
      <main class="hero">
        <h1 class="hero-h1">Describe an app. We'll build it.</h1>

        <!-- Prompt Composer Card -->
        <div class="card">
          <textarea class="card-textarea" placeholder="A modern fintech onboarding flow with automated KYC checks and bank statement OCR..."></textarea>

          <div class="tools">
            <div class="chips">
              <div class="chip"><span>+</span> Page</div>
              <div class="chip"><span>⌥</span> Integrations</div>
              <div class="chip"><span>✦</span> Style</div>
            </div>

            <div class="right-cluster">
              <div class="model-selector">
                <span>Claude 3.5 Sonnet</span>
                <span style="font-size: 0.7em;">▼</span>
              </div>

              <div class="attach-icon" title="Attach design screenshot">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </div>

              <button type="button" class="send-circle" aria-label="Generate application" onclick="alert('Initiating app synthesis...')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"/>
                  <polyline points="5 12 12 5 19 12"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Proof Footer -->
      <footer class="proof">
        <span class="proof-label">Trusted by engineering teams at forward-thinking builders</span>
        <div class="proof-logos">
          <span class="proof-logo">Linear</span>
          <span class="proof-logo">Supabase</span>
          <span class="proof-logo">Resend</span>
          <span class="proof-logo">Vercel</span>
          <span class="proof-logo">Raycast</span>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
