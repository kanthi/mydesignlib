<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Perspective Grid -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EDFF"/>
      <stop offset="50%" stop-color="#C2D8FF"/>
      <stop offset="100%" stop-color="#9BBFFF"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C58E8"/>
      <stop offset="50%" stop-color="#6F3CE0"/>
      <stop offset="100%" stop-color="#8E35DE"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#2188FF"/>
      <stop offset="100%" stop-color="#4355F9"/>
    </linearGradient>
    <filter id="cubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow Beneath Cube -->
  <ellipse cx="300" cy="275" rx="140" ry="35" fill="rgba(67, 85, 249, 0.28)" filter="url(#cubeGlow)"/>

  <!-- Perspective Ambient Glass Pedestals -->
  <!-- Left Pedestal 1 -->
  <polygon points="120,110 180,85 240,110 180,135" fill="rgba(255,255,255,0.7)" stroke="rgba(220,230,250,0.8)" stroke-width="1.5"/>
  <polygon points="120,110 180,135 180,145 120,120" fill="rgba(230,238,255,0.6)"/>
  <polygon points="240,110 180,135 180,145 240,120" fill="rgba(215,228,255,0.5)"/>

  <!-- Left Pedestal 2 -->
  <polygon points="140,165 200,140 260,165 200,190" fill="rgba(255,255,255,0.7)" stroke="rgba(220,230,250,0.8)" stroke-width="1.5"/>
  <polygon points="140,165 200,190 200,200 140,175" fill="rgba(230,238,255,0.6)"/>
  <polygon points="260,165 200,190 200,200 260,175" fill="rgba(215,228,255,0.5)"/>

  <!-- Right Pedestal 1 -->
  <polygon points="360,110 420,85 480,110 420,135" fill="rgba(255,255,255,0.7)" stroke="rgba(220,230,250,0.8)" stroke-width="1.5"/>
  <polygon points="360,110 420,135 420,145 360,120" fill="rgba(230,238,255,0.6)"/>
  <polygon points="480,110 420,135 420,145 480,120" fill="rgba(215,228,255,0.5)"/>

  <!-- Right Pedestal 2 -->
  <polygon points="340,165 400,140 460,165 400,190" fill="rgba(255,255,255,0.7)" stroke="rgba(220,230,250,0.8)" stroke-width="1.5"/>
  <polygon points="340,165 400,190 400,200 340,175" fill="rgba(230,238,255,0.6)"/>
  <polygon points="460,165 400,190 400,200 460,175" fill="rgba(215,228,255,0.5)"/>

  <!-- Center Master 3D Iridescent Isometric Cube -->
  <!-- Top Face -->
  <polygon points="300,90 390,135 300,180 210,135" fill="url(#cubeTop)"/>
  <!-- Highlight Reflection across top -->
  <polygon points="300,90 345,112 300,135 255,112" fill="rgba(255,255,255,0.55)"/>

  <!-- Left Face -->
  <polygon points="210,135 300,180 300,265 210,220" fill="url(#cubeLeft)"/>
  <!-- Right Face -->
  <polygon points="300,180 390,135 390,220 300,265" fill="url(#cubeRight)"/>

  <!-- Chamfered Glowing Edges -->
  <line x1="300" y1="90" x2="390" y2="135" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
  <line x1="300" y1="90" x2="210" y2="135" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
  <line x1="210" y1="135" x2="300" y2="180" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
  <line x1="390" y1="135" x2="300" y2="180" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
  <line x1="300" y1="180" x2="300" y2="265" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>

  <!-- Cartix Brand Monogram on Top Face in Perspective -->
  <g transform="translate(300, 135) skewY(26.5) scale(1, 0.58) translate(-40, -40)">
    <path d="M 22 28 C 14 28 8 34 8 42 C 8 50 14 56 22 56 L 36 56 C 44 56 50 62 50 70 C 50 78 44 84 36 84" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 42 28 C 50 28 56 34 56 42 L 56 70" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
