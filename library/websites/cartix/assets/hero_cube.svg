<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Perspective Grid Pattern -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glass Cube Iridescent Gradients -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="35%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="cubeFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#6366F1"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="cubeSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <ellipse cx="450" cy="380" rx="260" ry="120" fill="#38BDF8" opacity="0.25" filter="url(#softGlow)"/>
  <ellipse cx="450" cy="390" rx="190" ry="80" fill="#818CF8" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Perspective Grid Lines -->
  <g stroke="url(#gridFade)" stroke-width="1.2">
    <!-- Horizontal Perspective Lines -->
    <line x1="260" y1="180" x2="640" y2="180" opacity="0.3"/>
    <line x1="210" y1="230" x2="690" y2="230" opacity="0.4"/>
    <line x1="150" y1="290" x2="750" y2="290" opacity="0.6"/>
    <line x1="80" y1="370" x2="820" y2="370" opacity="0.8"/>
    <line x1="10" y1="470" x2="890" y2="470" opacity="1"/>
    <line x1="-80" y1="600" x2="980" y2="600" opacity="0.6"/>

    <!-- Perspective Rays toward Horizon (450, 100) -->
    <line x1="450" y1="100" x2="50" y2="620"/>
    <line x1="450" y1="100" x2="180" y2="620"/>
    <line x1="450" y1="100" x2="310" y2="620"/>
    <line x1="450" y1="100" x2="450" y2="620"/>
    <line x1="450" y1="100" x2="590" y2="620"/>
    <line x1="450" y1="100" x2="720" y2="620"/>
    <line x1="450" y1="100" x2="850" y2="620"/>
  </g>

  <!-- Receding Background Floating White Tiles -->
  <!-- Far Left 1 -->
  <g transform="translate(160, 170) scale(0.65)" filter="url(#tileShadow)">
    <path d="M 0 35 L 90 0 L 190 30 L 100 65 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 0 35 L 100 65 L 100 80 L 0 50 Z" fill="#F1F5F9"/>
    <path d="M 100 65 L 190 30 L 190 45 L 100 80 Z" fill="#E2E8F0"/>
  </g>

  <!-- Far Right 1 -->
  <g transform="translate(580, 175) scale(0.65)" filter="url(#tileShadow)">
    <path d="M 0 35 L 90 0 L 190 30 L 100 65 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 0 35 L 100 65 L 100 80 L 0 50 Z" fill="#F1F5F9"/>
    <path d="M 100 65 L 190 30 L 190 45 L 100 80 Z" fill="#E2E8F0"/>
  </g>

  <!-- Mid Left 2 -->
  <g transform="translate(180, 245) scale(0.85)" filter="url(#tileShadow)">
    <path d="M 0 40 L 110 0 L 220 35 L 110 75 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <path d="M 0 40 L 110 75 L 110 92 L 0 57 Z" fill="#F8FAFC"/>
    <path d="M 110 75 L 220 35 L 220 52 L 110 92 Z" fill="#E2E8F0"/>
  </g>

  <!-- Mid Right 2 -->
  <g transform="translate(540, 240) scale(0.85)" filter="url(#tileShadow)">
    <path d="M 0 40 L 110 0 L 220 35 L 110 75 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <path d="M 0 40 L 110 75 L 110 92 L 0 57 Z" fill="#F8FAFC"/>
    <path d="M 110 75 L 220 35 L 220 52 L 110 92 Z" fill="#E2E8F0"/>
  </g>

  <!-- Center Floating Hero 3D Glass Block (The Apptics Block) -->
  <g transform="translate(345, 255)">
    <!-- Base Drop Shadow on Grid Floor -->
    <ellipse cx="105" cy="180" rx="145" ry="45" fill="#0284C7" opacity="0.3" filter="url(#softGlow)"/>
    <ellipse cx="105" cy="175" rx="110" ry="32" fill="#1E1B4B" opacity="0.25"/>

    <!-- 3D Rounded Squircle Glass Block -->
    <!-- Top Face -->
    <path d="M 105 15 C 150 15 210 38 210 55 C 210 72 150 95 105 95 C 60 95 0 72 0 55 C 0 38 60 15 105 15 Z" fill="url(#cubeTop)" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Front Face Body -->
    <path d="M 0 55 C 0 72 60 95 105 95 C 150 95 210 72 210 55 L 210 115 C 210 132 150 155 105 155 C 60 155 0 132 0 115 Z" fill="url(#cubeFront)"/>

    <!-- Subtle Glare and Highlight Overlays -->
    <path d="M 20 60 C 50 82 105 92 105 92 C 105 92 160 82 190 60 L 190 70 C 160 92 105 102 105 102 C 105 102 50 92 20 70 Z" fill="#FFFFFF" opacity="0.35"/>
    <path d="M 10 100 C 40 120 105 135 105 135 C 105 135 170 120 200 100 L 200 108 C 170 128 105 143 105 143 C 105 143 40 128 10 108 Z" fill="#38BDF8" opacity="0.4"/>

    <!-- Monogram Emblem (cx / infinity loop) on Top Face -->
    <g transform="translate(68, 42) scale(0.9)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 16 C 8 16 0 10 0 0 C 0 -10 8 -16 18 -16 C 30 -16 38 -4 44 0 C 50 4 58 16 70 16 C 80 16 88 10 88 0 C 88 -10 80 -16 70 -16 C 58 -16 50 -4 44 0 C 38 4 30 16 18 16 Z" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
    </g>
  </g>
</svg>