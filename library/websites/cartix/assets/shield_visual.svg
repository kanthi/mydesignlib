<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="shieldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF512F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF0E6" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="460" height="320" rx="20" fill="url(#shieldAura)"/>
  
  <!-- Floating Alert 1 -->
  <g transform="translate(140, 45)">
    <rect width="180" height="36" rx="18" fill="rgba(255, 75, 43, 0.9)" filter="drop-shadow(0 4px 12px rgba(255,75,43,0.3))"/>
    <circle cx="20" cy="18" r="6" fill="#FFFFFF"/>
    <text x="36" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Chargeback Deflected!</text>
  </g>

  <!-- Central Glass Shield -->
  <path d="M 230 100 L 290 125 C 290 190 230 235 230 235 C 230 235 170 190 170 125 Z" fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="3" filter="drop-shadow(0 15px 25px rgba(255,100,50,0.25))"/>
  
  <!-- Checkmark / Lock Inside Shield -->
  <path d="M 215 160 L 225 170 L 245 150" stroke="#FF512F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
