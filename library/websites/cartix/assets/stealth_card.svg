<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <radialGradient id="goldBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="jetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#goldBg)" stroke="#FCD34D" stroke-width="1.5"/>

  <!-- Center Stealth Jet Shield -->
  <g transform="translate(185, 90)" filter="url(#jetGlow)">
    <path d="M 85 0 C 145 0 170 30 170 85 C 170 170 85 220 85 220 C 85 220 0 170 0 85 C 0 30 25 0 85 0 Z" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- Stealth Jet Plane Silhouette -->
    <polygon points="85,55 125,145 85,130 45,145" fill="#E2E8F0"/>
    <line x1="85" y1="55" x2="85" y2="130" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Side Floating Banned Logos Disabled -->
  <g transform="translate(65, 175)" filter="drop-shadow(0 8px 14px rgba(0,0,0,0.2))">
    <circle cx="35" cy="35" r="28" fill="#1E293B"/>
    <text x="35" y="43" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#EF4444" text-anchor="middle">✕</text>
  </g>
  <g transform="translate(405, 175)" filter="drop-shadow(0 8px 14px rgba(0,0,0,0.2))">
    <circle cx="35" cy="35" r="28" fill="#1E293B"/>
    <text x="35" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38BDF8" text-anchor="middle">♪</text>
  </g>
</svg>