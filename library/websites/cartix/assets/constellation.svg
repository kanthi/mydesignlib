<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <filter id="tileGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#16A34A"/></linearGradient>
    <linearGradient id="t2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="t3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="t4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="t5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="t6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="t7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#9333EA"/></linearGradient>
    <linearGradient id="t8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
  </defs>

  <!-- Tile 1 (Top Green: Shopping Bag) -->
  <g transform="translate(250, 40)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t1)"/>
    <circle cx="40" cy="40" r="14" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Tile 2 (Top Left Purple: Arrow Up) -->
  <g transform="translate(150, 90)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t2)"/>
    <polygon points="40,24 54,48 26,48" fill="#FFFFFF"/>
  </g>

  <!-- Tile 3 (Top Right Cyan: Paintbrush) -->
  <g transform="translate(350, 110)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t4)"/>
    <rect x="34" y="24" width="12" height="34" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Tile 4 (Center Coral: Shield) -->
  <g transform="translate(250, 160)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t3)"/>
    <path d="M 40 24 C 54 24 58 30 58 44 C 58 56 40 64 40 64 C 40 64 22 56 22 44 C 22 30 26 24 40 24 Z" fill="#FFFFFF"/>
  </g>

  <!-- Tile 5 (Mid Left Indigo: Book) -->
  <g transform="translate(195, 230)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t5)"/>
    <rect x="25" y="32" width="14" height="20" rx="2" fill="#FFFFFF"/>
    <rect x="41" y="32" width="14" height="20" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Tile 6 (Mid Right Violet: Cube/Box) -->
  <g transform="translate(350, 240)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t7)"/>
    <polygon points="40,25 58,36 40,47 22,36" fill="#FFFFFF"/>
    <polygon points="22,36 40,47 40,63 22,52" fill="#E9D5FF"/>
    <polygon points="58,36 40,47 40,63 58,52" fill="#C084FC"/>
  </g>

  <!-- Tile 7 (Bottom Right Gold: Jet) -->
  <g transform="translate(305, 320)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t6)"/>
    <polygon points="40,24 55,56 40,48 25,56" fill="#FFFFFF"/>
  </g>

  <!-- Tile 8 (Bottom Left Cyan: Infinity Loop) -->
  <g transform="translate(100, 330)" filter="url(#tileGlow)">
    <rect width="80" height="80" rx="22" fill="url(#t8)"/>
    <path d="M 30 46 C 24 46 20 42 20 36 C 20 30 24 26 30 26 C 36 26 40 32 44 36 C 48 40 52 46 58 46 C 64 46 68 42 68 36 C 68 30 64 26 58 26 C 52 26 48 32 44 36 C 40 40 36 46 30 46 Z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>