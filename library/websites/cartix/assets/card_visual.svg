<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D26A"/>
      <stop offset="45%" stop-color="#2D9C8B"/>
      <stop offset="100%" stop-color="#3D5AFE"/>
    </linearGradient>
  </defs>

  <!-- Credit Card -->
  <rect x="40" y="40" width="420" height="240" rx="20" fill="url(#cardGrad)" filter="drop-shadow(0 20px 30px rgba(0,210,106,0.25))"/>
  
  <!-- Subtle Wave Texture -->
  <path d="M 40 180 C 140 120 280 260 460 160 L 460 280 L 40 280 Z" fill="rgba(255,255,255,0.12)"/>

  <!-- Logo on Card -->
  <text x="75" y="85" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" letter-spacing="-0.02em">cartix</text>

  <!-- Contactless NFC Icon -->
  <path d="M 410 75 A 14 14 0 0 1 410 95" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 416 70 A 22 22 0 0 1 416 100" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Card Number & Details -->
  <text x="75" y="225" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" letter-spacing="0.1em">4835 3245 1997 1228</text>
  <text x="75" y="255" fill="rgba(255,255,255,0.7)" font-family="'JetBrains Mono', monospace" font-size="11">HIGH-RISK TIER 1 // 95%+ APPROVAL</text>
</svg>
