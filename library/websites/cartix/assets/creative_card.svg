<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="bottleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#3B0764" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#purpleBg)" stroke="#D8B4FE" stroke-width="1.5"/>

  <!-- Ad Mockup Poster -->
  <g transform="translate(95, 45)" filter="url(#bottleShadow)">
    <rect width="350" height="330" rx="20" fill="#FFFBEB" stroke="#FEF3C7" stroke-width="2"/>
    <text x="175" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#1E1B4B" text-anchor="middle" letter-spacing="-0.02em">Take a Look to</text>
    <text x="175" y="68" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#D97706" text-anchor="middle" letter-spacing="0.04em">OUR BENEFITS</text>
    
    <!-- Supplement Bottle Mockup -->
    <g transform="translate(135, 100)">
      <!-- Bottle Body -->
      <rect x="0" y="30" width="80" height="130" rx="14" fill="#92400E"/>
      <!-- Cap -->
      <rect x="15" y="8" width="50" height="24" rx="4" fill="#1C1917"/>
      <!-- Label -->
      <rect x="0" y="55" width="80" height="75" fill="#FEF3C7"/>
      <text x="40" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#78350F" text-anchor="middle">cartix</text>
      <text x="40" y="105" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#92400E" text-anchor="middle">SUPPLEMENT</text>
    </g>

    <!-- Side Bullet Badges -->
    <rect x="20" y="120" width="90" height="40" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <text x="65" y="138" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">High-Stress</text>
    <text x="65" y="150" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#64748B" text-anchor="middle">Daily Support</text>

    <rect x="240" y="120" width="90" height="40" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <text x="285" y="138" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#0F172A" text-anchor="middle">Clinically Dosed</text>
    <text x="285" y="150" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#64748B" text-anchor="middle">Seasonally Active</text>

    <!-- Footer Tag -->
    <text x="175" y="300" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0284C7" text-anchor="middle">cartix</text>
  </g>
</svg>