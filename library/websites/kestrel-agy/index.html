  <!-- Pre-paint Guard -->

    document.documentElement.classList.add('entry-pending');
    window.__entryFallback = setTimeout(function(){
      document.documentElement.classList.remove('entry-pending');
    }, 3500);
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --badge-fs: 13.60px; --badge-fw: 400; --badge-ls: -0.163px; --badge-gap: 10px; --badge-dy: 0px; --badge-ws: 0px;
      --badge-left: 34px; --badge-top: 684px;
      --hl-lh: 1; --hl-wght: 578;
      --hl1-fs: 69.14px; --hl1-ls: -1.936px; --hl1-ws: 0px; --hl1-left: 33.00px; --hl1-top: 750.02px;
      --hl2-fs: 68.95px; --hl2-ls: -1.931px; --hl2-left: 32.00px; --hl2-top: 831.01px;
      --h1-top: 65.00px; --h1-fs: 42.55px; --h1-ls: -2.553px; --h1-ws: 1.300px; --h1-wght: 584;
      --sub-top: 120.00px; --sub-fs: 20.41px; --sub-ls: -0.245px; --sub-ws: -2.000px; --sub-fw: 400; --sub-fwb: 700;
      --fieldpad: 19px;
      --eph-fs: 15.68px; --eph-ls: -0.188px; --eph-left: 17.0px; --eph-fw: 400; --eph-ws: 0px;
      --pph-fs: 17.29px; --pph-ls: -0.698px; --pph-left: 18px; --pph-fw: 400;
      --login-fs: 16.38px; --login-fw: 400; --login-ls: 0.200px; --login-gap: 10px; --login-dy: 0.00px; --login-padl: -12.00px;
      --arrow-w: 13.2px;
      --div-top: 477px; --or-fs: 11.5px; --or-fw: 700; --or-ls: 0.8px; --or-dy: 2.00px; --or-dx: 0.00px;
      --or-line-l: 205px; --or-line-r: 204px;
      --g-gap: 17px; --g-icon: 18.5px;
      --gt-fs: 18.10px; --gt-fw: 400; --gt-ls: -0.217px; --gt-ws: -1.000px; --gt-dy: 1.00px;
      --bt-top: 611.00px; --bt-fs: 16.37px; --bt-fw: 400; --bt-ls: -0.196px; --bt-ws: -2.060px; --bt-fwb: 700; --bt-uo: 3px;
      --card-shadow: 1px 10px 14px rgba(10, 14, 20, 0.14), 0 1px 3px rgba(10, 14, 20, 0.05);
      --cs: 1;

      --ink: #000000;
      --h1-color: #2c3343;
      --sub-grey: #797979;
      --badge-bg: #2f2a27;
      --ph: #606060;
      --or: #5a5a5b;
      --gtext: #232424;
      --bottom: #0a0a0a;
      --btn1: #283139;
      --btn2: #293340;
      --inputFill: #fafafa;
      --inputBorder: #acacae;
      --pwFill: #f9f9f9;
      --gBorder: #c8c8ca;
      --divider: #b1b1b2;
      --page: #fefefe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--page);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    /* Left Section: Falcon Video */
    .photo {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 57.1038%;
      overflow: hidden;
    }

    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 50%;
      display: block;
      -webkit-user-drag: none;
    }

    .scrim {
      display: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,10,13,.02) 18%, rgba(7,10,13,.12) 48%, rgba(7,10,13,.78) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Hero Text & Badge Over Video */
    .hero {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 836px;
      height: 949px;
      transform-origin: left bottom;
      pointer-events: none;
      z-index: 2;
    }
    .hero > * { pointer-events: auto; }

    .badge {
      position: absolute;
      left: var(--badge-left);
      top: var(--badge-top);
      display: inline-flex;
      align-items: center;
      height: 37px;
      padding: 0 16px 0 19px;
      border-radius: 999px;
      background: var(--badge-bg);
      backdrop-filter: blur(7px) saturate(120%);
      -webkit-backdrop-filter: blur(7px) saturate(120%);
      box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.14);
      color: #ffffff;
      white-space: nowrap;
      font-size: var(--badge-fs);
      font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls);
      gap: var(--badge-gap);
    }
    .badge svg { width: 17px; height: 16.27px; fill: #ffffff; position: relative; top: -1px; }

    .hl {
      position: absolute;
      line-height: var(--hl-lh);
      color: var(--ink);
      white-space: nowrap;
      font-weight: 600;
    }
    #hl1 {
      left: var(--hl1-left);
      top: var(--hl1-top);
      font-size: var(--hl1-fs);
      letter-spacing: var(--hl1-ls);
    }
    #hl2 {
      left: var(--hl2-left);
      top: var(--hl2-top);
      font-size: var(--hl2-fs);
      letter-spacing: var(--hl2-ls);
    }

    /* Right Section: Form Card */
    .pane {
      position: absolute;
      left: 57.1038%;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      position: relative;
      width: 613px;
      height: 922px;
      border-radius: 26px;
      overflow: hidden;
      background: rgba(254, 254, 254, 0.90);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(0, 0, 0, 0.036);
      box-shadow: var(--card-shadow);
    }

    .card-in {
      position: absolute;
      inset: 0;
      width: 613px;
      height: 922px;
      transform-origin: left top;
    }

    .col {
      position: absolute;
      left: 62px;
      width: 488px;
    }

    #h1 {
      top: var(--h1-top);
      font-size: var(--h1-fs);
      font-weight: 700;
      letter-spacing: var(--h1-ls);
      color: var(--h1-color);
      line-height: 1.1;
      text-align: center;
    }

    #sub {
      top: var(--sub-top);
      font-size: var(--sub-fs);
      letter-spacing: var(--sub-ls);
      color: var(--sub-grey);
      text-align: center;
      line-height: 1.3;
    }
    #sub b { color: var(--ink); font-weight: 700; }

    .field {
      position: absolute;
      left: 62px;
      width: 489px;
      display: flex;
      align-items: center;
      border-radius: 12px;
    }
    .field input {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      outline: none;
      padding: 0 var(--fieldpad);
      font-family: inherit;
      color: var(--ink);
    }

    #email {
      top: 203px;
      height: 61px;
      background: var(--inputFill);
      border: 1.5px solid var(--inputBorder);
    }
    #email input { font-size: var(--eph-fs); letter-spacing: var(--eph-ls); }

    #pw {
      top: 273.5px;
      height: 59px;
      background: var(--pwFill);
      border: 1px solid rgba(0,0,0,0.06);
    }
    #pw input { font-size: var(--pph-fs); letter-spacing: var(--pph-ls); }

    #loginBtn {
      position: absolute;
      left: 62px;
      top: 366px;
      width: 489px;
      height: 65.5px;
      border-radius: 999px;
      border: 0;
      background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--login-gap);
      padding-left: var(--login-padl);
      padding-right: 4px;
      box-shadow: 0 8px 20px rgba(18,26,34,.16), 0 2px 5px rgba(18,26,34,.10);
      font-size: var(--login-fs);
      font-weight: 500;
      letter-spacing: var(--login-ls);
      cursor: pointer;
      transition: transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, filter .18s ease;
    }
    #loginBtn:hover { filter: brightness(1.12); }
    #loginBtn:active { transform: translateY(1px); }

    .divider {
      position: absolute;
      left: 63px;
      top: var(--div-top);
      width: 487px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .divider i {
      height: 1.5px;
      background: var(--divider);
    }
    .divider i:first-child { flex: 0 0 var(--or-line-l); }
    .divider i:last-child  { flex: 0 0 var(--or-line-r); }
    .divider b {
      flex: 1 1 auto;
      text-align: center;
      font-size: var(--or-fs);
      font-weight: var(--or-fw);
      letter-spacing: var(--or-ls);
      color: var(--or);
    }

    #gBtn {
      position: absolute;
      left: 62px;
      top: 535px;
      width: 489px;
      height: 59.5px;
      border: 1.5px solid var(--gBorder);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--g-gap);
      font-size: var(--gt-fs);
      font-weight: 500;
      color: var(--gtext);
      cursor: pointer;
      transition: background .18s ease, box-shadow .18s ease, transform .18s cubic-bezier(.2,.7,.3,1);
    }
    #gBtn:hover { background: #ffffff; box-shadow: 0 3px 10px rgba(0,0,0,.07); }
    #gBtn:active { transform: translateY(1px); }

    #bottom {
      position: absolute;
      left: 62px;
      width: 489px;
      top: var(--bt-top);
      text-align: center;
      font-size: var(--bt-fs);
      color: var(--bottom);
    }
    #bottom a {
      color: #000000;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 2px;
    }

    /* First-frame state during entrance */
    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #sub,
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0 !important;
      will-change: transform, opacity, clip-path;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
      .entry-pending * { opacity: 1 !important; transform: none !important; clip-path: none !important; }
    }

    /* Mobile Reflow (<700px) */
    @media (max-width: 699.98px) {
      body {
        height: auto;
        min-height: 100%;
        overflow-y: auto;
        background: #ffffff;
      }
      .stage {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }
      .photo {
        position: relative;
        width: 100%;
        height: clamp(244px, 34svh, 304px);
      }
      .scrim { display: block; }
      .hero {
        position: absolute;
        inset: auto auto 20px 20px;
        width: calc(100% - 40px);
        height: auto;
      }
      .badge {
        position: static;
        height: 31px;
        padding: 0 12px;
        font-size: 11px;
        background: rgba(24, 27, 30, 0.82);
        margin-bottom: 12px;
      }
      .hl {
        position: static;
        display: block;
        color: #ffffff;
        font-size: clamp(30px, 8.8vw, 38px);
        letter-spacing: -0.035em;
        line-height: 0.96;
        text-shadow: 0 2px 18px rgba(0,0,0,.32);
      }
      .pane {
        position: relative;
        left: auto;
        right: auto;
        top: auto;
        bottom: auto;
        width: 100%;
        display: block;
      }
      .card {
        width: 100%;
        height: auto;
        margin: -28px 0 0;
        border-radius: 28px 28px 0 0;
        background: #ffffff;
        border: 0;
        box-shadow: 0 -10px 28px rgba(20,28,36,.10);
        min-height: calc(100svh - clamp(244px, 34svh, 304px) + 28px);
      }
      .card-in {
        position: static;
        width: 100%;
        height: auto;
        max-width: 500px;
        margin: 0 auto;
        padding: 36px clamp(24px, 7vw, 38px) max(30px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .col, .field, #loginBtn, .divider, #gBtn, #bottom {
        position: static !important;
        width: 100% !important;
      }
      .field { height: 56px; }
      #loginBtn { height: 58px; }
      #gBtn { height: 56px; }
      .field input { font-size: 16px !important; }
    }
  </style>
</head>

<body>

  <!-- WAAPI Entrance Animation Engine -->
  <script>
    (function () {
      const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (isReduced || !Element.prototype.animate) {
        document.documentElement.classList.remove('entry-pending');
        return;
      }

      const ease = 'cubic-bezier(0.16, 1, 0.3, 1)';
      const softEase = 'cubic-bezier(0.22, 1, 0.36, 1)';
      const isCompact = window.matchMedia('(max-width: 699px)').matches;

      const queue = [
        { el: document.getElementById('card'), delay: 40, dur: 820, ease: ease, from: { opacity: 0, transform: isCompact ? 'translateY(14px)' : 'translateY(12px) scale(0.988)' } },
        { el: document.querySelector('.badge'), delay: 120, dur: 480, ease: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: document.getElementById('hl1'), delay: 240, dur: 760, ease: ease, from: { opacity: 0, transform: isCompact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' } },
        { el: document.getElementById('hl2'), delay: 330, dur: 760, ease: ease, from: { opacity: 0, transform: isCompact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' } },
        { el: document.getElementById('h1'), delay: 470, dur: 620, ease: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
        { el: document.getElementById('sub'), delay: 570, dur: 560, ease: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
        { el: document.getElementById('email'), delay: 720, dur: 520, ease: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: document.getElementById('pw'), delay: 790, dur: 520, ease: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: document.getElementById('loginBtn'), delay: 930, dur: 560, ease: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: document.querySelector('.divider'), delay: 1060, dur: 440, ease: softEase, from: { opacity: 0, transform: 'translateY(6px)' } },
        { el: document.getElementById('gBtn'), delay: 1150, dur: 540, ease: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: document.getElementById('bottom'), delay: 1260, dur: 500, ease: softEase, from: { opacity: 0, transform: 'translateY(6px)' } }
      ];

      Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 650))]).then(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const running = [];
            queue.forEach(item => {
              if (!item.el) return;
              const anim = item.el.animate([
                item.from,
                { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
              ], {
                delay: item.delay,
                duration: item.dur,
                easing: item.ease,
                fill: 'both'
              });
              running.push(anim);
            });

            document.documentElement.classList.remove('entry-pending');
            clearTimeout(window.__entryFallback);

            Promise.allSettled(running.map(a => a.finished)).then(() => {
              running.forEach(a => a.cancel());
            });
          });
        });
      });
    })();
  </script>
