<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mire Plates — Four plates from the sheet</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="theme-color" content="#1C2422" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z97ZD3EVSF"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='22' height='28' fill='none' stroke='%23E6E2D8' stroke-width='2'/%3E%3Cpath d='M24 2v8h6' fill='none' stroke='%23E4572E' stroke-width='2'/%3E%3C/svg%3E" />

  <style>
    :root {
      --font-display: "Newsreader", "Iowan Old Style", Palatino, serif;
      --font-body: "Figtree", "Avenir Next", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --surface-page: #1C2422;
      --surface-paper: #E4E0D4;
      --surface-paper-deep: #D5D0C2;
      --text-on-dark: #E6E2D8;
      --text-on-paper: #1A1E1C;
      --text-muted: #8E9892;
      --text-muted-paper: #5C615C;
      --action-primary: #E4572E;
      --selenium: #C4A574;
      --status-danger: #8E2E2A;
      --line-dark: rgba(230, 226, 216, 0.16);
      --line-paper: rgba(26, 30, 28, 0.16);
      --text-word: clamp(3.6rem, 7vw, 6.4rem);
      --text-display: clamp(2.2rem, 4vw, 3.3rem);
      --text-xl: clamp(1.35rem, 2vw, 1.7rem);
      --text-lg: 1.2rem;
      --text-base: 1.0625rem;
      --text-sm: 0.875rem;
      --text-xs: 0.75rem;
      --leading-word: 0.92;
      --leading-display: 1.05;
      --leading-body: 1.6;
      --tracking-word: -0.03em;
      --tracking-display: -0.02em;
      --tracking-label: 0.14em;
      --wrap: min(1180px, calc(100% - 3rem));
      --radius: 2px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--surface-page);
      color: var(--text-on-dark);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    img { max-width: 100%; display: block; }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { text-wrap: balance; }
    p { text-wrap: pretty; }
    ol { margin: 0; padding: 0; list-style: none; }
    ::selection { background: var(--action-primary); color: #1A120E; }
    .num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .kicker {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--selenium);
      line-height: 1.3;
    }
    .measure { max-width: 38rem; }

    .plate {
      position: relative;
      min-height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: normal;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 36px 0 64px;
    }
    .folio {
      position: absolute;
      left: 22px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--selenium);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.12em;
      font-variant-numeric: tabular-nums;
    }
    .folio i {
      width: 8px;
      height: 8px;
      background: var(--action-primary);
      display: block;
      flex: none;
    }
    .folio .of { color: var(--text-muted); }
    .wrap {
      width: var(--wrap);
      margin-inline: auto;
    }

    .print {
      margin: 0;
      background: var(--surface-paper);
      color: var(--text-on-paper);
      padding: 10px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }
    .print-frame {
      position: relative;
      overflow: hidden;
      height: min(48vh, 440px);
    }
    .print-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .chip {
      position: absolute;
      z-index: 1;
      top: 8px;
      left: 8px;
      background: var(--surface-page);
      color: var(--text-on-dark);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      line-height: 1;
      padding: 6px 7px;
      border-radius: var(--radius);
    }
    .print figcaption {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px 0;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted-paper);
    }

    .cover {
      display: grid;
      gap: 28px;
      align-items: end;
    }
    .cover .print { padding: 12px; }
    .cover .print-frame { height: min(64vh, 620px); }
    .cover h1 {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 500;
      font-size: var(--text-word);
      line-height: var(--leading-word);
      letter-spacing: var(--tracking-word);
      margin-top: 8px;
    }
    .lead {
      margin-top: 16px;
      font-size: var(--text-lg);
      line-height: 1.45;
      max-width: 34rem;
    }
    .meta {
      margin-top: 16px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
    }

    .plate-head { margin-bottom: 22px; max-width: 40rem; }
    .plate-head h2 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--text-display);
      line-height: var(--leading-display);
      letter-spacing: var(--tracking-display);
      margin-top: 8px;
    }
    .plate-head p { margin-top: 12px; color: var(--text-muted); }

    .spread { display: grid; gap: 12px; }
    .spread-3 .print-frame { height: min(58vh, 560px); }

    .steps { display: grid; gap: 28px; }
    .steps li { padding-top: 16px; border-top: 1px solid var(--line-dark); }
    .steps h3 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--text-xl);
      line-height: 1.25;
      margin: 10px 0 10px;
    }
    .steps p { color: var(--text-muted); }
    .steps .num {
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-label);
      color: var(--selenium);
    }

    .invoice {
      background: var(--surface-paper);
      color: var(--text-on-paper);
      border-radius: var(--radius);
      padding: clamp(1.1rem, 2.4vw, 2rem);
    }
    .invoice-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      background: var(--surface-paper-deep);
      margin: calc(clamp(1.1rem, 2.4vw, 2rem) * -1);
      margin-bottom: 8px;
      padding: clamp(1.1rem, 2.4vw, 2rem);
    }
    .invoice h2 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--text-display);
      line-height: var(--leading-display);
      letter-spacing: var(--tracking-display);
      margin-top: 8px;
      color: var(--text-on-paper);
    }
    .invoice .kicker { color: var(--text-muted-paper); }
    .stamp {
      flex: none;
      margin-top: 8px;
      border: 1px solid var(--status-danger);
      color: var(--status-danger);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      line-height: 1;
      padding: 10px 12px;
      transform: rotate(-2deg);
    }
    .invoice table { width: 100%; border-collapse: collapse; }
    .invoice th, .invoice td {
      text-align: left;
      vertical-align: top;
      padding: 14px 12px 14px 0;
      border-bottom: 1px solid var(--line-paper);
      font-weight: 400;
    }
    .invoice thead th {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--text-muted-paper);
      font-weight: 500;
    }
    .invoice tbody th {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 500;
      line-height: 1.25;
      width: 26%;
    }
    .invoice td:last-child, .invoice th:last-child {
      text-align: right;
      padding-right: 0;
      white-space: nowrap;
      font-size: var(--text-lg);
    }
    .invoice-note {
      margin-top: 18px;
      color: var(--text-muted-paper);
      max-width: 42rem;
    }

    .note {
      display: grid;
      gap: 28px;
      align-items: center;
    }
    .portrait {
      margin: 0;
      background: var(--surface-paper);
      padding: 12px;
      border-radius: var(--radius);
    }
    .portrait img {
      width: 100%;
      height: min(68vh, 640px);
      object-fit: cover;
      object-position: center 18%;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .portrait figcaption {
      padding: 8px 2px 0;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted-paper);
    }
    .note h2 {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: var(--text-display);
      line-height: var(--leading-display);
      letter-spacing: var(--tracking-display);
      margin: 8px 0 14px;
    }
    .note .lede { font-size: var(--text-lg); line-height: 1.45; }
    .note p + p { margin-top: 12px; }
    .pubs { margin-top: 22px; border-top: 1px solid var(--line-dark); }
    .pubs li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 20px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-dark);
      font-size: var(--text-sm);
    }
    .pubs span {
      color: var(--selenium);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .close { max-width: 640px; }
    .close .word {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 500;
      font-size: var(--text-word);
      line-height: var(--leading-word);
      letter-spacing: var(--tracking-word);
      margin: 8px 0 18px;
    }
    .index { margin-top: 28px; border-top: 1px solid var(--line-dark); }
    .index li {
      display: flex;
      gap: 18px;
      align-items: baseline;
      padding: 11px 0;
      border-bottom: 1px solid var(--line-dark);
    }
    .index .num {
      color: var(--selenium);
      font-size: var(--text-xs);
      letter-spacing: 0.08em;
      width: 2ch;
    }
    .colophon {
      margin-top: 22px;
      color: var(--text-muted);
      font-size: var(--text-sm);
    }
    .mail {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    @media (min-width: 800px) {
      .cover { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 40px; }
      .spread-2 { grid-template-columns: 1.15fr 0.85fr; }
      .spread-2 .print-frame { height: min(68vh, 640px); }
      .spread-pair { grid-template-columns: 0.72fr 1.28fr; }
      .spread-pair .print-frame { height: min(68vh, 640px); }
      .spread-3 { grid-template-columns: 1.15fr 0.9fr 1.05fr; }
      .steps { grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line-dark); }
      .steps li { border-top: 0; border-left: 1px solid var(--line-dark); padding: 20px 20px 0; }
      .steps li:first-child { border-left: 0; padding-left: 0; }
      .note { grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr); gap: 48px; align-items: center; }
    }

    @media (min-width: 800px) and (min-height: 720px) {
      html { scroll-snap-type: y mandatory; }
      .plate { height: 100dvh; min-height: 100dvh; overflow: hidden; }
    }

    @media (max-width: 799px) {
      .invoice table, .invoice tbody, .invoice tr, .invoice td, .invoice th { display: block; width: auto; }
      .invoice thead { display: none; }
      .invoice tr { padding: 14px 0; border-bottom: 1px solid var(--line-paper); }
      .invoice td, .invoice th { border-bottom: 0; padding: 3px 0; text-align: left; }
      .invoice td:last-child, .invoice th:last-child { text-align: left; white-space: normal; }
      .invoice td::before {
        content: attr(data-label);
        display: block;
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        letter-spacing: var(--tracking-label);
        text-transform: uppercase;
        color: var(--text-muted-paper);
      }
      .pubs li, .index li { flex-direction: column; align-items: flex-start; gap: 4px; }
      .portrait img { height: auto; aspect-ratio: 2 / 3; max-height: 70vh; }
      .print-frame, .spread-3 .print-frame, .cover .print-frame { height: 46vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    @media print {
      html { scroll-snap-type: none; }
      .plate {
        height: auto;
        min-height: 0;
        overflow: visible;
        break-after: page;
        page-break-after: always;
      }
      .print-frame, .cover .print-frame, .spread .print-frame, .spread-3 .print-frame, .portrait img {
        height: auto;
        max-height: none;
      }
      .print-frame img { position: static; height: auto; }
    }
  </style>
</head>
<body>
  <main>
    <section class="plate" aria-label="Plate 01, cover">
      <p class="folio"><i></i><span>01</span><span class="of">/ 04</span></p>
      <div class="wrap cover">
        <figure class="print">
          <div class="print-frame">
            <img src="assets/frame-slip.jpg" width="1280" height="720" alt="Two working boats tied to a wet wooden dock at blue hour, ropes coiled in the foreground." style="object-position: center 60%;" />
          </div>
        </figure>
        <div>
          <p class="kicker">Photographer · Grayharbor</p>
          <h1>Ida Voss</h1>
          <p class="lead">She photographs harbors, weather, and rooms that are still in use, working alone on 4×5 sheet film from a room above a chandlery.</p>
          <p class="meta">Mire · studio@mire.example</p>
        </div>
      </div>
    </section>

    <section class="plate" aria-label="Plate 02, opening pair">
      <div class="wrap">
        <div class="spread spread-2">
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-slip.jpg" width="1280" height="720" alt="Working boats moored beside a wet dock under a blue-hour sky." style="object-position: center 60%;" />
            </div>
          </figure>
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-nets.jpg" width="1024" height="1024" alt="Coiled fishing nets and a rusted iron cleat on wet dock planks." />
            </div>
          </figure>
        </div>
      </div>
    </section>

    <section class="plate" aria-label="Plate 03, galley and headland">
      <div class="wrap">
        <div class="spread spread-pair">
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-room.jpg" width="832" height="1248" alt="A boat galley with an enamel kettle, a yellow oilskin, and breakfast dishes by a fogged port window." />
            </div>
          </figure>
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-weather.jpg" width="1248" height="832" alt="A small green hut on a rocky headland as waves break along the shore." />
            </div>
          </figure>
        </div>
      </div>
    </section>

    <section class="plate" aria-label="Plate 04, tide, shed, and lamp">
      <div class="wrap">
        <div class="spread spread-3">
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-tide.jpg" width="1248" height="832" alt="Barnacled pilings and wooden ladders standing in harbor mud at low tide." style="object-position: center 40%;" />
            </div>
          </figure>
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-door.jpg" width="832" height="1248" alt="A weathered wooden shed standing at the end of an empty dock." />
            </div>
          </figure>
          <figure class="print">
            <div class="print-frame">
              <img src="assets/frame-lamp.jpg" width="1248" height="756" alt="A skiff moored beside a wet dock under a single sodium lamp at night." />
            </div>
          </figure>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
