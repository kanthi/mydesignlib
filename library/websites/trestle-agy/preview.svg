<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
  <defs>
    <pattern id="grid-bg" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#D5D9E0" stroke-width="1" opacity="0.6"/>
    </pattern>
    <pattern id="term-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222832" stroke-width="0.75" opacity="0.5"/>
    </pattern>
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#121519" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Limestone Field Background -->
  <rect width="1440" height="900" fill="#E7E9ED"/>
  <rect width="1440" height="900" fill="url(#grid-bg)"/>

  <!-- Telemetry Bar -->
  <rect width="1440" height="36" fill="#121519"/>
  <g transform="translate(80, 22)">
    <circle cx="0" cy="-4" r="3.5" fill="#22866B"/>
    <text x="12" y="0" fill="#EAECEF" font-family="'Helvetica', 'Arial', sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">SYSTEM DISPATCH: ACTIVE // ALL NODES NOMINAL</text>
    <text x="600" y="0" fill="#848C96" font-family="'Helvetica', 'Arial', sans-serif" font-size="11">P99 LATENCY: 8.4ms</text>
    <text x="800" y="0" fill="#848C96" font-family="'Helvetica', 'Arial', sans-serif" font-size="11">ACTIVE CLUSTERS: 48</text>
    <text x="1000" y="0" fill="#848C96" font-family="'Helvetica', 'Arial', sans-serif" font-size="11">SLA: 99.999%</text>
    <text x="1200" y="0" fill="#5FD4B5" font-family="'Helvetica', 'Arial', sans-serif" font-size="11" font-weight="600">SEV-1 &lt; 15M</text>
  </g>

  <!-- Sticky Bar Navigation -->
  <g transform="translate(0, 36)">
    <rect width="1440" height="74" fill="#E7E9ED" fill-opacity="0.95"/>
    <line x1="0" y1="74" x2="1440" y2="74" stroke="#C4CAD2" stroke-width="1"/>
    
    <!-- Brand Mark -->
    <g transform="translate(80, 28)">
      <!-- Trestle AGY Mark -->
      <g fill="#184D42">
        <rect x="0" y="0" width="24" height="3" rx="1"/>
        <rect x="3" y="0" width="3" height="20" rx="1"/>
        <rect x="18" y="0" width="3" height="20" rx="1"/>
        <circle cx="12" cy="-2" r="2.5" fill="#22866B"/>
      </g>
      <text x="36" y="16" fill="#121519" font-family="'Georgia', serif" font-size="20" font-weight="600" letter-spacing="-0.02em">Trestle</text>
      <rect x="108" y="2" width="36" height="16" fill="#121519" rx="2"/>
      <text x="114" y="14" fill="#EAECEF" font-family="'Helvetica', sans-serif" font-size="10" font-weight="700" letter-spacing="0.1em">AGY</text>
    </g>

    <!-- Nav Links -->
    <g transform="translate(360, 44)" font-family="'Helvetica', sans-serif" font-size="14.5" fill="#525862">
      <text x="0" y="0" fill="#121519" font-weight="600">Software Dev</text>
      <line x1="0" y1="6" x2="88" y2="6" stroke="#184D42" stroke-width="2"/>
      <text x="120" y="0">Services</text>
      <text x="210" y="0">Industries</text>
      <text x="310" y="0">Case Files</text>
      <text x="410" y="0">How We Build</text>
      <text x="530" y="0">About</text>
      <text x="600" y="0">Careers</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(1160, 22)">
      <rect width="200" height="42" fill="#184D42" rx="2"/>
      <text x="100" y="25" text-anchor="middle" fill="#F6F7F8" font-family="'Helvetica', sans-serif" font-size="13.5" font-weight="600">Request consultation</text>
    </g>
  </g>

  <!-- Hero Section Content -->
  <g transform="translate(80, 160)">
    <!-- Left Column: Copy & Statistics -->
    <g transform="translate(0, 30)">
      <text x="0" y="0" fill="#184D42" font-family="'Helvetica', sans-serif" font-size="12" font-weight="700" letter-spacing="0.14em">SOFTWARE ENGINEERING &amp; TECHNICAL SERVICES</text>
      
      <text x="0" y="55" fill="#121519" font-family="'Georgia', serif" font-size="44" font-weight="500" letter-spacing="-0.03em">
        <tspan x="0" dy="0">Software development</tspan>
        <tspan x="0" dy="54">and systems built for load</tspan>
        <tspan x="0" dy="54">that cannot fail.</tspan>
      </text>

      <text x="0" y="240" fill="#525862" font-family="'Helvetica', sans-serif" font-size="16" line-height="1.5">
        <tspan x="0" dy="0">Trestle AGY architects, engineers, and operates mission-critical digital systems,</tspan>
        <tspan x="0" dy="26">intelligent agent runtimes, and high-performance software for enterprises that</tspan>
        <tspan x="0" dy="26">cannot afford downtime. One senior pod from first map to live watch.</tspan>
      </text>

      <!-- Action Buttons -->
      <g transform="translate(0, 330)">
        <rect width="230" height="46" fill="#184D42" rx="2"/>
        <text x="115" y="28" text-anchor="middle" fill="#F6F7F8" font-family="'Helvetica', sans-serif" font-size="14" font-weight="600">Request consultation →</text>

        <g transform="translate(245, 0)">
          <rect width="190" height="46" fill="#F6F7F8" stroke="#C4CAD2" stroke-width="1" rx="2"/>
          <text x="95" y="28" text-anchor="middle" fill="#121519" font-family="'Helvetica', sans-serif" font-size="14" font-weight="500">Explore software dev</text>
        </g>
      </g>

      <!-- Metrics Strip -->
      <g transform="translate(0, 420)">
        <line x1="0" y1="0" x2="560" y2="0" stroke="#C4CAD2" stroke-width="1"/>
        
        <g transform="translate(0, 30)">
          <text x="0" y="0" fill="#121519" font-family="'Georgia', serif" font-size="28" font-weight="600">2014</text>
          <text x="0" y="20" fill="#525862" font-family="'Helvetica', sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">FOUNDED</text>
        </g>

        <g transform="translate(140, 30)">
          <text x="0" y="0" fill="#121519" font-family="'Georgia', serif" font-size="28" font-weight="600">240+</text>
          <text x="0" y="20" fill="#525862" font-family="'Helvetica', sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">PRINCIPALS</text>
        </g>

        <g transform="translate(280, 30)">
          <text x="0" y="0" fill="#184D42" font-family="'Georgia', serif" font-size="28" font-weight="600">99.999%</text>
          <text x="0" y="20" fill="#525862" font-family="'Helvetica', sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">CLUSTER SLA</text>
        </g>

        <g transform="translate(430, 30)">
          <text x="0" y="0" fill="#121519" font-family="'Georgia', serif" font-size="28" font-weight="600">4 LABS</text>
          <text x="0" y="20" fill="#525862" font-family="'Helvetica', sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">REGIONAL</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Architecture & Code Specimen Terminal -->
    <g transform="translate(620, 10)" filter="url(#shadow-card)">
      <rect width="660" height="490" fill="#121519" rx="6"/>
      <rect width="660" height="490" fill="url(#term-grid)" rx="6"/>
      <rect width="658" height="488" x="1" y="1" stroke="#262C36" stroke-width="1" rx="5"/>

      <!-- Terminal Header -->
      <rect width="660" height="38" fill="#191E25" rx="5"/>
      <circle cx="20" cy="19" r="4.5" fill="#323A46"/>
      <circle cx="34" cy="19" r="4.5" fill="#323A46"/>
      <circle cx="48" cy="19" r="4.5" fill="#323A46"/>
      <text x="80" y="23" fill="#848C96" font-family="'Helvetica', sans-serif" font-size="11" font-weight="500">trestle-agy-service-mesh // node-eastwick-01</text>
      <rect x="530" y="9" width="115" height="20" fill="#20262E" rx="2"/>
      <text x="587" y="23" text-anchor="middle" fill="#5FD4B5" font-family="'Helvetica', sans-serif" font-size="10" font-weight="600">CANARY ACTIVE</text>

      <!-- Code & Schematic Body -->
      <g transform="translate(24, 65)" font-family="'Courier', monospace" font-size="12" line-height="1.5">
        <text x="0" y="0" fill="#6A7482">// Trestle AGY Zero-Downtime Service Mesh Spec</text>
        <text x="0" y="22" fill="#4EC9B0">package <tspan fill="#DCDCAA">cluster</tspan></text>
        
        <text x="0" y="52" fill="#4EC9B0">type <tspan fill="#DCDCAA">ServiceManifest</tspan> struct {</text>
        <text x="20" y="74" fill="#EAECEF">ClusterID     string   <tspan fill="#6A7482">// "EASTWICK-PRIMARY-01"</tspan></text>
        <text x="20" y="94" fill="#EAECEF">Throughput    uint64   <tspan fill="#6A7482">// 142,800 req/sec verified</tspan></text>
        <text x="20" y="114" fill="#EAECEF">P99Latency    float64  <tspan fill="#6A7482">// 8.4ms</tspan></text>
        <text x="20" y="134" fill="#EAECEF">ZeroDowntime  bool     <tspan fill="#6A7482">// true</tspan></text>
        <text x="0" y="154" fill="#4EC9B0">}</text>

        <text x="0" y="186" fill="#4EC9B0">func <tspan fill="#DCDCAA">DeployWithVerification</tspan>(ctx Context, m *Manifest) error {</text>
        <text x="20" y="208" fill="#6A7482">// Quality Gate 04: Shadow traffic diff &lt; 0.01%</text>
        <text x="20" y="228" fill="#4EC9B0">if err := VerifyShadowDiff(ctx, 0.0001); err != nil {</text>
        <text x="40" y="248" fill="#CE9178">return RollbackToPreviousStable(ctx)</text>
        <text x="20" y="268" fill="#4EC9B0">}</text>
        <text x="20" y="288" fill="#5FD4B5">return RouteCanaryTraffic(ctx, "active-active")</text>
        <text x="0" y="308" fill="#4EC9B0">}</text>
      </g>

      <!-- Terminal Bottom Telemetry Box -->
      <g transform="translate(20, 410)">
        <rect width="620" height="60" fill="#161B20" stroke="#262C36" stroke-width="1" rx="3"/>
        <circle cx="16" cy="22" r="3.5" fill="#22866B"/>
        <text x="28" y="26" fill="#EAECEF" font-family="'Helvetica', sans-serif" font-size="11" font-weight="600">LIVE TELEMETRY: 48 CLUSTERS RUNNING</text>
        <text x="16" y="46" fill="#848C96" font-family="'Helvetica', sans-serif" font-size="10.5">Continuous eBPF tracing · Zero-tolerance error budget · Automated rollback &lt;2.4s</text>
      </g>
    </g>
  </g>

  <!-- Bottom Strip: 6 Practices -->
  <g transform="translate(80, 780)">
    <rect width="1280" height="85" fill="#F6F7F8" stroke="#C4CAD2" stroke-width="1" rx="4"/>
    <g transform="translate(24, 28)" font-family="'Helvetica', sans-serif">
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#184D42" font-size="11" font-weight="700">01 // SOFTWARE DEV</text>
        <text x="0" y="20" fill="#121519" font-size="13" font-weight="600">Full-Stack &amp; APIs</text>
      </g>
      <g transform="translate(210, 0)">
        <text x="0" y="0" fill="#184D42" font-size="11" font-weight="700">02 // CLOUD MESH</text>
        <text x="0" y="20" fill="#121519" font-size="13" font-weight="600">Kubernetes &amp; IaC</text>
      </g>
      <g transform="translate(420, 0)">
        <text x="0" y="0" fill="#184D42" font-size="11" font-weight="700">03 // AI SYSTEMS</text>
        <text x="0" y="20" fill="#121519" font-size="13" font-weight="600">Agent Runtimes &amp; RAG</text>
      </g>
      <g transform="translate(640, 0)">
        <text x="0" y="0" fill="#184D42" font-size="11" font-weight="700">04 // CYBERSECURITY</text>
        <text x="0" y="20" fill="#121519" font-size="13" font-weight="600">Zero-Trust &amp; SOC 2</text>
      </g>
      <g transform="translate(860, 0)">
        <text x="0" y="0" fill="#184D42" font-size="11" font-weight="700">05 // ADVISORY</text>
        <text x="0" y="20" fill="#121519" font-size="13" font-weight="600">Legacy Modernization</text>
      </g>
      <g transform="translate(1080, 0)">
        <text x="0" y="0" fill="#184D42" font-size="11" font-weight="700">06 // MANAGED SRE</text>
        <text x="0" y="20" fill="#121519" font-size="13" font-weight="600">24/7 Operations Desk</text>
      </g>
    </g>
  </g>
</svg>
