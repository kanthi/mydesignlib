<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-pat-pipe" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222832" stroke-width="0.75" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="320" fill="#121519" rx="6"/>
  <rect width="900" height="320" fill="url(#grid-pat-pipe)" rx="6"/>
  <rect width="898" height="318" x="1" y="1" stroke="#262C36" stroke-width="1" rx="5"/>

  <!-- Pipeline Title -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#22866B"/>
    <text x="18" y="10" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" letter-spacing="0.08em">SDLC VERIFICATION GATES &amp; ZERO-DOWNTIME CANARY PIPELINE</text>
    <text x="852" y="10" text-anchor="end" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">AUTOMATED SHIP CYCLE</text>
  </g>

  <!-- Connectors -->
  <g stroke="#2C7A67" stroke-width="2" opacity="0.8">
    <line x1="165" y1="140" x2="200" y2="140" stroke-dasharray="3 3"/>
    <line x1="335" y1="140" x2="370" y2="140" stroke-dasharray="3 3"/>
    <line x1="505" y1="140" x2="540" y2="140" stroke-dasharray="3 3"/>
    <line x1="675" y1="140" x2="710" y2="140" stroke-dasharray="3 3"/>
  </g>

  <!-- Step 1: Strict Static Analysis -->
  <g transform="translate(30, 80)">
    <rect width="135" height="120" fill="#1A1E24" stroke="#323A46" stroke-width="1" rx="3"/>
    <rect width="135" height="22" fill="#20262E" rx="2"/>
    <text x="10" y="15" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">GATE 01 // STATIC</text>
    <text x="10" y="44" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Type &amp; AST Audit</text>
    <text x="10" y="62" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Strict Rust/TS Types</text>
    <text x="10" y="78" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">SAST Vulnerabilities</text>
    <text x="10" y="96" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">0 Warn Policy [PASS]</text>
  </g>

  <!-- Step 2: Comprehensive Test Suite -->
  <g transform="translate(200, 80)">
    <rect width="135" height="120" fill="#1A1E24" stroke="#323A46" stroke-width="1" rx="3"/>
    <rect width="135" height="22" fill="#20262E" rx="2"/>
    <text x="10" y="15" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">GATE 02 // TEST</text>
    <text x="10" y="44" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Unit &amp; E2E Suite</text>
    <text x="10" y="62" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">&gt;94% Code Coverage</text>
    <text x="10" y="78" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Mutation Testing</text>
    <text x="10" y="96" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Deterministic Fixtures</text>
  </g>

  <!-- Step 3: Chaos & Shadow Traffic -->
  <g transform="translate(370, 80)">
    <rect width="135" height="120" fill="#1A1E24" stroke="#184D42" stroke-width="1.5" rx="3"/>
    <rect width="135" height="22" fill="#184D42" rx="2"/>
    <text x="10" y="15" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">GATE 03 // SHADOW</text>
    <text x="10" y="44" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Live Traffic Mirror</text>
    <text x="10" y="62" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">10% Production Load</text>
    <text x="10" y="78" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Differential Analysis</text>
    <text x="10" y="96" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Diff Threshold &lt;0.01%</text>
  </g>

  <!-- Step 4: Canary Deployment -->
  <g transform="translate(540, 80)">
    <rect width="135" height="120" fill="#1A1E24" stroke="#323A46" stroke-width="1" rx="3"/>
    <rect width="135" height="22" fill="#20262E" rx="2"/>
    <text x="10" y="15" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">GATE 04 // CANARY</text>
    <text x="10" y="44" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Automated Rollout</text>
    <text x="10" y="62" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Step 5% → 25% → 100%</text>
    <text x="10" y="78" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Auto-Rollback Trigger</text>
    <text x="10" y="96" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Zero-Downtime Swap</text>
  </g>

  <!-- Step 5: SRE Observability -->
  <g transform="translate(710, 80)">
    <rect width="160" height="120" fill="#1A1E24" stroke="#323A46" stroke-width="1" rx="3"/>
    <rect width="160" height="22" fill="#20262E" rx="2"/>
    <text x="10" y="15" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">GATE 05 // OBSERVABILITY</text>
    <text x="10" y="44" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">24/7 Telemetry SRE</text>
    <text x="10" y="62" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Distributed Traces</text>
    <text x="10" y="78" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">SLO Error Budgets</text>
    <text x="10" y="96" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">15-Min Lead Response</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(30, 235)">
    <rect width="840" height="60" fill="#161B20" stroke="#262C36" stroke-width="1" rx="3"/>
    <text x="16" y="24" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500">POLICY ENFORCEMENT</text>
    <text x="16" y="44" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Every commit passes through all 5 quality gates before production traffic routing. Rehearsed rollbacks are generated alongside every build manifest.</text>
  </g>
</svg>
