  <g transform="translate(510, 190)">
    <rect width="180" height="100" fill="#1A1E24" stroke="#323A46" stroke-width="1.5" rx="3"/>
    <rect width="180" height="24" fill="#20262E" rx="3"/>
    <text x="12" y="16" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">03B // INTELLIGENCE</text>
    <text x="12" y="52" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600">AI Agent Runtime</text>
    <text x="12" y="70" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">RAG + Sandbox Tools</text>
    <text x="12" y="86" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Deterministic Eval OK</text>
