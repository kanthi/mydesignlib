<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-pat" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222832" stroke-width="0.75" opacity="0.6"/>
    </pattern>
    <linearGradient id="pine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#184D42"/>
      <stop offset="100%" stop-color="#2C7A67"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="480" fill="#121519" rx="6"/>
  <rect width="900" height="480" fill="url(#grid-pat)" rx="6"/>
  <rect width="898" height="478" x="1" y="1" stroke="#262C36" stroke-width="1" rx="5"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(24, 24)">
    <circle cx="6" cy="6" r="4" fill="#22866B"/>
    <text x="18" y="10" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" letter-spacing="0.08em">SYSTEM ARCHITECTURE SCHEMATIC // DISTRIBUTED SERVICE MESH</text>
    <text x="852" y="10" text-anchor="end" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">SPEC 4.12 — ZERO-DOWNTIME ACTIVE CLUSTER</text>
  </g>

  <!-- Connective Trace Lines -->
  <g stroke="#2C7A67" stroke-width="1.5" opacity="0.75" stroke-dasharray="4 4">
    <path d="M 170 180 L 250 180"/>
    <path d="M 430 180 L 510 120"/>
    <path d="M 430 180 L 510 240"/>
    <path d="M 690 120 L 760 180"/>
    <path d="M 690 240 L 760 180"/>
    <path d="M 340 240 L 340 330 L 510 350"/>
  </g>

  <!-- Solid Traces -->
  <g stroke="#3A4350" stroke-width="1">
    <line x1="24" y1="44" x2="876" y2="44"/>
    <line x1="24" y1="420" x2="876" y2="420"/>
  </g>

  <!-- Node 1: Ingress / Edge Gateway -->
  <g transform="translate(40, 130)">
    <rect width="130" height="100" fill="#1A1E24" stroke="#323A46" stroke-width="1.5" rx="3"/>
    <rect width="130" height="24" fill="#20262E" rx="3"/>
    <text x="12" y="16" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">01 // INGRESS</text>
    <text x="12" y="52" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600">Edge Gateway</text>
    <text x="12" y="70" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">TLS Term + WAF</text>
    <text x="12" y="86" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">&lt; 1.2ms latency</text>
  </g>

  <!-- Node 2: Auth & Rate Limiter -->
  <g transform="translate(250, 130)">
    <rect width="180" height="100" fill="#1A1E24" stroke="#184D42" stroke-width="2" rx="3"/>
    <rect width="180" height="24" fill="#184D42" rx="2"/>
    <text x="12" y="16" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">02 // POLICY ENGINE</text>
    <text x="12" y="52" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600">Auth &amp; Envoy Mesh</text>
    <text x="12" y="70" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">Zero-Trust mTLS Layer</text>
    <text x="12" y="86" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">140k req/sec verified</text>
  </g>

  <!-- Node 3A: Core Application Services -->
  <g transform="translate(510, 70)">
    <rect width="180" height="100" fill="#1A1E24" stroke="#323A46" stroke-width="1.5" rx="3"/>
    <rect width="180" height="24" fill="#20262E" rx="3"/>
