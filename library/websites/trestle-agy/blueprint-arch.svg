  <!-- Node 5: Real-time SRE Telemetry Bus -->
  <g transform="translate(510, 310)">
    <rect width="350" height="85" fill="#161B20" stroke="#262C36" stroke-width="1" rx="3"/>
    <text x="16" y="24" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500">24/7 MANAGED SRE WATCH // REAL-TIME TRACING</text>
