    <text x="32" y="69" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="10">HEALTH: 100% NOMINAL</text>
    <text x="180" y="69" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">P99 LATENCY: 8.4ms</text>
    <text x="300" y="69" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">ERRORS: 0.000%</text>
  </g>

  <!-- Bottom Footer Info -->
  <g transform="translate(24, 450)">
    <text x="0" y="0" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">TRESTLE AGY SYSTEMS DIVISION — MISSION-CRITICAL INFRASTRUCTURE STANDARD</text>
    <text x="852" y="0" text-anchor="end" fill="#525862" font-family="'IBM Plex Mono', monospace" font-size="10">STATION ID: AGY-NODE-EASTWICK-01</text>
  </g>
</svg>
