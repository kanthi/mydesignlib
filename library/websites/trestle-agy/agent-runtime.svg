<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-pat-agent" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222832" stroke-width="0.75" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="360" fill="#121519" rx="6"/>
  <rect width="900" height="360" fill="url(#grid-pat-agent)" rx="6"/>
  <rect width="898" height="358" x="1" y="1" stroke="#262C36" stroke-width="1" rx="5"/>

  <!-- Title -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#22866B"/>
    <text x="18" y="10" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" letter-spacing="0.08em">AUTONOMOUS AGENT RUNTIME &amp; DETERMINISTIC TOOL EXECUTION ENGINE</text>
    <text x="852" y="10" text-anchor="end" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">AGENT SPEC V3.4</text>
  </g>

  <!-- Flow Paths -->
  <g stroke="#2C7A67" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M 175 140 L 230 140"/>
    <path d="M 390 140 L 445 140"/>
    <path d="M 605 140 L 660 140"/>
    <path d="M 525 210 L 525 250 L 310 250"/>
  </g>

  <!-- Node 1: Intent & Semantic Router -->
  <g transform="translate(30, 80)">
    <rect width="145" height="130" fill="#1A1E24" stroke="#323A46" stroke-width="1.5" rx="3"/>
    <rect width="145" height="24" fill="#20262E" rx="2"/>
    <text x="10" y="16" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">STAGE 01 // ROUTER</text>
    <text x="10" y="48" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Semantic Intent</text>
    <text x="10" y="68" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Query Decomposition</text>
    <text x="10" y="86" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Guardrail Policy</text>
    <text x="10" y="106" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Latency &lt;14ms</text>
  </g>

  <!-- Node 2: Hybrid RAG & Vector Index -->
  <g transform="translate(230, 80)">
    <rect width="160" height="130" fill="#1A1E24" stroke="#323A46" stroke-width="1.5" rx="3"/>
    <rect width="160" height="24" fill="#20262E" rx="2"/>
    <text x="10" y="16" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">STAGE 02 // RETRIEVAL</text>
    <text x="10" y="48" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Hybrid Dense / Sparse</text>
    <text x="10" y="68" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Domain Knowledge Base</text>
    <text x="10" y="86" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Cross-Encoder Rerank</text>
    <text x="10" y="106" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Context Window Opt</text>
  </g>

  <!-- Node 3: Reasoning Engine -->
  <g transform="translate(445, 80)">
    <rect width="160" height="130" fill="#1A1E24" stroke="#184D42" stroke-width="2" rx="3"/>
    <rect width="160" height="24" fill="#184D42" rx="2"/>
    <text x="10" y="16" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">STAGE 03 // REASONING</text>
    <text x="10" y="48" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Agent CoT Engine</text>
    <text x="10" y="68" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Structured Function Call</text>
    <text x="10" y="86" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Hallucination Gate</text>
    <text x="10" y="106" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Strict JSON Schema</text>
  </g>

  <!-- Node 4: Isolated Tool Sandbox -->
  <g transform="translate(660, 80)">
    <rect width="210" height="130" fill="#1A1E24" stroke="#323A46" stroke-width="1.5" rx="3"/>
    <rect width="210" height="24" fill="#20262E" rx="2"/>
    <text x="10" y="16" fill="#2C7A67" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="600">STAGE 04 // EXECUTION</text>
    <text x="10" y="48" fill="#FFFFFF" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600">Deterministic Sandbox</text>
    <text x="10" y="68" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">gRPC / Microservice Dispatch</text>
    <text x="10" y="86" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">Rollback Transaction State</text>
    <text x="10" y="106" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="9">Audited &amp; Logged</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(30, 240)">
    <rect width="840" height="90" fill="#161B20" stroke="#262C36" stroke-width="1" rx="3"/>
    <text x="16" y="24" fill="#EAECEF" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500">DETERMINISTIC EVALUATION &amp; SECURITY GUARANTEE</text>
    <text x="16" y="46" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="9">AI agents never execute unconstrained arbitrary actions. Every tool call operates within an isolated containerized sandbox with immutable audit logging, rate limits, and cryptographic verification of all parameters.</text>
    <circle cx="20" cy="70" r="3.5" fill="#22866B"/>
    <text x="32" y="74" fill="#22866B" font-family="'IBM Plex Mono', monospace" font-size="10">EVALUATION METRIC: 99.8% TASK REPRODUCIBILITY</text>
    <text x="380" y="74" fill="#848C96" font-family="'IBM Plex Mono', monospace" font-size="10">FAIL-SAFE HUMAN ESCALATION ENABLED</text>
  </g>
</svg>
