<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Laptop Display Lid -->
  <rect x="100" y="30" width="800" height="500" rx="20" fill="#181920" stroke="#373946" stroke-width="3"/>
  <rect x="120" y="50" width="760" height="460" rx="6" fill="#0B0C10"/>
  <!-- Display Camera Notch -->
  <circle cx="500" cy="40" r="3.5" fill="#373946"/>
  
  <!-- Showcase Film Stills Inside Laptop Screen -->
  <!-- Header of website inside laptop -->
  <rect x="120" y="50" width="760" height="35" fill="#12131A"/>
  <circle cx="140" cy="67" r="5" fill="#EF4444"/>
  <circle cx="155" cy="67" r="5" fill="#F59E0B"/>
  <circle cx="170" cy="67" r="5" fill="#10B981"/>
  <text x="500" y="72" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8E93A0" text-anchor="middle">cineflow.cinema/now-playing</text>

  <!-- Film Poster Grid inside MacBook -->
  <g transform="translate(140, 105)">
    <!-- Poster 1: Twilight / Nocturne -->
    <rect x="0" y="0" width="165" height="240" rx="8" fill="#1E202B"/>
    <text x="82" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#E2E8F0" text-anchor="middle">BOOSTERS</text>
    <text x="82" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#D4A574" text-anchor="middle">35MM · SCREEN 1</text>

    <!-- Poster 2: Backrooms -->
    <rect x="185" y="0" width="165" height="240" rx="8" fill="#24212D"/>
    <text x="267" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#E2E8F0" text-anchor="middle">BACKROOMS</text>
    <text x="267" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#D4A574" text-anchor="middle">70MM ARCHIVAL</text>

    <!-- Poster 3: Leviticus -->
    <rect x="370" y="0" width="165" height="240" rx="8" fill="#2C2322"/>
    <text x="452" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#E2E8F0" text-anchor="middle">LEVITICUS</text>
    <text x="452" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#D4A574" text-anchor="middle">RESTORED 4K</text>

    <!-- Poster 4: The Invite -->
    <rect x="555" y="0" width="165" height="240" rx="8" fill="#19282C"/>
    <text x="637" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#E2E8F0" text-anchor="middle">THE INVITE</text>
    <text x="637" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#D4A574" text-anchor="middle">PREMIERE</text>
  </g>

  <!-- Laptop Base Platform -->
  <path d="M 40 530 L 960 530 L 910 550 L 90 550 Z" fill="#2A2C38"/>
  <path d="M 430 530 L 570 530 L 565 536 L 435 536 Z" fill="#181920"/>
</svg>