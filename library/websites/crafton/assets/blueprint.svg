<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Subtle Blueprint Grid -->
  <defs>
    <pattern id="bpGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111317" stroke-width="0.75" stroke-opacity="0.04"/>
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#111317" stroke-width="0.5" stroke-opacity="0.02" stroke-dasharray="2 2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bpGrid)" />

  <!-- Architectural Floorplan Schematic Lines -->
  <g stroke="#ff5e14" stroke-width="1.2" stroke-opacity="0.16" fill="none">
    <!-- Exterior perimeter -->
    <rect x="60" y="50" width="480" height="300" stroke-width="1.8"/>
    <!-- Internal partition walls -->
    <line x1="220" y1="50" x2="220" y2="230" />
    <line x1="60" y1="230" x2="360" y2="230" />
    <line x1="360" y1="50" x2="360" y2="350" stroke-dasharray="8 6"/>
    <line x1="220" y1="140" x2="360" y2="140" />
    <line x1="60" y1="130" x2="150" y2="130" />
    
    <!-- Door swing arcs -->
    <path d="M 220 180 A 40 40 0 0 1 260 220" stroke-dasharray="3 3"/>
    <path d="M 360 270 A 50 50 0 0 0 410 320" stroke-dasharray="3 3"/>
    
    <!-- Dimension arrows and ticks -->
    <path d="M 60 30 L 220 30" stroke="#111317" stroke-opacity="0.12" stroke-width="0.8"/>
    <line x1="60" y1="24" x2="60" y2="36" stroke="#111317" stroke-opacity="0.15"/>
    <line x1="220" y1="24" x2="220" y2="36" stroke="#111317" stroke-opacity="0.15"/>

    <path d="M 220 30 L 540 30" stroke="#111317" stroke-opacity="0.12" stroke-width="0.8"/>
    <line x1="540" y1="24" x2="540" y2="36" stroke="#111317" stroke-opacity="0.15"/>
    
    <!-- Stair tread markings -->
    <line x1="380" y1="70" x2="440" y2="70" stroke-width="0.8"/>
    <line x1="380" y1="85" x2="440" y2="85" stroke-width="0.8"/>
    <line x1="380" y1="100" x2="440" y2="100" stroke-width="0.8"/>
    <line x1="380" y1="115" x2="440" y2="115" stroke-width="0.8"/>
    <line x1="380" y1="130" x2="440" y2="130" stroke-width="0.8"/>
  </g>

  <!-- Technical dimension text annotations -->
  <text x="130" y="24" font-family="sans-serif" font-size="9" fill="#111317" fill-opacity="0.2" text-anchor="middle">14'-6"</text>
  <text x="380" y="24" font-family="sans-serif" font-size="9" fill="#111317" fill-opacity="0.2" text-anchor="middle">28'-4"</text>
  <text x="140" y="190" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ff5e14" fill-opacity="0.15" text-anchor="middle">ZONE 01 / LIVING</text>
  <text x="290" y="95" font-family="sans-serif" font-size="9" fill="#111317" fill-opacity="0.18" text-anchor="middle">KITCHEN</text>
  <text x="450" y="250" font-family="sans-serif" font-size="9" fill="#111317" fill-opacity="0.18" text-anchor="middle">MASTER SUITE</text>
</svg>
