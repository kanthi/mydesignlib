<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- Room Background -->
  <rect width="1200" height="675" fill="#14161a"/>
  
  <!-- Perspective Back Wall -->
  <polygon points="200,80 1000,80 1000,520 200,520" fill="#1d2026"/>
  <polygon points="0,0 200,80 200,520 0,675" fill="#17191f"/>
  <polygon points="1000,80 1200,0 1200,675 1000,520" fill="#111317"/>
  
  <!-- Floor Perspective with Warm Wood Tone -->
  <polygon points="200,520 1000,520 1200,675 0,675" fill="#3a2518"/>
  <path d="M 300,520 L 200,675 M 450,520 L 400,675 M 600,520 L 600,675 M 750,520 L 800,675 M 900,520 L 1000,675" stroke="#2c1a10" stroke-width="3"/>

  <!-- Architectural Feature Wall - Color Blocks -->
  <rect x="250" y="100" width="120" height="420" fill="#e5aa24" />
  <rect x="370" y="100" width="140" height="420" fill="#1b3d2f" />
  <rect x="510" y="100" width="180" height="420" fill="#cc3d2b" />
  <rect x="690" y="100" width="140" height="420" fill="#2455e5" />
  <rect x="830" y="100" width="120" height="420" fill="#e5aa24" />

  <!-- Modern Ceiling Track Lights -->
  <line x1="200" y1="120" x2="1000" y2="120" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  <circle cx="310" cy="120" r="10" fill="#fff" filter="drop-shadow(0 0 10px #fff)"/>
  <circle cx="440" cy="120" r="10" fill="#fff" filter="drop-shadow(0 0 10px #fff)"/>
  <circle cx="600" cy="120" r="10" fill="#fff" filter="drop-shadow(0 0 10px #fff)"/>
  <circle cx="760" cy="120" r="10" fill="#fff" filter="drop-shadow(0 0 10px #fff)"/>
  <circle cx="890" cy="120" r="10" fill="#fff" filter="drop-shadow(0 0 10px #fff)"/>

  <!-- Luxury Ochre Armchair Visual in Foreground -->
  <g transform="translate(540, 380)">
    <!-- Armchair Shadow -->
    <ellipse cx="60" cy="120" rx="90" ry="20" fill="#0c0e12" opacity="0.8"/>
    <!-- Seat Cushion -->
    <rect x="-10" y="40" width="140" height="45" rx="15" fill="#f5b82e"/>
    <!-- Backrest -->
    <rect x="0" y="-30" width="120" height="80" rx="20" fill="#e5aa24"/>
    <!-- Left Arm -->
    <rect x="-25" y="15" width="30" height="60" rx="12" fill="#d4991b"/>
    <!-- Right Arm -->
    <rect x="115" y="15" width="30" height="60" rx="12" fill="#d4991b"/>
    <!-- Wooden Legs -->
    <line x1="-10" y1="85" x2="-20" y2="120" stroke="#5c3a21" stroke-width="8" stroke-linecap="round"/>
    <line x1="130" y1="85" x2="140" y2="120" stroke="#5c3a21" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Potted Architectural Plant -->
  <g transform="translate(260, 360)">
    <ellipse cx="25" cy="110" rx="35" ry="10" fill="#0c0e12" opacity="0.7"/>
    <path d="M 0,60 L 50,60 L 40,110 L 10,110 Z" fill="#ffffff"/>
    <path d="M 25,60 C 10,20 -20,10 -30,-20 C 0,-10 20,20 25,60 Z" fill="#1b4d3e"/>
    <path d="M 25,60 C 40,20 70,10 80,-20 C 50,-10 30,20 25,60 Z" fill="#2d6e5a"/>
    <path d="M 25,60 C 25,0 25,-40 25,-60 C 35,-30 35,10 25,60 Z" fill="#1b4d3e"/>
  </g>
</svg>
