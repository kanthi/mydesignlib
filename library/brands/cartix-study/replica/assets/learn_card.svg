<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="60%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="pTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </linearGradient>
    <linearGradient id="pFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="pSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>

  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#learnBg)" stroke="#D8B4FE" stroke-width="1.5"/>

  <!-- 3D Isometric Stepped Pillars -->
  <!-- Pillar 1 (Low Left) -->
  <g transform="translate(60, 220)">
    <polygon points="50,0 100,25 50,50 0,25" fill="url(#pTop)"/>
    <polygon points="0,25 50,50 50,140 0,115" fill="url(#pFront)"/>
    <polygon points="50,50 100,25 100,115 50,140" fill="url(#pSide)"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#6B21A8" text-anchor="middle">AI</text>
  </g>

  <!-- Pillar 2 (Mid Left) -->
  <g transform="translate(130, 160)">
    <polygon points="50,0 100,25 50,50 0,25" fill="url(#pTop)"/>
    <polygon points="0,25 50,50 50,200 0,175" fill="url(#pFront)"/>
    <polygon points="50,50 100,25 100,175 50,200" fill="url(#pSide)"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#6B21A8" text-anchor="middle">👑</text>
  </g>

  <!-- Pillar 3 (Tall Center) -->
  <g transform="translate(200, 90)">
    <polygon points="50,0 100,25 50,50 0,25" fill="url(#pTop)"/>
    <polygon points="0,25 50,50 50,270 0,245" fill="url(#pFront)"/>
    <polygon points="50,50 100,25 100,245 50,270" fill="url(#pSide)"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#6B21A8" text-anchor="middle">🔑</text>
  </g>

  <!-- Pillar 4 (Mid Right) -->
  <g transform="translate(290, 140)">
    <polygon points="50,0 100,25 50,50 0,25" fill="url(#pTop)"/>
    <polygon points="0,25 50,50 50,220 0,195" fill="url(#pFront)"/>
    <polygon points="50,50 100,25 100,195 50,220" fill="url(#pSide)"/>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#6B21A8" text-anchor="middle">💎</text>
  </g>
</svg>