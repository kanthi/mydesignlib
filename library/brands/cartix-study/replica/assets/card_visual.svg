<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="meshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#065F46" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#meshBg)" stroke="#D1FAE5" stroke-width="1.5"/>

  <!-- Orbiting Ecosystem Integration Logos -->
  <g transform="translate(60, 40)">
    <!-- Node 1: Visa / Card -->
    <circle cx="50" cy="50" r="26" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <text x="50" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#2563EB" text-anchor="middle">VISA</text>

    <!-- Node 2: Mastercard -->
    <circle cx="150" cy="65" r="26" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <circle cx="144" cy="65" r="11" fill="#EB001B" opacity="0.9"/>
    <circle cx="156" cy="65" r="11" fill="#F79E1B" opacity="0.9"/>

    <!-- Node 3: WordPress -->
    <circle cx="270" cy="45" r="26" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <text x="270" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#21759B" text-anchor="middle">W</text>

    <!-- Node 4: Apple Pay -->
    <circle cx="110" cy="140" r="28" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <text x="110" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">Pay</text>

    <!-- Node 5: WooCommerce -->
    <circle cx="230" cy="145" r="28" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <text x="230" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7F54B3" text-anchor="middle">woo</text>

    <!-- Node 6: PayPal -->
    <circle cx="330" cy="160" r="28" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.06))"/>
    <text x="330" y="166" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#003087" text-anchor="middle">P</text>
  </g>

  <!-- Foreground High-Risk Payment Card -->
  <g transform="translate(35, 205)" filter="url(#floatShadow)">
    <rect width="470" height="185" rx="20" fill="url(#cardGrad)"/>
    <!-- Chip & Contactless -->
    <rect x="35" y="30" width="45" height="32" rx="6" fill="#FDE047" opacity="0.85"/>
    <path d="M 430 45 C 435 48 438 52 438 57 C 438 62 435 66 430 69 M 424 49 C 427 51 429 54 429 57 C 429 60 427 63 424 65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Brand -->
    <text x="35" y="105" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">cartix</text>
    <!-- Card Number -->
    <text x="35" y="150" font-family="'Courier New', monospace" font-size="21" font-weight="700" fill="#FFFFFF" letter-spacing="0.16em">4835  3245  1997  1228</text>
  </g>
</svg>