<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="shipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#shipBg)" stroke="#A5B4FC" stroke-width="1.5"/>

  <!-- Status Bar on Top -->
  <g transform="translate(45, 55)">
    <rect width="450" height="60" rx="16" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.3"/>
    
    <!-- Step 1 -->
    <circle cx="45" cy="30" r="14" fill="#FFFFFF"/>
    <circle cx="45" cy="30" r="6" fill="#4F46E5"/>
    <text x="68" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Order Placed</text>

    <!-- Connector Line -->
    <line x1="150" y1="30" x2="220" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Step 2 -->
    <circle cx="245" cy="30" r="14" fill="#FFFFFF"/>
    <circle cx="245" cy="30" r="6" fill="#10B981"/>
    <text x="268" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">In Transit</text>

    <!-- Connector Line -->
    <line x1="340" y1="30" x2="400" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="415" cy="30" r="10" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>

  <!-- World Map Silhouette with Glowing Route Waypoints -->
  <g transform="translate(60, 150)" opacity="0.95">
    <ellipse cx="210" cy="110" rx="190" ry="90" fill="#FFFFFF" fill-opacity="0.08"/>
    
    <!-- Waypoint 1 (China/Shenzhen) -->
    <g transform="translate(290, 80)">
      <circle cx="0" cy="0" r="18" fill="#F43F5E" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="7" fill="#F43F5E"/>
      <text x="0" y="-14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Shenzhen Hub</text>
    </g>

    <!-- Waypoint 2 (US / Global) -->
    <g transform="translate(90, 110)">
      <circle cx="0" cy="0" r="18" fill="#10B981" fill-opacity="0.3"/>
      <circle cx="0" cy="0" r="7" fill="#10B981"/>
      <text x="0" y="-14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">US Direct 4-7d</text>
    </g>

    <!-- Curved Route Arc -->
    <path d="M 290 80 Q 190 20 90 110" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>
</svg>