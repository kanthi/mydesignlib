<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <radialGradient id="shieldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </radialGradient>
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#EA580C" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#shieldRadial)" stroke="#FDBA74" stroke-width="1.5"/>

  <!-- Floating Alert Pill 1 -->
  <g transform="translate(160, 45)" filter="drop-shadow(0 6px 12px rgba(234,88,12,0.18))">
    <rect width="210" height="42" rx="21" fill="#EA580C"/>
    <circle cx="24" cy="21" r="10" fill="#FFFFFF"/>
    <text x="24" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#EA580C" text-anchor="middle">!</text>
    <text x="46" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Chargeback Detected!</text>
  </g>

  <!-- Floating Alert Pill 2 -->
  <g transform="translate(130, 95)" filter="drop-shadow(0 6px 12px rgba(234,88,12,0.22))">
    <rect width="250" height="44" rx="22" fill="#F97316"/>
    <circle cx="24" cy="22" r="10" fill="#FFFFFF"/>
    <text x="24" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#F97316" text-anchor="middle">!</text>
    <text x="46" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Chargeback Detected!</text>
  </g>

  <!-- Center Holographic Frosted Glass Shield -->
  <g transform="translate(195, 170)" filter="url(#shieldGlow)">
    <path d="M 75 0 C 130 0 150 25 150 75 C 150 150 75 195 75 195 C 75 195 0 150 0 75 C 0 25 20 0 75 0 Z" fill="#FFFFFF" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Monogram Loop Inside Shield -->
    <g transform="translate(36, 75) scale(0.85)" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 18 16 C 8 16 0 10 0 0 C 0 -10 8 -16 18 -16 C 30 -16 38 -4 44 0 C 50 4 58 16 70 16 C 80 16 88 10 88 0 C 88 -10 80 -16 70 -16 C 58 -16 50 -4 44 0 C 38 4 30 16 18 16 Z"/>
    </g>
  </g>

  <!-- Floating Coins / Dollars around Shield -->
  <g transform="translate(65, 230)" filter="drop-shadow(0 8px 14px rgba(0,0,0,0.1))">
    <circle cx="35" cy="35" r="28" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
    <text x="35" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#F97316" text-anchor="middle">$</text>
  </g>
  <g transform="translate(400, 230)" filter="drop-shadow(0 8px 14px rgba(0,0,0,0.1))">
    <circle cx="35" cy="35" r="28" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
    <text x="35" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#F97316" text-anchor="middle">$</text>
  </g>
</svg>