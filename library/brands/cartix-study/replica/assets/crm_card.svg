<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" width="100%" height="100%">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="crmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.12"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="15" y="15" width="510" height="390" rx="28" fill="url(#crmBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#blurShadow)"/>

  <!-- Subtle Metric Dashboard Rows -->
  <g transform="translate(45, 60)" font-family="system-ui, -apple-system, sans-serif">
    <!-- Stat 1 -->
    <text x="0" y="0" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.04em">TOTAL SALES</text>
    <text x="0" y="32" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">$137,142.33</text>
    <text x="180" y="30" font-size="13" font-weight="700" fill="#10B981">+1,046%</text>

    <!-- Stat 2 -->
    <text x="310" y="0" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="0.04em">ONLINE STORE SESSIONS</text>
    <text x="310" y="32" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">93,418</text>
  </g>

  <!-- Giant 3D Glowing "CRM" Letters in Center-Bottom -->
  <g transform="translate(65, 230)" filter="url(#blurShadow)">
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="900" fill="url(#crmGlow)" letter-spacing="0.02em" opacity="0.95">CRM</text>
    <!-- Highlight Overlay -->
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="900" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6">CRM</text>
  </g>

  <!-- Floating Shopify Notification Pill 1 (Top Right) -->
  <g transform="translate(230, 85)" filter="url(#pillShadow)">
    <rect width="240" height="52" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="14" y="12" width="28" height="28" rx="8" fill="#95BF47" opacity="0.2"/>
    <!-- Shopify Bag S Icon -->
    <path d="M 28 20 C 26 20 25 21 25 23 L 24 32 C 24 33 25 34 26 34 L 30 34 C 31 34 32 33 32 32 L 31 23 C 31 21 30 20 28 20 Z" fill="#95BF47"/>
    <text x="54" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Shopify</text>
    <text x="54" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">New Subscriber · <tspan font-weight="700" fill="#0F172A">$30</tspan></text>
  </g>

  <!-- Floating Shopify Notification Pill 2 (Mid Left) -->
  <g transform="translate(40, 185)" filter="url(#pillShadow)">
    <rect width="240" height="52" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="14" y="12" width="28" height="28" rx="8" fill="#95BF47" opacity="0.2"/>
    <path d="M 28 20 C 26 20 25 21 25 23 L 24 32 C 24 33 25 34 26 34 L 30 34 C 31 34 32 33 32 32 L 31 23 C 31 21 30 20 28 20 Z" fill="#95BF47"/>
    <text x="54" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Shopify</text>
    <text x="54" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">New Subscriber · <tspan font-weight="700" fill="#0F172A">$30</tspan></text>
  </g>

  <!-- Floating Shopify Notification Pill 3 (Mid Right) -->
  <g transform="translate(260, 245)" filter="url(#pillShadow)">
    <rect width="230" height="52" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="14" y="12" width="28" height="28" rx="8" fill="#95BF47" opacity="0.2"/>
    <path d="M 28 20 C 26 20 25 21 25 23 L 24 32 C 24 33 25 34 26 34 L 30 34 C 31 34 32 33 32 32 L 31 23 C 31 21 30 20 28 20 Z" fill="#95BF47"/>
    <text x="54" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Shopify</text>
    <text x="54" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748B">New Subscriber · <tspan font-weight="700" fill="#0F172A">$30</tspan></text>
  </g>
</svg>