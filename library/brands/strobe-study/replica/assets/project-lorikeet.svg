<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#0D0E12"/>
  <defs>
    <radialGradient id="sphereGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="60%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Spherical 3D Orb -->
  <circle cx="400" cy="220" r="130" fill="url(#sphereGrad)"/>
  <!-- Kinetic Orbit Rings -->
  <ellipse cx="400" cy="220" rx="220" ry="60" stroke="#FF3366" stroke-width="2" stroke-dasharray="8 6" transform="rotate(-20 400 220)"/>
  <ellipse cx="400" cy="220" rx="180" ry="45" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" transform="rotate(35 400 220)"/>

  <!-- Badges -->
  <rect x="40" y="40" width="140" height="28" rx="4" fill="#1A1C24" stroke="#2D303D"/>
  <text x="55" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF3366">SPATIAL WEBGL</text>
  <text x="40" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">LORIKEET 3D</text>
  <text x="40" y="465" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7A8494">KINETIC IDENTITY &amp; E-COMMERCE</text>
</svg>
