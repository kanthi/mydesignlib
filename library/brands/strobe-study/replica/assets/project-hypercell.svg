<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#08090C"/>
  <defs>
    <linearGradient id="cyberGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Network Waves -->
  <path d="M 50 350 Q 200 150 400 250 T 750 180" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 50 370 Q 200 170 400 270 T 750 200" fill="none" stroke="#7000FF" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 50 390 Q 200 190 400 290 T 750 220" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Network Nodes -->
  <circle cx="200" cy="180" r="10" fill="#00F0FF"/>
  <circle cx="400" cy="250" r="14" fill="#7000FF"/>
  <circle cx="600" cy="190" r="8" fill="#00F0FF"/>

  <!-- Badges -->
  <rect x="40" y="40" width="160" height="28" rx="4" fill="#141720" stroke="#252B3B"/>
  <text x="55" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00F0FF">AUTONOMOUS CLOUD</text>
  <text x="40" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">HYPERCELL AI</text>
  <text x="40" y="465" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7A8494">INFRASTRUCTURE REBRAND &amp; DESIGN SYSTEM</text>
</svg>
