<title>Strobe — Social kit</title>
<link rel="icon" href="assets/strobe-app-icon.svg"><link rel="stylesheet" href="shared.css">
<style>
body{background:#08090C;padding:40px 24px 72px;color:#FFFFFF}
h1{font-family:var(--display);font-weight:var(--disp-weight);font-size:40px;letter-spacing:var(--disp-track);margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);max-width:1400px;margin:0 auto 28px;color:#7E8794}
.sub a{color:#FFFFFF}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.16)}
body.export{padding:0;background:#08090C}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:700 22px var(--sans);letter-spacing:.08em;text-transform:uppercase}
.big{font-family:var(--display);font-weight:var(--disp-weight);letter-spacing:var(--disp-track);line-height:.9}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.wrd{font-family:var(--display);font-weight:800;letter-spacing:var(--word-track);text-transform:var(--word-transform);display:flex;align-items:center;gap:14px;font-size:32px}
.wrd img{width:48px;height:48px;object-fit:contain}
.plans{position:absolute;left:72px;right:72px;bottom:220px;display:flex;gap:28px}
.plans b{display:block;font-family:var(--display);font-size:42px}
</style></head><body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Strobe study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#08090C">
  <p class="kicker" style="color:#08090C">Desk</p>
<p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:84px;color:#08090C">Moving</p>
  <div class="foot"><span class="wrd"><img src="assets/strobe-symbol-ink.svg" alt=""><span class="word" style="color:#08090C">STROBE<span style="color:#08090C">.</span></span></span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#08090C;color:#FFFFFF">
  <p class="kicker" style="color:#FFFFFF">Open</p>
<p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:140px;color:#FFFFFF">Moving</p>
<p class="big" style="position:absolute;left:72px;right:72px;top:460px;font-size:72px;color:#FFFFFF">forward.</p>
  <div class="foot"><span class="wrd"><img src="assets/strobe-symbol.svg" alt=""><span class="word" style="color:#FFFFFF">STROBE<span style="color:#CCFF00">.</span></span></span><span style="font:700 28px var(--sans);color:#FFFFFF">Open</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFFFF;color:#08090C">
  <p class="kicker" style="color:#08090C">Plans</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:72px;color:#08090C">Three ways.</p>
  <div class="plans"><div><b>Systems</b><span style="font:18px var(--sans);color:#08090C">Brand</span></div><div><b>Motion</b><span style="font:18px var(--sans);color:#08090C">3D</span></div><div><b>Web</b><span style="font:18px var(--sans);color:#08090C">Live</span></div></div>
  <div class="foot"><span class="wrd"><img src="assets/strobe-symbol-ink.svg" alt=""><span class="word" style="color:#08090C">STROBE<span style="color:#08090C">.</span></span></span></div>
</section></div>
<div class="frame"><section class="ab st" id="story" style="background:#08090C;color:#FFFFFF">
  <p class="kicker" style="color:#FFFFFF">Live</p>
  <img src="assets/strobe-symbol.svg" alt="" style="position:absolute;left:72px;top:280px;width:140px;height:140px;object-fit:contain">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:110px;color:#FFFFFF">One system.</p>
  <div class="foot"><span class="wrd"><img src="assets/strobe-symbol.svg" alt=""><span class="word" style="color:#FFFFFF">STROBE<span style="color:#CCFF00">.</span></span></span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
