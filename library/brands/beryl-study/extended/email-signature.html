<title>Beryl — Email signature</title>
<link rel="icon" href="assets/beryl-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:var(--page);color:var(--paper);padding:48px 24px 80px}
.w{max-width:760px;margin:0 auto}
a.back{font:12px var(--mono);color:var(--muted);text-decoration:none}
h1{font-size:40px;letter-spacing:-.04em;margin:18px 0 8px}
p.lead{color:var(--muted);max-width:52ch;line-height:1.5}
.sheet{margin-top:28px;background:var(--paper);color:var(--ink);border-radius:12px;padding:28px}
.note{margin-top:22px;font:12px/1.5 var(--mono);color:var(--muted)}
pre{margin-top:18px;background:#101410;color:#d5ddd5;padding:16px;border-radius:10px;overflow:auto;font:12px/1.5 var(--mono)}
</style>

<body>
<div class="w">
  <a class="back" href="merch.html">← Merch</a>
  <h1>Email signature</h1>
  <p class="lead">Table markup for a mail client. The gem on this page is the local SVG. Swap the image address for a hosted PNG when the signature leaves the study.</p>
  <div class="sheet" id="sig">
    <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif">
      <tr>
        <td style="padding:0 16px 0 0;vertical-align:middle;border-right:2px solid #2BD132">
          <img src="assets/beryl-symbol-ink.svg" width="44" height="44" alt="Beryl" style="display:block;border:0">
        </td>
        <td style="padding:0 0 0 16px;vertical-align:top">
          <div style="font-size:16px;font-weight:700;letter-spacing:-0.3px;color:#071107">Ivo Lane</div>
          <div style="font-family:'Geist Mono',Menlo,Consolas,monospace;font-size:11px;color:#5c675c;margin-top:2px">Desk, Beryl</div>
          <div style="font-family:'Geist Mono',Menlo,Consolas,monospace;font-size:12px;line-height:1.6;color:#071107;margin-top:8px">
            <a href="mailto:hello@beryl.example" style="color:#071107;text-decoration:none">hello@beryl.example</a><br>
            beryl.example
          </div>
        </td>
      </tr>
    </table>
  </div>
  <p class="note">The note opens in your mail. This page does not store a message.</p>
</div>
</body>
