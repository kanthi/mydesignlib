<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tansy — Social</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z97ZD3EVSF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Z97ZD3EVSF');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared.css">
<style>
  main { max-width: 1200px; margin: 0 auto; padding: 32px 28px 72px; }
  h1 { margin: 8px 0 6px; font-weight: 800; letter-spacing: -0.045em; font-size: clamp(40px, 6vw, 68px); line-height: 0.92; }
  .kicker { margin: 0; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--field); }
  .kit { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; margin-top: 22px; }
  figure { margin: 0; }
  figcaption { margin-top: 8px; font-size: 13px; font-weight: 700; }
  .slot { position: relative; overflow: hidden; border-radius: 10px; width: 320px; height: 320px; }
  .slot.story { width: 270px; height: 480px; }
  .post {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1080px;
    transform: scale(0.296296);
    transform-origin: top left;
    background: var(--field);
    color: var(--cream);
    overflow: hidden;
  }
  .story .post { height: 1920px; transform: scale(0.25); }
  .post .script { position: absolute; top: 64px; left: 72px; font-family: var(--script); font-size: 72px; }
  .word {
    position: absolute;
    left: 0; right: 0;
    top: 340px;
    margin: 0;
    text-align: center;
    font-weight: 800;
    font-size: 220px;
    letter-spacing: -0.045em;
    line-height: 0.85;
  }
  .sub { position: absolute; left: 72px; bottom: 72px; margin: 0; font-size: 36px; font-weight: 500; }
  .basket { position: absolute; inset: 0; }
  .basket img { width: 100%; height: 100%; object-fit: cover; }
  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 48px 64px;
    background: var(--field);
  }
  .bar strong { display: block; font-weight: 800; font-size: 64px; letter-spacing: -0.04em; }
  .bar span { font-size: 32px; }
  .talk {
    position: absolute;
    left: 72px; right: 72px;
    top: 360px;
  }
  .talk h2 { margin: 0; font-weight: 800; font-size: 140px; letter-spacing: -0.045em; line-height: 0.9; }
  .row { display: flex; align-items: center; gap: 22px; margin-top: 36px; font-size: 40px; font-weight: 700; }
  .chip {
    width: 72px; height: 72px; border-radius: 14px;
    background: var(--cream); color: var(--field);
    display: grid; place-items: center;
  }
  .story .word { top: 180px; font-size: 150px; }
  .story .photo { position: absolute; left: 0; right: 0; top: 460px; height: 980px; }
  .story .photo img { width: 100%; height: 100%; object-fit: cover; }
  .story .talk { top: auto; bottom: 80px; }
  .story .talk h2 { font-size: 92px; }
</style>
</head>
<body>
<main>
<!-- SECTION: social -->
<p class="kicker">Tansy · Social</p>
<h1>Three posts and a story.</h1>
<p>Field, cream, and the flower photographs. Type sits in the layout, not inside the picture.</p>
<div class="kit">
  <figure>
    <div class="slot">
      <div class="post" aria-label="Post, the word on the field">
        <div class="script">Tansy</div>
        <p class="word">Tansy</p>
        <p class="sub">A flower house</p>
      </div>
    </div>
    <figcaption>Post · 1080 × 1080 · The word</figcaption>
  </figure>
  <figure>
    <div class="slot">
      <div class="post" aria-label="Post, a basket">
        <div class="basket"><img src="assets/basket.jpg" alt=""></div>
        <div class="bar"><strong>Week basket</strong><span>From the house</span></div>
      </div>
    </div>
    <figcaption>Post · 1080 × 1080 · Basket</figcaption>
  </figure>
  <figure>
    <div class="slot">
      <div class="post" aria-label="Post, let’s talk">
        <div class="script">Tansy</div>
        <div class="talk">
          <h2>Let’s talk</h2>
          <div class="row">
            <span class="chip" aria-hidden="true"><svg viewBox="0 0 12 12" width="36" height="36"><path d="M1.6 6h8M6.6 2.8 9.8 6 6.6 9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            desk@tansy.example
          </div>
        </div>
      </div>
    </div>
    <figcaption>Post · 1080 × 1080 · Let’s talk</figcaption>
  </figure>
  <figure>
    <div class="slot story">
      <div class="post" aria-label="Story">
        <div class="script">Tansy</div>
        <p class="word">Tansy</p>
        <div class="photo"><img src="assets/valley.jpg" alt=""></div>
        <div class="talk">
          <h2>Let’s talk</h2>
          <div class="row">desk@tansy.example</div>
        </div>
      </div>
    </div>
    <figcaption>Story · 1080 × 1920</figcaption>
  </figure>
</div>
<!-- /SECTION: social -->
</main>
</body>
</html>
