    height: 280px;

    color: var(--ink);

    padding: 18px 16px;
    box-shadow: 0 16px 40px rgba(42, 36, 8, 0.12);

  }
  .hole { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); margin: 0 auto 16px; }
