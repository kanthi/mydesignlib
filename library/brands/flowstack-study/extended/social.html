<!doctype html>
<html lang="en"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flowstack — Social kit</title>
<link rel="icon" href="assets/flowstack-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#0B0C14;color:#fff;padding:40px 24px 72px}
h1{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:-.022em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);color:#F7F7F8;max-width:1400px;margin:0 auto 28px}
.sub a{color:#FFFFFF}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.35)}
body.export{padding:0;background:#0B0C14}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--display);font-weight:400;letter-spacing:-.03em;line-height:.92}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:500;font-size:28px;letter-spacing:-.02em}
.word img{width:36px;height:36px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Flowstack study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#111111">
  <p class="kicker" style="color:#1667E0">Workspace</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:84px">We simplify tasks for modern teams.</p>
  <div class="foot"><span class="word"><img src="assets/flowstack-symbol.svg" alt="">Flowstack</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">DESK</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#0B0C14;color:#FFFFFF">
  <p class="kicker">Open</p>
  <p class="big" style="position:absolute;left:72px;top:220px;font-size:180px">Tasks</p>
  <p style="position:absolute;left:72px;top:460px;font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:-.02em">for modern teams</p>
  <div class="foot"><span class="word"><img src="assets/flowstack-symbol-reverse.svg" alt="">Flowstack</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">$12</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFFFF;color:#111111">
  <p class="kicker" style="color:#1667E0">Pricing</p>
  <div style="position:absolute;left:72px;right:72px;top:220px;display:grid;gap:28px">
    <div><p class="kicker" style="position:static;color:#1667E0">Starter</p><p class="big" style="font-size:72px">$0</p></div>
    <div><p class="kicker" style="position:static;color:#1667E0">Team</p><p class="big" style="font-size:72px">$12</p></div>
    <div><p class="kicker" style="position:static;color:#1667E0">Business</p><p class="big" style="font-size:72px">$24</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/flowstack-symbol.svg" alt="">Flowstack</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#0B0C14;color:#FFFFFF">
  <img src="assets/flowstack-app-icon.svg" alt="" style="position:absolute;left:72px;top:280px;width:180px;height:180px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:120px">One place.</p>
  <div class="foot"><span class="word"><img src="assets/flowstack-symbol-reverse.svg" alt="">Flowstack</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
