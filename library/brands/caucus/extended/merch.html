  <style>
    body { background: var(--ground); color: var(--pith); padding: 28px 28px 72px; }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .top a { color: var(--white); font-weight: 700; letter-spacing: var(--track); text-decoration: none; }
    h1 { margin: 8px 0 6px; color: var(--white); font-weight: 500; letter-spacing: var(--track); font-size: clamp(32px, 4vw, 48px); }
    .intro { margin: 0 0 28px; max-width: 58ch; line-height: 1.45; }
    .intro a { color: var(--white); }
    .wall { display: flex; flex-wrap: wrap; gap: 28px 32px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin-top: 8px; font-size: 12px; color: #EFEEDA; }
    .letter {
      width: 300px;
      max-width: 100%;
      height: 424px;
      background: var(--pith);
      color: var(--ink);
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 11px;
      line-height: 1.45;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--tyrian);
      font-weight: 700;
      letter-spacing: var(--track);
      font-size: 14px;
    }
    .brand .mark { width: 16px; height: 16px; }
    .letter p { margin: 0; }
    .letter .grow { margin-top: auto; }
    .env {
      width: 380px;
      max-width: 100%;
      height: 210px;
      background: var(--pith);
      position: relative;
      overflow: hidden;
      color: var(--ink);
    }
    .flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 46%;
      background: var(--tyrian);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }
    .env .who {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 14%;
      font-size: 13px;
      line-height: 1.4;
    }
    .env .who b { letter-spacing: var(--track); }
    .badge {
      width: 200px;
      max-width: 100%;
      height: 320px;
      background: var(--white);
      color: var(--ink);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .badge .wash {
      height: 38%;
      display: grid;
      place-items: center;
    }
    .badge .wash .mark { width: 48px; height: 48px; }
    .badge .who { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 4px; }
    .badge strong { letter-spacing: var(--track); font-size: 16px; }
    .badge span { font-size: 13px; color: #4A3A40; }
    .badge a { color: var(--tyrian); font-size: 12px; margin-top: 8px; }
    .tee, .tote { width: min(220px, 70vw); height: auto; }
    @media (max-width: 640px) {
      body { padding: 20px 16px 48px; }
      .letter, .env, .badge, .tee, .tote { width: min(300px, 100%); height: auto; }
      .letter { height: 420px; }
      .env { height: 190px; }
      .badge { height: 300px; }
    }
  </style>
</head>
