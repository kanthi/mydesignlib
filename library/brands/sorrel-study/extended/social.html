<html lang="en"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorrel — Social kit</title>
<link rel="icon" href="assets/sorrel-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#14352C;color:#F6F0EA;padding:40px 24px 72px}
h1{font-weight:500;font-size:40px;letter-spacing:-.045em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--mono);color:#C1DDD6;max-width:1400px;margin:0 auto 28px}
.sub a{color:#EC6555}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.35)}
body.export{padding:0;background:#14352C}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--mono);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.big{font-weight:500;letter-spacing:-.06em;line-height:.88}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:12px;font-weight:600;font-size:28px;letter-spacing:-.04em}
.word img{width:36px;height:36px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Sorrel study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#C1DDD6;color:#14352C">
  <p class="kicker" style="color:#2A6355">Payouts</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:280px;font-size:92px">Build better payment products</p>
  <div class="foot"><span class="word"><img src="assets/sorrel-symbol.svg" alt="">sorrel</span><span style="font:22px var(--mono);letter-spacing:.08em">FPS</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#14352C;color:#F6F0EA">
  <p class="kicker" style="color:#EC6555">Settled</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:280px;color:#EC6555">115</p>
  <p style="position:absolute;left:72px;top:560px;font-weight:500;font-size:40px;letter-spacing:-.03em">pounds, cleared before lunch</p>
  <div class="foot"><span class="word"><img src="assets/sorrel-symbol-ink.svg" alt="">sorrel</span><span style="font:22px var(--mono);letter-spacing:.08em">GBP</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#F6F0EA;color:#14352C">
  <p class="kicker" style="color:#2A6355">One bill</p>
  <div style="position:absolute;left:72px;right:72px;top:240px;display:grid;grid-template-columns:1fr;gap:28px">
    <div><p class="big" style="font-size:80px">£115.00</p><p style="font:20px var(--mono);letter-spacing:.1em;margin-top:8px">IN</p></div>
    <div><p class="big" style="font-size:80px">£120.00</p><p style="font:20px var(--mono);letter-spacing:.1em;margin-top:8px">HELD</p></div>
    <div><p class="big" style="font-size:80px">£90.00</p><p style="font:20px var(--mono);letter-spacing:.1em;margin-top:8px">OUT</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/sorrel-symbol.svg" alt="">sorrel</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#EC6555;color:#14352C">
  <img src="assets/sorrel-symbol-reverse.svg" alt="" style="position:absolute;left:72px;top:280px;width:180px;height:180px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:120px">Before lunch.</p>
  <div class="foot"><span class="word"><img src="assets/sorrel-symbol-reverse.svg" alt="">sorrel</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
