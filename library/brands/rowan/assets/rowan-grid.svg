<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 140 140" width="100%" height="100%">
  <defs>
    <pattern id="subgrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#CBD5E1" stroke-width="0.3" stroke-dasharray="0.5,1" />
      <line x1="0" y1="0" x2="0" y2="4" stroke="#CBD5E1" stroke-width="0.3" stroke-dasharray="0.5,1" />
    </pattern>
    <pattern id="main5grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#94A3B8" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="-20" y="-20" width="140" height="140" fill="#F8FAFC" rx="4" />
  <rect x="0" y="0" width="100" height="100" fill="url(#subgrid)" />
  <rect x="0" y="0" width="100" height="100" fill="url(#main5grid)" />

  <!-- Construction Arcs & Tangents -->
  <!-- Upper inner arc circle: center (20, 50), r=30 -->
  <circle cx="20" cy="50" r="30" fill="none" stroke="#2563EB" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.75" />
  <circle cx="20" cy="50" r="1.5" fill="#2563EB" />
  <text x="23" y="48" font-family="'JetBrains Mono', monospace" font-size="3.2" font-weight="600" fill="#2563EB">C1 (1x, 2.5x)</text>

  <!-- Upper outer arc circle: center (20, 50), r=50 -->
  <circle cx="20" cy="50" r="50" fill="none" stroke="#2563EB" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.45" />

  <!-- Lower inner arc circle: center (80, 50), r=30 -->
  <circle cx="80" cy="50" r="30" fill="none" stroke="#7C3AED" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.75" />
  <circle cx="80" cy="50" r="1.5" fill="#7C3AED" />
  <text x="60" y="48" font-family="'JetBrains Mono', monospace" font-size="3.2" font-weight="600" fill="#7C3AED">C2 (4x, 2.5x)</text>

  <!-- Lower outer arc circle: center (80, 50), r=50 -->
  <circle cx="80" cy="50" r="50" fill="none" stroke="#7C3AED" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.45" />

  <!-- Horizontal symmetry seam -->
  <line x1="-10" y1="50" x2="110" y2="50" stroke="#DC2626" stroke-width="0.7" stroke-dasharray="3,1.5" />
  <text x="-16" y="51" font-family="'JetBrains Mono', monospace" font-size="2.8" font-weight="600" fill="#DC2626">Y=2.5x</text>

  <!-- The Mark Silhouette -->
  <g fill="#BC5339" opacity="0.9">
    <rect x="80" y="0" width="20" height="20" />
    <path d="M 0 0 L 0 100 L 20 100 L 20 20 A 30 30 0 0 1 50 50 L 30 50 A 50 50 0 0 0 80 100 L 100 100 L 100 50 L 80 50 L 80 80 A 30 30 0 0 1 50 50 L 70 50 A 50 50 0 0 0 20 0 Z" />
  </g>

  <!-- Dimension Annotations -->
  <line x1="0" y1="-5" x2="20" y2="-5" stroke="#0F172A" stroke-width="0.6" />
  <line x1="0" y1="-7" x2="0" y2="-3" stroke="#0F172A" stroke-width="0.6" />
  <line x1="20" y1="-7" x2="20" y2="-3" stroke="#0F172A" stroke-width="0.6" />
  <text x="7" y="-7.5" font-family="'JetBrains Mono', monospace" font-size="3" font-weight="600" fill="#0F172A">1.0x</text>

  <line x1="80" y1="-5" x2="100" y2="-5" stroke="#0F172A" stroke-width="0.6" />
  <line x1="80" y1="-7" x2="80" y2="-3" stroke="#0F172A" stroke-width="0.6" />
  <line x1="100" y1="-7" x2="100" y2="-3" stroke="#0F172A" stroke-width="0.6" />
  <text x="87" y="-7.5" font-family="'JetBrains Mono', monospace" font-size="3" font-weight="600" fill="#0F172A">1.0x</text>

  <!-- Arc radius indicators -->
  <line x1="20" y1="50" x2="41.2" y2="28.8" stroke="#2563EB" stroke-width="0.7" />
  <text x="28" y="36" font-family="'JetBrains Mono', monospace" font-size="3" font-weight="700" fill="#2563EB">R=1.5x</text>

  <line x1="80" y1="50" x2="44.6" y2="85.4" stroke="#7C3AED" stroke-width="0.7" />
  <text x="56" y="72" font-family="'JetBrains Mono', monospace" font-size="3" font-weight="700" fill="#7C3AED">R=2.5x</text>

  <!-- Grid Axis Labels -->
  <g font-family="'JetBrains Mono', monospace" font-size="2.7" fill="#64748B" text-anchor="middle">
    <text x="10" y="107">x1</text>
    <text x="30" y="107">x2</text>
    <text x="50" y="107">x3</text>
    <text x="70" y="107">x4</text>
    <text x="90" y="107">x5</text>
    <text x="105" y="13" text-anchor="start">y1</text>
    <text x="105" y="33" text-anchor="start">y2</text>
    <text x="105" y="53" text-anchor="start">y3</text>
    <text x="105" y="73" text-anchor="start">y4</text>
    <text x="105" y="93" text-anchor="start">y5</text>
  </g>
</svg>
