<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- T-shirt lighting gradient -->
    <linearGradient id="teeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4D46" />
      <stop offset="40%" stop-color="#2C3D37" />
      <stop offset="85%" stop-color="#24332D" />
      <stop offset="100%" stop-color="#1A2621" />
    </linearGradient>

    <linearGradient id="sleeveL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34463F" />
      <stop offset="100%" stop-color="#202C26" />
    </linearGradient>

    <linearGradient id="sleeveR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34463F" />
      <stop offset="100%" stop-color="#202C26" />
    </linearGradient>

    <!-- Fabric shadow -->
    <filter id="teeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>

    <!-- Silkscreen texture simulation -->
    <filter id="printTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.737  0 0 0 0 0.325  0 0 0 0 0.223  0 0 0 1 0" in="SourceGraphic" result="color" />
      <feComposite in="color" in2="noise" operator="in" />
    </filter>
  </defs>

  <!-- Stage Canvas -->
  <rect width="600" height="600" fill="url(#stageGlow)" />

  <!-- Background decorative studio backdrop lines -->
  <g opacity="0.3" stroke="#CBD5E1" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600" stroke-dasharray="4,6" />
    <line x1="520" y1="0" x2="520" y2="600" stroke-dasharray="4,6" />
    <line x1="0" y1="520" x2="600" y2="520" stroke-dasharray="4,6" />
  </g>

  <!-- Studio Callout Label -->
  <text x="50" y="55" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.15em">STUDIO MERCHANDISE // SPEC 01</text>
  <text x="50" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Heavyweight 280 GSM Cotton Crewneck</text>

  <!-- Group for Tee -->
  <g filter="url(#teeShadow)" transform="translate(100, 100) scale(0.667)">
    <!-- Base Tee Shape -->
    <!-- Left Sleeve -->
    <path d="M 170 120 L 30 200 L 70 290 L 160 220 Z" fill="url(#sleeveL)" />
    <!-- Right Sleeve -->
    <path d="M 430 120 L 570 200 L 530 290 L 440 220 Z" fill="url(#sleeveR)" />
    <!-- Main Torso -->
    <path d="M 170 120 
             Q 230 145 300 145 
             Q 370 145 430 120 
             L 450 200 
             L 440 220 
             L 455 580 
             Q 300 600 145 580 
             L 160 220 
             L 150 200 Z" fill="url(#teeBodyGrad)" />
    
    <!-- Ribbed Collar -->
    <path d="M 230 120 Q 300 160 370 120 Q 300 135 230 120 Z" fill="#202D28" stroke="#1A2621" stroke-width="2" />
    <path d="M 245 120 Q 300 152 355 120" fill="none" stroke="#3A4D46" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Sleeve seams -->
    <path d="M 170 120 Q 155 170 160 220" fill="none" stroke="#202C26" stroke-width="2" />
    <path d="M 430 120 Q 445 170 440 220" fill="none" stroke="#202C26" stroke-width="2" />

    <!-- Fabric Fold Shading -->
    <path d="M 180 240 Q 230 350 210 460 Q 190 350 180 240" fill="#000000" opacity="0.12" />
    <path d="M 420 240 Q 370 350 390 460 Q 410 350 420 240" fill="#000000" opacity="0.12" />

    <!-- Hem stitching -->
    <path d="M 148 568 Q 300 588 452 568" fill="none" stroke="#3A4D46" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Silkscreen Printed Rowan Ri Mark (Chest) -->
    <g transform="translate(225, 230) scale(1.5)" fill="#BC5339">
      <rect x="80" y="0" width="20" height="20" />
      <path d="M 0 0 L 0 100 L 20 100 L 20 20 A 30 30 0 0 1 50 50 L 30 50 A 50 50 0 0 0 80 100 L 100 100 L 100 50 L 80 50 L 80 80 A 30 30 0 0 1 50 50 L 70 50 A 50 50 0 0 0 20 0 Z" />
    </g>

    <!-- Woven hem tag -->
    <rect x="155" y="555" width="25" height="15" fill="#F4EFEE" rx="1" />
    <text x="158" y="566" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="700" fill="#2C3D37">Ri</text>
  </g>

  <!-- Color Chip Metadata -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="16" height="16" fill="#2C3D37" rx="3" />
    <text x="24" y="12" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">GARMENT // SCARAB #2C3D37</text>
    <rect x="230" y="0" width="16" height="16" fill="#BC5339" rx="3" />
    <text x="254" y="12" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">PRINT // VERMILLION #BC5339</text>
  </g>
</svg>
