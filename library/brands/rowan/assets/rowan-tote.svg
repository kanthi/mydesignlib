<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="toteStageGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- Canvas fabric body gradient -->
    <linearGradient id="toteBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34463F" />
      <stop offset="35%" stop-color="#2C3D37" />
      <stop offset="85%" stop-color="#22302A" />
      <stop offset="100%" stop-color="#1B2621" />
    </linearGradient>

    <!-- Strap gradient -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24332D" />
      <stop offset="50%" stop-color="#33443E" />
      <stop offset="100%" stop-color="#22302A" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="toteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Stage Canvas -->
  <rect width="600" height="600" fill="url(#toteStageGlow)" />

  <!-- Background decorative lines -->
  <g opacity="0.3" stroke="#CBD5E1" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600" stroke-dasharray="4,6" />
    <line x1="520" y1="0" x2="520" y2="600" stroke-dasharray="4,6" />
    <line x1="0" y1="520" x2="600" y2="520" stroke-dasharray="4,6" />
  </g>

  <!-- Studio Callout Label -->
  <text x="50" y="55" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.15em">STUDIO MERCHANDISE // SPEC 02</text>
  <text x="50" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#0F172A">Heavyweight 16oz Duck Canvas Tote</text>

  <!-- Tote Bag Structure -->
  <g filter="url(#toteShadow)" transform="translate(130, 80)">
    <!-- Straps (Looping Upwards) -->
    <!-- Left Strap -->
    <path d="M 75 160 C 65 20, 115 10, 115 10 C 120 10, 95 20, 105 160 Z" fill="url(#strapGrad)" stroke="#1B2621" stroke-width="1" />
    <path d="M 85 160 C 78 30, 108 20, 108 20" fill="none" stroke="#43584F" stroke-width="1" stroke-dasharray="3,2" />

    <!-- Right Strap -->
    <path d="M 235 160 C 225 20, 275 10, 275 10 C 280 10, 255 20, 265 160 Z" fill="url(#strapGrad)" stroke="#1B2621" stroke-width="1" />
    <path d="M 245 160 C 238 30, 268 20, 268 20" fill="none" stroke="#43584F" stroke-width="1" stroke-dasharray="3,2" />

    <!-- Main Tote Body -->
    <rect x="25" y="150" width="290" height="340" rx="6" fill="url(#toteBodyGrad)" />

    <!-- Fabric natural subtle folds -->
    <path d="M 35 170 Q 70 300 45 470" fill="none" stroke="#1A2420" stroke-width="8" opacity="0.25" />
    <path d="M 295 180 Q 275 320 295 460" fill="none" stroke="#1A2420" stroke-width="8" opacity="0.25" />

    <!-- Top hem band -->
    <rect x="25" y="150" width="290" height="28" fill="#24332D" />
    <line x1="25" y1="178" x2="315" y2="178" stroke="#1B2621" stroke-width="2" />
    <line x1="25" y1="154" x2="315" y2="154" stroke="#3D5048" stroke-width="1" stroke-dasharray="4,2" />
    <line x1="25" y1="174" x2="315" y2="174" stroke="#3D5048" stroke-width="1" stroke-dasharray="4,2" />

    <!-- Cross box stitch on strap attachments -->
    <g transform="translate(73, 153)" stroke="#3D5048" stroke-width="1">
      <rect width="32" height="22" fill="none" />
      <line x1="0" y1="0" x2="32" y2="22" />
      <line x1="0" y1="22" x2="32" y2="0" />
    </g>
    <g transform="translate(233, 153)" stroke="#3D5048" stroke-width="1">
      <rect width="32" height="22" fill="none" />
      <line x1="0" y1="0" x2="32" y2="22" />
      <line x1="0" y1="22" x2="32" y2="0" />
    </g>

    <!-- Bottom gusset fold line -->
    <line x1="30" y1="480" x2="310" y2="480" stroke="#1B2621" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- Oversized Rowan Ri Mark (Centered Silkscreen) -->
    <g transform="translate(90, 220) scale(1.6)" fill="#BC5339">
      <rect x="80" y="0" width="20" height="20" />
      <path d="M 0 0 L 0 100 L 20 100 L 20 20 A 30 30 0 0 1 50 50 L 30 50 A 50 50 0 0 0 80 100 L 100 100 L 100 50 L 80 50 L 80 80 A 30 30 0 0 1 50 50 L 70 50 A 50 50 0 0 0 20 0 Z" />
    </g>
  </g>

  <!-- Color Chip Metadata -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="16" height="16" fill="#2C3D37" rx="3" />
    <text x="24" y="12" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">CANVAS // SCARAB #2C3D37</text>
    <rect x="230" y="0" width="16" height="16" fill="#BC5339" rx="3" />
    <text x="254" y="12" font-family="'JetBrains Mono', monospace" font-size="11" fill="#475569">PRINT // VERMILLION #BC5339</text>
  </g>
</svg>
