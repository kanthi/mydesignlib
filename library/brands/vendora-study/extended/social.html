<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendora — Social kit</title>
<link rel="icon" href="assets/vendora-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#F6F6F8;color:#0D1F12;padding:40px 24px 72px}
h1{font-family:var(--display);font-weight:500;font-size:40px;letter-spacing:-.03em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);color:#2C3A31;max-width:1400px;margin:0 auto 28px}
.sub a{color:#5B21B6}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(52,30,110,.18)}
body.export{padding:0;background:#5B21B6}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--display);font-weight:500;letter-spacing:-.03em;line-height:.92}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:14px;font-family:var(--word);font-weight:500;font-size:42px;letter-spacing:-.01em}
.word img{width:48px;height:48px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Vendora study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#0D1F12">
  <p class="kicker" style="color:#5B21B6">Pipeline</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:260px;font-size:88px">Grow your business.</p>
  <div class="foot"><span class="word"><img src="assets/vendora-symbol.svg" alt="">Vendora</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600;color:#5B21B6">DESK</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#5B21B6;color:#FFFFFF">
  <p class="kicker" style="color:#E5D4FF">Open</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:280px">One</p>
  <p style="position:absolute;left:72px;top:560px;font-family:var(--display);font-weight:500;font-size:56px;letter-spacing:-.03em;color:#E5D4FF">place.</p>
  <div class="foot"><span class="word"><img src="assets/vendora-symbol.svg" alt="">Vendora</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">$79</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFFFF;color:#0D1F12">
  <p class="kicker" style="position:static;color:#5B21B6;margin:72px 0 0 72px">Pricing</p>
  <div style="position:absolute;left:72px;right:72px;top:220px;display:grid;gap:28px">
    <div><p class="kicker" style="position:static;color:#5B21B6">Starter</p><p class="big" style="font-size:72px">$29</p></div>
    <div><p class="kicker" style="position:static;color:#5B21B6">Growth</p><p class="big" style="font-size:72px;color:#7C3AED">$79</p></div>
    <div><p class="kicker" style="position:static;color:#5B21B6">Enterprise</p><p class="big" style="font-size:72px">Custom</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/vendora-symbol.svg" alt="">Vendora</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#E5D4FF;color:#0D1F12">
  <img src="assets/vendora-symbol-ink.svg" alt="" style="position:absolute;left:72px;top:280px;width:180px;height:180px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:120px">One place.</p>
  <div class="foot"><span class="word"><img src="assets/vendora-symbol-ink.svg" alt="">Vendora</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
