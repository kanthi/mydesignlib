<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" fill="none">
  <!-- Foliocraft Connected Molecule/Node Mark -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF5B1B" />
        <stop offset="100%" stop-color="#FF7A33" />
      </linearGradient>
    </defs>
    <!-- Connectors -->
    <line x1="8" y1="16" x2="18" y2="8" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="8" y1="16" x2="18" y2="24" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="18" y1="8" x2="28" y2="16" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="18" y1="24" x2="28" y2="16" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="18" y1="8" x2="28" y2="8" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />
    <line x1="18" y1="24" x2="28" y2="24" stroke="url(#logoGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Nodes -->
    <circle cx="8" cy="16" r="4.5" fill="url(#logoGrad)" />
    <circle cx="18" cy="8" r="4.5" fill="url(#logoGrad)" />
    <circle cx="18" cy="24" r="4.5" fill="url(#logoGrad)" />
    <circle cx="28" cy="8" r="4.5" fill="url(#logoGrad)" />
    <circle cx="28" cy="16" r="4.5" fill="url(#logoGrad)" />
    <circle cx="28" cy="24" r="4.5" fill="url(#logoGrad)" />
  </g>
  <!-- Brand Wordmark -->
  <text x="44" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FF5B1B" letter-spacing="-0.5">Folio<tspan fill="#111417" font-weight="700">Craft</tspan></text>
</svg>
