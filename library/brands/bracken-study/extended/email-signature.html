<title>Bracken — Email signature</title>
<link rel="icon" href="assets/bracken-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#F4F6F3;padding:48px 24px}
.sheet{max-width:640px;margin:18px auto 0;background:#fff;border:1px solid rgba(27,33,64,.1);border-radius:16px;padding:28px}
p.note{font:13px/1.5 var(--sans);color:var(--muted);margin-top:18px}

</style></head>
<body>
<p class="back"><a href="merch.html">← Merch</a></p>
<div class="sheet">
  <table cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td style="padding-right:16px;vertical-align:middle"><img src="assets/bracken-symbol.svg" alt="" width="32" height="32"></td>
      <td style="font-family:Outfit,sans-serif;font-weight:700;font-size:16px;letter-spacing:.16em;color:#1B2140">SEARCH DESK<br><span style="font-weight:600;font-size:13px;letter-spacing:.1em">BRACKEN</span></td>
    </tr>
    <tr><td colspan="2" style="padding-top:10px;font:14px Outfit,sans-serif;color:#1B2140">
      <a href="mailto:desk@bracken.example" style="color:#1B2140;text-decoration:none">desk@bracken.example</a><br>bracken.example
    </td></tr>
  </table>
  <p class="note">The note opens in your mail client. This page does not store a message. Swap the local SVG for a hosted PNG when the signature leaves the study.</p>
</div>
