<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alveor — Social kit</title>
<link rel="icon" href="assets/alveor-app-icon.svg"><link rel="stylesheet" href="shared.css">
<style>
body{background:#FAFAFA;padding:40px 24px 72px}
h1{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);max-width:1400px;margin:0 auto 28px}
.sub a{color:#9A3412}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.16)}
body.export{padding:0;background:#111827}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:.9}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.wrd{font-family:var(--sans);font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:14px;font-size:32px}
.wrd img{width:48px;height:48px}
.plans{position:absolute;left:72px;right:72px;bottom:220px;display:flex;gap:28px}
.plans b{display:block;font-family:var(--display);font-size:42px}
</style></head><body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Alveor study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#111827">
  <p class="kicker" style="color:#9A3412">Desk</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:280px;font-size:84px">Second</p>
  <div class="foot"><span class="wrd"><img src="assets/alveor-symbol-ink.svg" alt=""><span style="color:#111827">Alveor</span></span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#EE7A47;color:#111827">
  <p class="kicker" style="color:#111827">Open</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:160px">Second</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:460px;font-size:72px;color:#111827">brain.</p>
  <div class="foot"><span class="wrd"><img src="assets/alveor-symbol-reverse.svg" alt=""><span style="color:#111827">Alveor</span></span><span style="font:28px var(--sans);color:#111827">$42</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FAFAFA;color:#111827">
  <p class="kicker" style="color:#9A3412">Plans</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:72px">Three ways.</p>
  <div class="plans"><div><b>$0</b><span style="font:18px var(--sans);color:#9A3412">Free</span></div><div><b>$42</b><span style="font:18px var(--sans);color:#9A3412">Pro</span></div><div><b>$120</b><span style="font:18px var(--sans);color:#9A3412">Enterprise</span></div></div>
  <div class="foot"><span class="wrd"><img src="assets/alveor-symbol.svg" alt=""><span>Alveor</span></span></div>
</section></div>
<div class="frame"><section class="ab st" id="story" style="background:#111827;color:#FFFFFF">
  <p class="kicker">Live</p>
  <img src="assets/alveor-symbol-reverse.svg" alt="" style="position:absolute;left:72px;top:280px;width:160px;height:160px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:110px">One desk.</p>
  <div class="foot"><span class="wrd"><img src="assets/alveor-symbol-reverse.svg" alt=""><span>Alveor</span></span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
