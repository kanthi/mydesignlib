<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercata — Social kit</title>
<link rel="icon" href="assets/mercata-app-icon.svg"><link rel="stylesheet" href="shared.css">
<style>
body{background:#F9FAFB;padding:40px 24px 72px}
h1{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);max-width:1400px;margin:0 auto 28px}
.sub a{color:#9A3412}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.16)}
body.export{padding:0;background:#0E0D0C}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.04em;line-height:.9}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.wrd{display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em}
.wrd img{width:48px;height:48px}
</style></head><body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Mercata study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#111417">
  <p class="kicker" style="color:#9A3412">Desk</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:280px;font-size:84px">AI</p>
  <div class="foot"><span class="wrd"><img src="assets/mercata-symbol.svg" alt="">mercata</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#0E0D0C;color:#FFFFFF">
  <p class="kicker" style="color:#FF5024">Open</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:240px">AI</p>
  <p style="position:absolute;left:72px;top:520px;font-family:var(--display);font-weight:700;font-size:56px;letter-spacing:-.03em;color:#FF5024">platform.</p>
  <div class="foot"><span class="wrd"><img src="assets/mercata-symbol.svg" alt="">mercata</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">FREE</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFFFF;color:#111417">
  <div style="position:absolute;left:72px;right:72px;top:180px;display:grid;gap:28px">
    <div><p class="kicker" style="position:static;color:#9A3412">Try</p><p class="big" style="font-size:72px">Free</p></div>
    <div><p class="kicker" style="position:static;color:#9A3412">Demo</p><p class="big" style="font-size:72px">Live</p></div>
    <div><p class="kicker" style="position:static;color:#9A3412">Desk</p><p class="big" style="font-size:72px">Demo</p></div>
  </div>
  <div class="foot"><span class="wrd"><img src="assets/mercata-symbol.svg" alt="">mercata</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#FF5024;color:#FFFFFF">
  <img src="assets/mercata-symbol-reverse.svg" alt="" style="position:absolute;left:72px;top:280px;width:180px;height:180px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:110px">One platform.</p>
  <div class="foot"><span class="wrd"><img src="assets/mercata-symbol-reverse.svg" alt="">mercata</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
