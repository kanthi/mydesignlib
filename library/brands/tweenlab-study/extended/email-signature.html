<title>Tweenlab — Email signature</title>
<link rel="icon" href="assets/tweenlab-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:var(--paper);padding:48px 24px}
.sheet{max-width:640px;margin:18px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}
p.note{font:12px/1.5 var(--mono);color:#77776F;margin-top:18px}
a.back{font:12px var(--mono)}
</style></head>
<body>
<p class="back"><a href="merch.html">← Merch</a></p>
<div class="sheet">
  <table cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td style="padding-right:16px;vertical-align:middle"><img src="assets/tweenlab-symbol.svg" alt="" width="48" height="48"></td>
      <td style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;color:#25251F;letter-spacing:-.04em">Motion desk<br><span style="font-family:'DM Sans',sans-serif;font-weight:400;font-size:13px;letter-spacing:0">tweenlab<span style="color:#FF795C">.</span></span></td>
    </tr>
    <tr><td colspan="2" style="padding-top:10px;font:13px 'DM Sans',sans-serif;color:#25251F">
      <a href="mailto:hello@tweenlab.example" style="color:#25251F;text-decoration:none">hello@tweenlab.example</a><br>tweenlab.example
    </td></tr>
  </table>
  <p class="note">The note opens in your mail client. This page does not store a message. Swap the local SVG for a hosted PNG when the signature leaves the study.</p>
</div>
