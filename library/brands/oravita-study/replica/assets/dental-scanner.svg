<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <linearGradient id="scannerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="420" rx="20" fill="#F8FAFC"/>
  <rect x="20" y="20" width="560" height="380" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Screen Header -->
  <rect x="20" y="20" width="560" height="50" rx="16" fill="#F1F5F9"/>
  <circle cx="50" cy="45" r="5" fill="#EF4444"/>
  <circle cx="68" cy="45" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="45" r="5" fill="#10B981"/>
  <text x="120" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#64748B">3D Intraoral Arch Scan — Real-time Mesh Telemetry</text>
  <rect x="460" y="35" width="100" height="20" rx="10" fill="#E0F2FE"/>
  <text x="510" y="49" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#0284C7" text-anchor="middle">PRECISION 0.02MM</text>

  <!-- 3D Dental Arch Diagram -->
  <g transform="translate(140, 110)">
    <!-- Arch Curve Line -->
    <path d="M 40 180 C 40 60, 280 60, 280 180" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Laser Scan Wave -->
    <path d="M 30 140 Q 160 80 290 140" fill="none" stroke="url(#laserBeam)" stroke-width="4"/>
    <polygon points="30,140 290,140 250,220 70,220" fill="url(#scannerGlow)"/>

    <!-- Teeth Elements (Upper Arch) -->
    <!-- Molars -->
    <rect x="30" y="150" width="22" height="26" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="36" y="115" width="22" height="26" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <!-- Premolars -->
    <rect x="52" y="80" width="20" height="24" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="80" y="55" width="18" height="24" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <!-- Canine & Incisors -->
    <rect x="110" y="40" width="18" height="24" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="135" y="35" width="22" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="163" y="35" width="22" height="26" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.5"/>
    <rect x="192" y="40" width="18" height="24" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <!-- Right side -->
    <rect x="222" y="55" width="18" height="24" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="248" y="80" width="20" height="24" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="262" y="115" width="22" height="26" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
    <rect x="268" y="150" width="22" height="26" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>

    <!-- Alignment Target Pins -->
    <circle cx="160" cy="48" r="4" fill="#0284C7"/>
    <circle cx="160" cy="48" r="10" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="160" y1="32" x2="160" y2="64" stroke="#0284C7" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Sensor Reading Tag -->
    <rect x="80" y="195" width="160" height="34" rx="8" fill="#0F172A"/>
    <text x="160" y="217" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" font-weight="600" text-anchor="middle">OCCLUSION: 100% BALANCED</text>
  </g>

  <!-- Side Telemetry Metrics -->
  <g transform="translate(45, 100)">
    <rect width="70" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">ENAMEL</text>
    <text x="35" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#0284C7" text-anchor="middle">98.5%</text>

    <rect y="65" width="70" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="89" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">GUM INDEX</text>
    <text x="35" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10B981" text-anchor="middle">0.4 LOW</text>

    <rect y="130" width="70" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">MICRO-BITE</text>
    <text x="35" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#0F172A" text-anchor="middle">CLASS I</text>
  </g>

  <g transform="translate(485, 100)">
    <rect width="70" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">CARIES</text>
    <text x="35" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#10B981" text-anchor="middle">0 DETECT</text>

    <rect y="65" width="70" height="50" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="35" y="89" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">SHADE</text>
    <text x="35" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#F59E0B" text-anchor="middle">VITA B1</text>
  </g>
</svg>
