<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Minimalist Modern Dental Operatory Suite -->
  <rect width="600" height="400" rx="16" fill="#F0F9FF"/>
  <!-- Room Floor & Perspective Lines -->
  <polygon points="0,260 600,260 600,400 0,400" fill="#E0F2FE"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#BAE6FD" stroke-width="2"/>
  <line x1="120" y1="260" x2="0" y2="400" stroke="#BAE6FD" stroke-width="1.5"/>
  <line x1="480" y1="260" x2="600" y2="400" stroke="#BAE6FD" stroke-width="1.5"/>

  <!-- Panoramic Window to Garden -->
  <rect x="50" y="40" width="220" height="180" rx="8" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="2"/>
  <path d="M 50 160 Q 120 120 180 150 T 270 140 L 270 220 L 50 220 Z" fill="#BAE6FD" fill-opacity="0.5"/>
  <circle cx="100" cy="90" r="18" fill="#FEF08A" fill-opacity="0.7"/>

  <!-- Ergonomic Dental Operatory Chair -->
  <g transform="translate(240, 160)">
    <!-- Base -->
    <ellipse cx="140" cy="180" rx="55" ry="16" fill="#94A3B8"/>
    <rect x="132" y="120" width="16" height="60" rx="4" fill="#64748B"/>
    <!-- Seat & Backrest -->
    <path d="M 50 120 C 70 120 110 130 160 130 C 200 130 230 110 240 100 L 235 85 C 220 95 190 110 160 110 C 110 110 80 100 50 100 Z" fill="#0284C7"/>
    <!-- Headrest -->
    <ellipse cx="40" cy="100" rx="18" ry="12" fill="#0369A1"/>
    <!-- Shadow -->
    <ellipse cx="140" cy="195" rx="80" ry="12" fill="#000000" fill-opacity="0.08"/>
  </g>

  <!-- Surgical LED Light Arm -->
  <path d="M 380 40 L 400 110 L 350 160" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="340" cy="165" rx="30" ry="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <ellipse cx="340" cy="165" rx="14" ry="7" fill="#38BDF8"/>

  <!-- Badge Overlay -->
  <rect x="360" y="310" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="390" cy="342" r="14" fill="#0284C7" fill-opacity="0.1"/>
  <path d="M 385 342 L 388 345 L 396 338" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="415" y="337" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">HEPA Suite 04</text>
  <text x="415" y="352" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">CLASS 100 STERILIZATION</text>
</svg>
