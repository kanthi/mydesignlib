<title>Cairn — Email signature</title>
<link rel="icon" href="assets/cairn-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#F4F1EC;padding:48px 24px}
.sheet{max-width:640px;margin:18px auto 0;background:#fff;border:1px solid rgba(16,14,12,.1);border-radius:16px;padding:28px}
p.note{font:13px/1.5 var(--pix);color:#5C564E;margin-top:18px}
a.back{font:12px var(--sans);color:#9A3412}
</style></head>
<body>
<p class="back"><a href="merch.html">← Merch</a></p>
<div class="sheet">
  <table cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td style="padding-right:16px;vertical-align:middle"><img src="assets/cairn-symbol.svg" alt="" width="36" height="36"></td>
      <td style="font-family:Outfit,sans-serif;font-weight:600;font-size:18px;letter-spacing:.12em;color:#100E0C">DECISION DESK<br><span style="font-weight:500;font-size:13px;letter-spacing:.08em">CAIRN</span></td>
    </tr>
    <tr><td colspan="2" style="padding-top:10px;font:14px 'Pixelify Sans',sans-serif;color:#100E0C">
      <a href="mailto:desk@cairn.example" style="color:#100E0C;text-decoration:none">desk@cairn.example</a><br>cairn.example
    </td></tr>
  </table>
  <p class="note">The note opens in your mail client. This page does not store a message. Swap the local SVG for a hosted PNG when the signature leaves the study.</p>
</div>
