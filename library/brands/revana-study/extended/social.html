<title>Revana — Social kit</title>
<link rel="icon" href="assets/revana-app-icon.svg"><link rel="stylesheet" href="shared.css">
<style>
body{background:#F9FAFB;padding:40px 24px 72px;color:#111827}
h1{font-family:var(--display);font-style:var(--disp-style);font-weight:var(--disp-weight);font-size:40px;letter-spacing:var(--disp-track);margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);max-width:1400px;margin:0 auto 28px;color:#4B5563}
.sub a{color:#341266}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.16)}
body.export{padding:0;background:#240C48}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--display);font-style:var(--disp-style);font-weight:var(--disp-weight);letter-spacing:var(--disp-track);line-height:.9}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.wrd{font-family:var(--sans);font-weight:800;letter-spacing:-.02em;text-transform:none;display:flex;align-items:center;gap:14px;font-size:32px}
.wrd img{width:48px;height:48px;object-fit:contain}
.plans{position:absolute;left:72px;right:72px;bottom:220px;display:flex;gap:28px}
.plans b{display:block;font-family:var(--display);font-style:var(--disp-style);font-size:42px}
</style></head><body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Revana study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#111827">
  <p class="kicker" style="color:#341266">Desk</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:84px;color:#111827">Smarter</p>
  
  <div class="foot"><span class="wrd"><img src="assets/revana-symbol.svg" alt=""><span style="color:#111827">Revana</span></span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#341266;color:#FFFFFF">
  <p class="kicker" style="color:#FFFFFF">Open</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:140px;color:#FFFFFF">Smarter</p><p class="big" style="position:absolute;left:72px;right:72px;top:460px;font-size:72px;color:#FFFFFF">business.</p>
  
  <div class="foot"><span class="wrd"><img src="assets/revana-symbol-reverse.svg" alt=""><span style="color:#FFFFFF">Revana</span></span><span style="font:28px var(--sans);color:#FFFFFF">Open</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#F9FAFB;color:#111827">
  <p class="kicker" style="color:#341266">Plans</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:72px;color:#111827">Three ways.</p>
  <div class="plans"><div><b>$0</b><span style="font:18px var(--sans);color:#341266">Starter</span></div><div><b>$9</b><span style="font:18px var(--sans);color:#341266">Business</span></div><div><b>$15</b><span style="font:18px var(--sans);color:#341266">Enterprise</span></div></div>
  <div class="foot"><span class="wrd"><img src="assets/revana-symbol.svg" alt=""><span style="color:#111827">Revana</span></span></div>
</section></div>
<div class="frame"><section class="ab st" id="story" style="background:#240C48;color:#FFFFFF">
  <p class="kicker" style="color:#FFFFFF">Live</p>
  <img src="assets/revana-symbol-reverse.svg" alt="" style="position:absolute;left:72px;top:280px;width:140px;height:140px;object-fit:contain"><p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:110px;color:#FFFFFF">One desk.</p>
  
  <div class="foot"><span class="wrd"><img src="assets/revana-symbol-reverse.svg" alt=""><span style="color:#FFFFFF">Revana</span></span></div>
</section></div>

</div>

<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
