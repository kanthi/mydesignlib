<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Diagonal kinetic telemetry ray matrix (-35 deg slope) -->
  <g transform="rotate(-35 250 250)">
    <!-- Layer 1: Coral rays -->
    <rect x="80" y="80" width="110" height="14" rx="7" fill="#FF5538"/>
    <rect x="230" y="80" width="80" height="14" rx="7" fill="#FF5538"/>
    <rect x="140" y="130" width="130" height="14" rx="7" fill="#FF5538"/>
    <rect x="30" y="180" width="90" height="14" rx="7" fill="#FF5538"/>
    <rect x="280" y="230" width="120" height="14" rx="7" fill="#FF5538"/>
    
    <!-- Layer 2: Jade Teal rays -->
    <rect x="210" y="130" width="140" height="14" rx="7" fill="#149377"/>
    <rect x="60" y="230" width="160" height="14" rx="7" fill="#149377"/>
    <rect x="180" y="280" width="110" height="14" rx="7" fill="#149377"/>
    <rect x="20" y="330" width="130" height="14" rx="7" fill="#149377"/>
    <rect x="250" y="380" width="150" height="14" rx="7" fill="#149377"/>

    <!-- Layer 3: Solar Gold / Lime Citron rays -->
    <rect x="300" y="180" width="120" height="14" rx="7" fill="#F5A81C"/>
    <rect x="100" y="280" width="60" height="14" rx="7" fill="#E2F738"/>
    <rect x="170" y="330" width="90" height="14" rx="7" fill="#F5A81C"/>
    <rect x="280" y="330" width="140" height="14" rx="7" fill="#E2F738"/>
    <rect x="80" y="380" width="110" height="14" rx="7" fill="#F5A81C"/>
    <rect x="130" y="430" width="140" height="14" rx="7" fill="#FF5538"/>
  </g>
</svg>
