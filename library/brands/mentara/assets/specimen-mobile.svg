<svg width="340" height="480" viewBox="0 0 340 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect width="340" height="480" rx="36" fill="#111311" stroke="#2D382A" stroke-width="2" />
  
  <!-- Screen Notch -->
  <rect x="120" y="14" width="100" height="20" rx="10" fill="#1B221A" />
  <circle cx="205" cy="24" r="3.5" fill="#2E3B2D" />

  <!-- App Header -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="32" height="32" rx="10" fill="#1B221A" stroke="#2D382A" stroke-width="1" />
    <!-- Mini Mark -->
    <g transform="translate(-1, 0) scale(0.34)">
      <rect x="23" y="38" width="34" height="24" rx="12" transform="rotate(-45 40 50)" stroke="#D4FF00" stroke-width="6.5" stroke-linecap="round" />
      <rect x="43" y="38" width="34" height="24" rx="12" transform="rotate(-45 60 50)" stroke="#D4FF00" stroke-width="6.5" stroke-linecap="round" />
    </g>
    <text x="42" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Mentara</text>
    <text x="42" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#7C8D76">DAY 42 OF 365</text>
    <circle cx="282" cy="16" r="14" fill="#D4FF00" />
    <text x="282" y="20" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold" fill="#111311" text-anchor="middle">⚡</text>
  </g>

  <!-- Today's Daily Dose Card -->
  <g transform="translate(24, 110)">
    <!-- Card Base with Electric Border -->
    <rect width="292" height="200" rx="20" fill="#181D17" stroke="#D4FF00" stroke-width="1.5" />
    
    <!-- Tag -->
    <rect x="18" y="18" width="88" height="22" rx="11" fill="#D4FF00" />
    <text x="62" y="33" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" fill="#111311" text-anchor="middle">5-MIN DOSE</text>

    <!-- Card Title -->
    <text x="18" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">First Principles Thinking</text>
    <text x="18" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#A8B4A4">Mental Model: Deconstruct complex problems into core truths.</text>

    <!-- Progress Track -->
    <rect x="18" y="130" width="256" height="6" rx="3" fill="#263124" />
    <rect x="18" y="130" width="180" height="6" rx="3" fill="#D4FF00" />
    <text x="18" y="152" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#7C8D76">72% Completed</text>

    <!-- Action Button -->
    <rect x="18" y="160" width="256" height="30" rx="15" fill="#D4FF00" />
    <text x="146" y="179" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#111311" text-anchor="middle">Resume Lesson →</text>
  </g>

  <!-- Streak / Stats Row -->
  <g transform="translate(24, 330)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="140" height="65" rx="16" fill="#181D17" stroke="#2D382A" stroke-width="1" />
    <text x="16" y="24" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#7C8D76">FOCUS STREAK</text>
    <text x="16" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#D4FF00">18 Days</text>

    <!-- Stat 2 -->
    <rect x="152" y="0" width="140" height="65" rx="16" fill="#181D17" stroke="#2D382A" stroke-width="1" />
    <text x="168" y="24" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" fill="#7C8D76">KNOWLEDGE DOSES</text>
    <text x="168" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">142 Total</text>
  </g>

  <!-- Bottom Nav Pill -->
  <rect x="100" y="462" width="140" height="4" rx="2" fill="#7C8D76" opacity="0.6" />
</svg>