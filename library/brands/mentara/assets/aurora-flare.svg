<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base Dark Background -->
    <radialGradient id="aurora-core" cx="85%" cy="65%" r="65%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#A4C400" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#414D3C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#111311" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="flare-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111311" />
      <stop offset="45%" stop-color="#1E231D" />
      <stop offset="75%" stop-color="#55694C" />
      <stop offset="100%" stop-color="#D4FF00" />
    </linearGradient>
    <filter id="aurora-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="800" height="450" fill="#111311" />

  <!-- Diagonal Atmospheric Smoke Tendrils -->
  <g filter="url(#aurora-blur)">
    <!-- Primary Flare Beam -->
    <path d="M 420 -50 Q 560 200 780 280 L 850 480 L 600 500 Q 480 320 350 120 Z" fill="#D4FF00" opacity="0.85" />
    <!-- Secondary Muted Moss Drift -->
    <path d="M 280 40 Q 460 220 620 480 L 450 500 Q 320 280 200 120 Z" fill="#7C8D76" opacity="0.6" />
    <!-- High Core Glow Center -->
    <ellipse cx="680" cy="300" rx="180" ry="220" fill="url(#aurora-core)" />
  </g>
</svg>