<svg width="480" height="260" viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Blueprint Background -->
  <rect width="480" height="260" rx="16" fill="#111311" />

  <!-- Grid lines (X spacing: 20px) -->
  <g stroke="#262E25" stroke-width="1" opacity="0.6">
    <!-- Verticals -->
    <line x1="40" y1="20" x2="40" y2="240" />
    <line x1="80" y1="20" x2="80" y2="240" />
    <line x1="120" y1="20" x2="120" y2="240" />
    <line x1="160" y1="20" x2="160" y2="240" />
    <line x1="200" y1="20" x2="200" y2="240" />
    <line x1="240" y1="20" x2="240" y2="240" />
    <line x1="280" y1="20" x2="280" y2="240" />
    <line x1="320" y1="20" x2="320" y2="240" />
    <line x1="360" y1="20" x2="360" y2="240" />
    <line x1="400" y1="20" x2="400" y2="240" />
    <line x1="440" y1="20" x2="440" y2="240" />
    <!-- Horizontals -->
    <line x1="20" y1="40" x2="460" y2="40" />
    <line x1="20" y1="80" x2="460" y2="80" />
    <line x1="20" y1="130" x2="460" y2="130" />
    <line x1="20" y1="180" x2="460" y2="180" />
    <line x1="20" y1="220" x2="460" y2="220" />
  </g>

  <!-- Exclusion Boundary Box (Dashed Yellow) -->
  <rect x="80" y="65" width="320" height="130" fill="none" stroke="#D4FF00" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />

  <!-- Dimension indicators: 1X clearance -->
  <!-- Top dimension -->
  <line x1="80" y1="48" x2="400" y2="48" stroke="#7C8D76" stroke-width="1" />
  <line x1="80" y1="44" x2="80" y2="52" stroke="#7C8D76" stroke-width="1" />
  <line x1="400" y1="44" x2="400" y2="52" stroke="#7C8D76" stroke-width="1" />
  <text x="240" y="44" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#D4FF00" text-anchor="middle">PRIMARY LOCKUP BOUNDARY</text>

  <!-- 1X Markers -->
  <rect x="84" y="69" width="22" height="22" rx="4" fill="#D4FF00" fill-opacity="0.15" stroke="#D4FF00" stroke-width="1" />
  <text x="95" y="84" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#D4FF00" text-anchor="middle">1X</text>

  <rect x="374" y="169" width="22" height="22" rx="4" fill="#D4FF00" fill-opacity="0.15" stroke="#D4FF00" stroke-width="1" />
  <text x="385" y="184" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#D4FF00" text-anchor="middle">1X</text>

  <!-- Center Logo Lockup -->
  <g transform="translate(100, 90)">
    <!-- Mark -->
    <g transform="translate(15, -10)">
      <rect x="23" y="38" width="34" height="24" rx="12" transform="rotate(-45 40 50)" stroke="#D4FF00" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="43" y="38" width="34" height="24" rx="12" transform="rotate(-45 60 50)" stroke="#D4FF00" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 44.5 32.5 L 55.5 43.5" stroke="#111311" stroke-width="8.5" stroke-linecap="round" />
      <path d="M 44.5 32.5 L 55.5 43.5" stroke="#D4FF00" stroke-width="6.5" stroke-linecap="round" />
    </g>
    <!-- Wordmark -->
    <text x="110" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Mentara</text>
    <circle cx="237" cy="36" r="3.5" fill="#D4FF00" />
  </g>
</svg>