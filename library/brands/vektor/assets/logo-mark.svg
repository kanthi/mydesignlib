<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Vektor dynamic constructivist monogram: forward velocity, 45-degree parallel cuts -->
  <!-- Top diagonal bar with beveled terminals -->
  <path d="M 20,40 H 95 L 80,75 H 20 Z" fill="#B6FF1A"/>
  <!-- Central descending chevron / spine -->
  <path d="M 115,40 H 180 L 125,160 H 60 L 95,85 H 130 Z" fill="#B6FF1A"/>
  <!-- Angled kinetic stabilizer leg -->
  <path d="M 135,95 L 180,160 H 135 L 105,115 Z" fill="#B6FF1A"/>
</svg>
