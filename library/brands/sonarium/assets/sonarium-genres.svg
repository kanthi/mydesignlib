    <path d="M 0 60 C 40 10, 70 130, 120 40 C 160 0, 190 140, 240 50 C 280 10, 310 110, 340 30 C 320 80, 280 140, 230 70 C 190 120, 140 20, 100 80 C 60 130, 20 50, 0 60 Z" fill="#D6F547"/>
  </g>

  <!-- 04 Electronic & Experimental -->
