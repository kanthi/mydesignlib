<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <!-- 4-Genre Generative Soundwave Matrix -->
  <!-- 01 Baroque -->
  <g transform="translate(40, 40)">
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#B84A39">01 / BAROQUE &amp; HARMONIC</text>
    <path d="M 0 70 C 50 30, 90 110, 140 70 C 180 30, 220 110, 260 70 C 290 40, 320 90, 340 70 C 310 100, 270 40, 240 85 C 200 120, 160 50, 120 85 C 80 120, 40 40, 0 70 Z" fill="#B84A39"/>
