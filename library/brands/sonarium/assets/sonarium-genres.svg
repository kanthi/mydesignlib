    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#2440ED">02 / CONTEMPORARY AVANT-GARDE</text>
    <path d="M 0 90 L 60 20 L 110 130 L 160 40 L 220 120 L 270 15 L 340 85 L 290 95 L 240 35 L 190 105 L 140 60 L 80 115 Z" fill="#2440ED"/>
  </g>

  <!-- 03 Modern Jazz -->
  <g transform="translate(40, 280)">
