    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FF4D4D">04 / ELECTRONIC OSCILLATIONS</text>
    <path d="M 0 70 Q 20 20 40 70 T 80 70 T 120 70 T 160 20 T 200 120 T 240 70 T 280 40 T 320 90 T 340 70 L 335 78 Q 315 98 295 78 T 255 78 T 215 125 T 175 25 T 135 78 T 95 78 T 55 78 T 15 28 Z" fill="#FF4D4D"/>
  </g>
</svg>
