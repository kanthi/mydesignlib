<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" fill="none">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- POSTER 1: NADAR ENSEMBLE (Exact to reference artifact) -->
  <g transform="translate(40, 30)" filter="url(#cardShadow)">
    <!-- Dark warm graphite / concrete background -->
    <rect width="300" height="660" rx="4" fill="#4B4743" stroke="#2B2825" stroke-width="2"/>

    <!-- Typographic Title in Black Sans-Serif -->
    <text x="24" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em" fill="#0D0D0E">Nadar</text>
    <text x="24" y="105" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em" fill="#0D0D0E">Ensemble</text>

    <!-- Generative Multi-Strand Oscilloscope Sound Ribbon in Electric Orange -->
    <g opacity="0.95">
      <!-- 28 sweeping wireframe harmonics forming the diagonal envelope -->
      <path d="M 0 320 C 80 180, 220 120, 270 240 C 310 330, 180 500, 100 480 C 40 460, 20 380, 50 320" stroke="#FF5500" stroke-width="1.1" fill="none" opacity="0.4"/>
      <path d="M 0 305 C 85 170, 225 125, 272 250 C 308 340, 175 510, 95 490 C 35 470, 18 390, 52 325" stroke="#FF6A00" stroke-width="1.1" fill="none" opacity="0.5"/>
      <path d="M 0 290 C 90 160, 230 130, 274 260 C 306 350, 170 520, 90 500 C 30 480, 16 400, 54 330" stroke="#FF7E00" stroke-width="1.1" fill="none" opacity="0.6"/>
      <path d="M 0 275 C 95 150, 235 135, 276 270 C 304 360, 165 530, 85 510 C 25 490, 14 410, 56 335" stroke="#FF5500" stroke-width="1.1" fill="none" opacity="0.7"/>
      <path d="M 0 260 C 100 140, 240 140, 278 280 C 302 370, 160 540, 80 520 C 20 500, 12 420, 58 340" stroke="#FF6A00" stroke-width="1.1" fill="none" opacity="0.8"/>
      <path d="M 0 245 C 105 130, 245 145, 280 290 C 300 380, 155 550, 75 530 C 15 510, 10 430, 60 345" stroke="#FF7E00" stroke-width="1.2" fill="none" opacity="0.9"/>
      <path d="M 0 230 C 110 120, 250 150, 282 300 C 298 390, 150 560, 70 540 C 10 520, 8 440, 62 350" stroke="#FF5500" stroke-width="1.2" fill="none"/>
      <path d="M 0 215 C 115 110, 255 155, 284 310 C 296 400, 145 570, 65 550 C 5 530, 6 450, 64 355" stroke="#FF6A00" stroke-width="1.2" fill="none"/>
      <path d="M 0 200 C 120 100, 260 160, 286 320 C 294 410, 140 580, 60 560 C 0 540, 4 460, 66 360" stroke="#FF7E00" stroke-width="1.2" fill="none" opacity="0.85"/>
      <path d="M 0 185 C 125 90, 265 165, 288 330 C 292 420, 135 590, 55 570 C -5 550, 2 470, 68 365" stroke="#FF5500" stroke-width="1.1" fill="none" opacity="0.7"/>
    </g>

    <!-- Bottom Left Concert Info -->
    <text x="24" y="580" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0D0D0E">2 July 2026</text>
    <text x="24" y="598" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0D0D0E">19:30 Concertzaal</text>
    <text x="24" y="618" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#0D0D0E">A mix of mediums</text>

    <!-- Bottom Right Brand Lockup -->
    <g transform="translate(160, 560)">
      <path d="M 60 25 C 50 35, 20 40, 10 32 C 2 25, 4 14, 15 12 C 28 8, 48 18, 60 25 C 72 32, 92 42, 105 38 C 115 35, 118 24, 108 17 C 95 10, 70 16, 60 25 C 52 16, 42 5, 35 7 C 28 9, 30 18, 38 22 C 45 26, 68 30, 82 24 C 95 18, 102 13, 98 8 C 90 4, 72 14, 60 25 Z" stroke="#0D0D0E" stroke-width="1.2" fill="none"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.03em" fill="#0D0D0E">Sonarium</text>
      <text x="60" y="44" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="5" font-weight="700" letter-spacing="0.2em" fill="#0D0D0E">MUZIEKCENTRUM</text>
    </g>
  </g>

  <!-- POSTER 2: BURGUNDY & MAGENTA TOTE COLORWAY (Exact to reference artifact) -->
  <g transform="translate(390, 30)" filter="url(#cardShadow)">
    <rect width="300" height="660" rx="4" fill="#3D0613" stroke="#25030A" stroke-width="2"/>

    <!-- Typographic Title -->
    <text x="24" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em" fill="#FF1A75">Vox Nova</text>
    <text x="24" y="105" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em" fill="#FF1A75">Polyphony</text>

    <!-- Hot Magenta Looping Multi-Strand Curves -->
    <g opacity="0.9">
      <path d="M 20 220 C 120 140, 260 160, 270 280 C 280 390, 140 440, 60 380 C 10 340, 40 240, 150 200 C 250 160, 290 280, 250 380 C 210 470, 70 510, 40 440" stroke="#FF1A75" stroke-width="1.5" fill="none"/>
      <path d="M 30 230 C 125 155, 255 175, 265 285 C 275 385, 145 435, 70 375 C 20 335, 45 245, 145 205 C 245 165, 285 285, 245 375 C 205 465, 75 505, 45 435" stroke="#FF1A75" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M 40 240 C 130 170, 250 190, 260 290 C 270 380, 150 430, 80 370 C 30 330, 50 250, 140 210 C 240 170, 280 290, 240 370 C 200 460, 80 500, 50 430" stroke="#FF1A75" stroke-width="1" fill="none" opacity="0.4"/>
    </g>

    <!-- Info -->
    <text x="24" y="580" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF1A75">14 October 2026</text>
    <text x="24" y="598" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF1A75">20:00 Grote Zaal</text>
    <text x="24" y="618" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#FFA3C7">Flemish Choral Heritage</text>

    <!-- Brand Lockup -->
    <g transform="translate(160, 560)">
      <path d="M 60 25 C 50 35, 20 40, 10 32 C 2 25, 4 14, 15 12 C 28 8, 48 18, 60 25 C 72 32, 92 42, 105 38 C 115 35, 118 24, 108 17 C 95 10, 70 16, 60 25 Z" stroke="#FF1A75" stroke-width="1.2" fill="none"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.03em" fill="#FF1A75">Sonarium</text>
      <text x="60" y="44" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="5" font-weight="700" letter-spacing="0.2em" fill="#FF1A75">MUZIEKCENTRUM</text>
    </g>
  </g>

  <!-- POSTER 3: VIBRANT VIOLET & COBALT (Exact to reference artifact hang tag) -->
  <g transform="translate(740, 30)" filter="url(#cardShadow)">
    <rect width="300" height="660" rx="4" fill="#E5DFD5" stroke="#C5BEB2" stroke-width="2"/>

    <!-- Typographic Title -->
    <text x="24" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em" fill="#3813C2">Fontana</text>
    <text x="24" y="105" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.04em" fill="#3813C2">Mix · Cage</text>

    <!-- Multi-Loop Lissajous Ribbon from Hang Tag -->
    <g opacity="0.95">
      <path d="M 150 330 C 230 220, 270 380, 200 480 C 130 570, 40 450, 70 320 C 100 190, 220 180, 260 290 C 290 380, 180 520, 110 490 C 50 460, 40 370, 90 270 C 140 180, 240 260, 210 390 C 180 490, 80 470, 70 370" stroke="#3813C2" stroke-width="1.8" fill="none"/>
      <path d="M 150 330 C 230 220, 270 380, 200 480 C 130 570, 40 450, 70 320 C 100 190, 220 180, 260 290" stroke="#7C52FF" stroke-width="1.1" fill="none" opacity="0.5"/>
    </g>

    <!-- Info -->
    <text x="24" y="580" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3813C2">28 November 2026</text>
    <text x="24" y="598" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3813C2">20:30 Abbey Cloister</text>
    <text x="24" y="618" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6A5A8C">Graphic Notation Experiments</text>

    <!-- Brand Lockup -->
    <g transform="translate(160, 560)">
      <path d="M 60 25 C 50 35, 20 40, 10 32 C 2 25, 4 14, 15 12 C 28 8, 48 18, 60 25 Z" stroke="#3813C2" stroke-width="1.2" fill="none"/>
      <text x="60" y="30" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.03em" fill="#3813C2">Sonarium</text>
      <text x="60" y="44" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="5" font-weight="700" letter-spacing="0.2em" fill="#3813C2">MUZIEKCENTRUM</text>
    </g>
  </g>
</svg>
