<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clarion — Social kit</title>
<link rel="icon" href="assets/clarion-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#080B09;color:#F9FAFB;padding:40px 24px 72px}
h1{font-weight:700;font-size:36px;letter-spacing:-.03em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--mono);color:#9CA3AF;max-width:1400px;margin:0 auto 28px}
.sub a{color:#10B981}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.35)}
body.export{padding:0;background:#080B09}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.big{font-weight:700;letter-spacing:-.045em;line-height:.92}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:16px;font-weight:700;font-size:40px;letter-spacing:-.03em}
.word img{width:56px;height:56px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Clarion study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#080B09;color:#F9FAFB">
  <p class="kicker" style="color:#10B981">Inbox</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:92px">Say goodbye to inbox overwhelm.</p>
  <div class="foot"><span class="word"><img src="assets/clarion-symbol-reverse.svg" alt="">Clarion</span><span style="font:22px var(--mono)">START</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#080B09;color:#F9FAFB">
  <p class="kicker" style="color:#38BDF8">Forecast</p>
  <p class="big" style="position:absolute;left:72px;top:220px;font-size:220px;color:#10B981">94.2</p>
  <p style="position:absolute;left:72px;top:520px;font-weight:700;font-size:42px;letter-spacing:-.03em">forecast accuracy</p>
  <div class="foot"><span class="word"><img src="assets/clarion-symbol-reverse.svg" alt="">Clarion</span><span style="font:22px var(--mono)">SIGNAL</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#F9FAFB;color:#080B09">
  <p class="kicker" style="color:#047857">At a glance</p>
  <div style="position:absolute;left:72px;right:72px;top:240px;display:grid;grid-template-columns:1fr;gap:28px">
    <div><p class="big" style="font-size:72px">4.9</p><p style="font:20px var(--mono);margin-top:8px">RATING</p></div>
    <div><p class="big" style="font-size:72px">800+</p><p style="font:20px var(--mono);margin-top:8px">TEAMS</p></div>
    <div><p class="big" style="font-size:72px">94.2%</p><p style="font:20px var(--mono);margin-top:8px">FORECAST ACCURACY</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/clarion-symbol.svg" alt="">Clarion</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#10B981;color:#080B09">
  <img src="assets/clarion-symbol.svg" alt="" width="220" style="position:absolute;left:72px;top:280px;width:220px;height:220px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:110px">Inbox, clarified.</p>
  <div class="foot"><span class="word"><img src="assets/clarion-symbol.svg" alt="">Clarion</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
