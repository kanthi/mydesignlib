<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <!-- Blueprint Dark Grid Background -->
  <rect width="600" height="500" fill="#060510"/>
  
  <defs>
    <pattern id="cad-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="cad-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(118,106,211,0.18)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="500" fill="url(#cad-grid)"/>
  <rect width="600" height="500" fill="url(#cad-grid-major)"/>

  <!-- Construction Circles & Radii -->
  <circle cx="280" cy="270" r="160" stroke="#766AD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <circle cx="280" cy="270" r="120" stroke="#766AD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.35"/>
  <circle cx="280" cy="270" r="40" stroke="#766AD3" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Coordinate Center Crosshairs -->
  <line x1="80" y1="270" x2="520" y2="270" stroke="#766AD3" stroke-width="1" opacity="0.5"/>
  <line x1="280" y1="50" x2="280" y2="450" stroke="#766AD3" stroke-width="1" opacity="0.5"/>

  <!-- Diagonal 45 deg Tangent -->
  <line x1="120" y1="430" x2="440" y2="110" stroke="#766AD3" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Actual Logo Geometry (Scaled) -->
  <g transform="translate(140, 100) scale(1.4)">
    <path d="M 38 62 A 98 98 0 0 1 198 195" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
    <path d="M 38 128 L 96 128 A 24 24 0 0 1 120 152 L 120 195" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- Dimension Markers & Callouts -->
  <!-- Top Horizontal Dimension -->
  <line x1="193" y1="80" x2="417" y2="80" stroke="#766AD3" stroke-width="2"/>
  <line x1="193" y1="72" x2="193" y2="88" stroke="#766AD3" stroke-width="2"/>
  <line x1="417" y1="72" x2="417" y2="88" stroke="#766AD3" stroke-width="2"/>
  <text x="305" y="72" fill="#766AD3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">224 px</text>

  <!-- Left Vertical Dimension -->
  <line x1="160" y1="186" x2="160" y2="373" stroke="#766AD3" stroke-width="2"/>
  <line x1="152" y1="186" x2="168" y2="186" stroke="#766AD3" stroke-width="2"/>
  <line x1="152" y1="373" x2="168" y2="373" stroke="#766AD3" stroke-width="2"/>
  <text x="145" y="284" fill="#766AD3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="end">187 px</text>

  <!-- Right Vertical Full Bounding Dimension -->
  <line x1="450" y1="186" x2="450" y2="373" stroke="#766AD3" stroke-width="2"/>
  <line x1="442" y1="186" x2="458" y2="186" stroke="#766AD3" stroke-width="2"/>
  <line x1="442" y1="373" x2="458" y2="373" stroke="#766AD3" stroke-width="2"/>
  <text x="465" y="284" fill="#766AD3" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="start">Δ 235 px</text>

  <!-- Radius Callouts -->
  <path d="M 280 270 L 350 200 L 400 200" fill="none" stroke="#766AD3" stroke-width="1.5"/>
  <circle cx="280" cy="270" r="3" fill="#766AD3"/>
  <text x="408" y="204" fill="#766AD3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">R1 = 98 px</text>

  <path d="M 274 313 L 230 350 L 190 350" fill="none" stroke="#766AD3" stroke-width="1.5"/>
  <circle cx="274" cy="313" r="3" fill="#766AD3"/>
  <text x="182" y="354" fill="#766AD3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">r2 = 24 px</text>

  <!-- Technical Tag -->
  <text x="30" y="40" fill="#766AD3" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.1em">NX-GEO-01 // MODULAR CAD BLUEPRINT</text>
  <text x="570" y="40" fill="#807F93" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" text-anchor="end">TOLERANCE ±0.01mm</text>
</svg>
