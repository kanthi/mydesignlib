<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novera — Social kit</title>
<link rel="icon" href="assets/novera-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#1B334F;color:#F3E7D4;padding:40px 24px 72px}
h1{font-family:var(--serif);font-weight:520;font-size:40px;letter-spacing:-.028em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);color:#F3E7D4;max-width:1400px;margin:0 auto 28px}
.sub a{color:#FFFCF8}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(27,51,79,.35)}
body.export{padding:0;background:#1B334F}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--serif);font-weight:520;letter-spacing:-.03em;line-height:.95}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:12px;font-weight:600;font-size:28px;letter-spacing:-.03em}
.word img{width:36px;height:36px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Novera study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#F3E7D4;color:#2B4776">
  <p class="kicker">The first reply</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:78px">Say the work before you ask for the résumé.</p>
  <div class="foot"><span class="word"><img src="assets/novera-symbol.svg" alt="">Novera</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">DESK</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#1B334F;color:#F3E7D4">
  <p class="kicker" style="color:#F3E7D4">Open</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:220px;color:#F3E7D4">Seven</p>
  <p style="position:absolute;left:72px;top:500px;font-family:var(--serif);font-weight:520;font-size:48px;letter-spacing:-.02em">days. One page.</p>
  <div class="foot"><span class="word"><img src="assets/novera-symbol-reverse.svg" alt="">Novera</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">$199</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFCF8;color:#2B4776">
  <p class="kicker">Pricing</p>
  <div style="position:absolute;left:72px;right:72px;top:220px;display:grid;grid-template-columns:1fr;gap:28px">
    <div><p class="kicker" style="position:static">Trial</p><p class="big" style="font-size:72px">$199</p></div>
    <div><p class="kicker" style="position:static">Desk</p><p class="big" style="font-size:72px">$480</p></div>
    <div><p class="kicker" style="position:static">House</p><p class="big" style="font-size:72px">$1,280</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/novera-symbol.svg" alt="">Novera</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#1B334F;color:#F3E7D4">
  <img src="assets/novera-symbol-reverse.svg" alt="" style="position:absolute;left:72px;top:280px;width:180px;height:180px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:120px">One page.</p>
  <div class="foot"><span class="word"><img src="assets/novera-symbol-reverse.svg" alt="">Novera</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
