<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Lighting gradient -->
    <radialGradient id="toteBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#E5DEC9" />
    </radialGradient>

    <!-- Canvas fabric texture -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="40%" stop-color="#F7F3EA" />
      <stop offset="80%" stop-color="#EFE9DC" />
      <stop offset="100%" stop-color="#E2D9C5" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="canvasShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#5C5546" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#toteBg)" />

  <!-- Botanical shadow element (like in reference photo) -->
  <path d="M 40 200 Q 80 250 50 320 Q 90 380 60 460" stroke="#000000" stroke-width="24" fill="none" opacity="0.08" filter="blur(8px)" />
  <circle cx="85" cy="270" r="16" fill="#000000" opacity="0.08" filter="blur(8px)" />
  <circle cx="65" cy="350" r="18" fill="#000000" opacity="0.08" filter="blur(8px)" />
  <circle cx="95" cy="420" r="16" fill="#000000" opacity="0.08" filter="blur(8px)" />

  <!-- Tote Bag Structure -->
  <g filter="url(#canvasShadow)" transform="translate(140, 80)">
    <!-- Left Strap -->
    <path d="M 80 150 C 70 20, 115 15, 115 15 C 120 15, 95 25, 105 150 Z" fill="#F7F3EA" stroke="#DDD4C0" stroke-width="1.5" />
    <!-- Right Strap -->
    <path d="M 215 150 C 205 20, 250 15, 250 15 C 255 15, 230 25, 240 150 Z" fill="#F7F3EA" stroke="#DDD4C0" stroke-width="1.5" />

    <!-- Main Tote Body -->
    <rect x="25" y="140" width="270" height="320" rx="8" fill="url(#canvasGrad)" />
    <!-- Fabric fold shadows -->
    <path d="M 35 160 Q 65 300 45 440" fill="none" stroke="#D3C7AE" stroke-width="6" opacity="0.4" />
    <path d="M 285 170 Q 260 310 280 440" fill="none" stroke="#D3C7AE" stroke-width="6" opacity="0.4" />

    <!-- Top hem -->
    <rect x="25" y="140" width="270" height="24" fill="#F1ECE0" />
    <line x1="25" y1="164" x2="295" y2="164" stroke="#D3C7AE" stroke-width="1.5" stroke-dasharray="4,2" />

    <!-- Silkscreen Printed Mark -->
    <g transform="translate(115, 205)">
      <svg width="90" height="90" viewBox="0 0 100 100" fill="#1B2226">
        <defs>
          <mask id="totePunch">
            <rect width="100" height="100" fill="white" />
            <circle cx="50" cy="50" r="6.2" fill="black" />
            <circle cx="50" cy="17" r="6.2" fill="black" />
            <circle cx="83" cy="50" r="6.2" fill="black" />
            <circle cx="50" cy="83" r="6.2" fill="black" />
            <circle cx="17" cy="50" r="6.2" fill="black" />
          </mask>
        </defs>
        <path d="M 41.16 25.84 A 12.5 12.5 0 1 1 58.84 25.84 A 10.835 10.835 0 0 0 74.16 41.16 A 12.5 12.5 0 1 1 74.16 58.84 A 10.835 10.835 0 0 0 58.84 74.16 A 12.5 12.5 0 1 1 41.16 74.16 A 10.835 10.835 0 0 0 25.84 58.84 A 12.5 12.5 0 1 1 25.84 41.16 A 10.835 10.835 0 0 0 41.16 25.84 Z" mask="url(#totePunch)" />
        <circle cx="66.5" cy="33.5" r="5.2" />
        <circle cx="66.5" cy="66.5" r="5.2" />
        <circle cx="33.5" cy="66.5" r="5.2" />
        <circle cx="33.5" cy="33.5" r="5.2" />
      </svg>
    </g>

    <!-- Typography: FLUMINA -->
    <text x="160" y="335" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#1B2226" text-anchor="middle" letter-spacing="0.18em">FLUMINA</text>

    <!-- Subtitle: FLOW. CONNECT. CREATE. with colored letters -->
    <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.22em" text-anchor="middle">
      <text x="160" y="352">
        <tspan fill="#FC6142">FLOW. </tspan>
        <tspan fill="#F9B2D7">CONNECT. </tspan>
        <tspan fill="#5DA5B8">CREATE.</tspan>
      </text>
    </g>

    <!-- Bottom Palette Color Bars (matching reference photo) -->
    <g transform="translate(60, 420)">
      <rect x="0" y="0" width="36" height="8" fill="#F7F3EA" stroke="#DDD4C0" stroke-width="0.5" />
      <rect x="40" y="0" width="36" height="8" fill="#FC6142" />
      <rect x="80" y="0" width="36" height="8" fill="#F9B2D7" />
      <rect x="120" y="0" width="36" height="8" fill="#CFECF3" />
      <rect x="160" y="0" width="36" height="8" fill="#2563EB" />
    </g>
  </g>
</svg>
