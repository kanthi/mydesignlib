<style>
  main { padding: 28px var(--pad) 64px; }
  h1 { font-family: var(--display); font-weight: 700; letter-spacing: -0.045em; font-size: clamp(40px, 6vw, 72px); text-transform: uppercase; line-height: 0.9; margin: 0 0 8px; }
  .kicker { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin-top: 22px; }
  .slot { overflow: hidden; position: relative; background: #fff; border-radius: 12px; }
  .slot.post { width: 340px; height: 340px; }
  .slot.story { width: 280px; height: 498px; }
  .art { width: 1080px; height: 1080px; transform: scale(0.314814); transform-origin: top left; position: relative; background: #F6F6F6; }
  .slot.story .art { height: 1920px; transform: scale(0.259259); }
  .art h2 { font-family: var(--display); font-weight: 700; letter-spacing: -0.045em; text-transform: uppercase; line-height: 0.88; margin: 0; }
  .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pad { position: relative; z-index: 1; padding: 72px; height: 100%; display: flex; flex-direction: column; }
  .pill { display: inline-flex; border: 2px solid currentColor; border-radius: 999px; padding: 14px 28px; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; width: max-content; }
</style>
</head>
<body>
<main>
<!-- SECTION: social -->
<p class="kicker">Social kit · 3 posts 1080 · 1 story 1080×1920</p>
<h1>Social</h1>
<div class="row">
  <div class="slot post">
    <div class="art">
      <div class="pad">
        <img src="assets/symbol.svg" alt="" style="width:160px;height:auto">
        <h2 style="font-size:120px;margin-top:28px">Halden</h2>
        <p style="font-family:var(--display);font-size:42px;margin-top:12px">Meet Ledger</p>
        <img src="assets/hero-rail.jpg" alt="" style="margin-top:auto;height:420px;width:100%;object-fit:cover;border-radius:28px">
      </div>
    </div>
  </div>
  <div class="slot post">
    <div class="art">
      <img class="fill" src="assets/hero-tray.jpg" alt="">
      <div class="pad" style="color:#fff;background:linear-gradient(180deg,rgba(17,17,17,.45),rgba(17,17,17,0) 55%)">
        <p style="font-size:28px">The perfect set</p>
        <h2 style="font-size:104px;margin-top:12px">Valet<br>tray set</h2>
        <span class="pill" style="margin-top:28px">Shop trays</span>
      </div>
    </div>
  </div>
  <div class="slot post">
    <div class="art">
      <img class="fill" src="assets/clock.jpg" alt="">
      <div class="pad">
        <p style="font-size:28px">A clean, minimalist design.</p>
        <h2 style="font-size:108px;margin-top:12px">Plywood<br>clock</h2>
        <span class="pill" style="margin-top:28px">Get it</span>
      </div>
    </div>
  </div>
  <div class="slot story">
    <div class="art">
      <img class="fill" src="assets/banner-window.jpg" alt="">
      <div class="pad" style="color:#fff;justify-content:flex-end;background:linear-gradient(180deg,rgba(17,17,17,.15),rgba(17,17,17,.55))">
        <img src="assets/lockup-reverse.svg" alt="" style="width:420px;margin-bottom:28px">
        <h2 style="font-size:120px">Desk,<br>simplified</h2>
        <span class="pill" style="margin-top:28px">Shop the desk</span>
      </div>
    </div>
  </div>
</div>
<!-- /SECTION: social -->
</main>
</body>
</html>
