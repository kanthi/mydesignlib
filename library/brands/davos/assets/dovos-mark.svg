<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Layer 4: Overarching Wave Arch (Lightest Slate) -->
  <path d="M 100 175 C 100 120, 145 100, 200 100 C 255 100, 300 145, 300 200 C 300 255, 255 300, 200 300 C 160 300, 130 285, 100 250 C 130 280, 160 290, 195 290 C 245 290, 285 250, 285 200 C 285 150, 245 115, 200 115 C 155 115, 120 135, 110 175 C 105 190, 120 205, 135 195 C 145 185, 150 160, 200 160 C 225 160, 240 175, 240 200 C 240 225, 220 250, 190 260 C 170 270, 130 250, 115 220 C 110 205, 100 195, 100 175 Z" fill="#CBD5E1" />

  <!-- Base Solid Silhouette + 3-tier Wave (Exact contour geometry) -->
  <g id="mark-silhouette">
    <!-- Layer 4 Outer Arch Body -->
    <path d="M 100 175 A 25 25 0 0 1 150 175 A 50 50 0 0 1 250 200 A 100 100 0 0 1 200 300 L 100 300 L 100 275 A 25 25 0 0 1 125 250 L 150 250 A 25 25 0 0 0 175 225 L 175 200 A 25 25 0 0 0 150 175 A 100 100 0 0 0 100 175 Z" fill="#CBD5E1" opacity="0.95" />

    <!-- Layer 3: Ascending Step 3 -->
    <path d="M 100 300 L 200 300 A 100 100 0 0 0 250 225 C 250 210, 235 200, 220 200 C 205 200, 195 210, 190 225 C 185 240, 175 250, 160 250 L 100 300 Z" fill="#94A3B8" />

    <!-- Layer 2: Ascending Step 2 -->
    <path d="M 100 300 L 175 300 C 185 285, 185 265, 170 250 C 160 240, 145 240, 135 250 C 125 260, 115 270, 100 300 Z" fill="#64748B" />

    <!-- Layer 1: Ascending Step 1 (Base Petal) -->
    <path d="M 100 300 L 135 300 C 145 290, 145 275, 135 265 C 125 255, 110 255, 100 265 L 100 300 Z" fill="#475569" />
  </g>
</svg>