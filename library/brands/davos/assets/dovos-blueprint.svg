<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <pattern id="grid-pattern" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" />
    </pattern>
  </defs>

  <!-- Background rounded card -->
  <rect x="20" y="20" width="560" height="560" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  <!-- Grid overlay -->
  <rect x="50" y="50" width="500" height="500" fill="url(#grid-pattern)" stroke="#CBD5E1" stroke-width="1" />

  <!-- Construction Circles -->
  <!-- Outer Arch Circle: center (350, 350), R = 200 -->
  <circle cx="350" cy="350" r="200" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,6" />
  <!-- Inner Arch Circle: center (350, 350), R = 100 -->
  <circle cx="350" cy="350" r="100" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,6" />
  <!-- Wave bulb circle: center (200, 225), R = 50 -->
  <circle cx="200" cy="225" r="50" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Step Circles -->
  <circle cx="400" cy="400" r="53" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" />
  <circle cx="300" cy="460" r="53" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" />
  <circle cx="200" cy="510" r="53" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- Filled Mark -->
  <g transform="translate(50, 50) scale(1.0)">
    <path d="M 100 175 A 25 25 0 0 1 150 175 A 50 50 0 0 1 250 200 A 100 100 0 0 1 200 300 L 100 300 L 100 275 A 25 25 0 0 1 125 250 L 150 250 A 25 25 0 0 0 175 225 L 175 200 A 25 25 0 0 0 150 175 A 100 100 0 0 0 100 175 Z" fill="#CBD5E1" opacity="0.85" />
    <path d="M 100 300 L 200 300 A 100 100 0 0 0 250 225 C 250 210, 235 200, 220 200 C 205 200, 195 210, 190 225 C 185 240, 175 250, 160 250 L 100 300 Z" fill="#94A3B8" opacity="0.9" />
    <path d="M 100 300 L 175 300 C 185 285, 185 265, 170 250 C 160 240, 145 240, 135 250 C 125 260, 115 270, 100 300 Z" fill="#64748B" opacity="0.9" />
    <path d="M 100 300 L 135 300 C 145 290, 145 275, 135 265 C 125 255, 110 255, 100 265 L 100 300 Z" fill="#475569" />
  </g>

  <!-- Dimension tags -->
  <text x="60" y="80" font-family="monospace" font-size="12" fill="#64748B">6x6 RATIO GRID</text>
  <text x="460" y="80" font-family="monospace" font-size="12" fill="#3B82F6">R = 2x // 1x</text>
</svg>