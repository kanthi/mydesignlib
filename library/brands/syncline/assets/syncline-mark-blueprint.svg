<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Blueprint Soft Lavender Background -->
  <rect width="500" height="500" rx="36" fill="#E5E5FF"/>

  <defs>
    <!-- Anchor Point Marker -->
    <g id="anchorPoint">
      <rect x="-4.5" y="-4.5" width="9" height="9" fill="#5D5CFA" stroke="#FFFFFF" stroke-width="1.5" rx="1.5"/>
    </g>
  </defs>

  <!-- Construction Grid & Circular Guides -->
  <circle cx="250" cy="250" r="160" stroke="#7B84B6" stroke-width="1" opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="195" cy="195" r="54" stroke="#5D5CFA" stroke-width="1" opacity="0.4"/>
  <circle cx="305" cy="305" r="54" stroke="#5D5CFA" stroke-width="1" opacity="0.4"/>

  <!-- Construction Diagonal & Axes -->
  <line x1="60" y1="60" x2="440" y2="440" stroke="#5D5CFA" stroke-width="1" opacity="0.35" stroke-dasharray="4 4"/>
  <line x1="120" y1="380" x2="380" y2="120" stroke="#5D5CFA" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="195" x2="440" y2="195" stroke="#7B84B6" stroke-width="1" opacity="0.25"/>
  <line x1="60" y1="305" x2="440" y2="305" stroke="#7B84B6" stroke-width="1" opacity="0.25"/>

  <!-- Scaled Logo Mark Geometry (offset to center 250, 250) -->
  <g transform="translate(45, 45) scale(1.7)">
    <!-- Central Dumbbell Fill in Soft Tint -->
    <path d="M 64 96 C 64 74 82 56 104 56 C 118 56 130 63 138 74 C 144 83 148 94 154 102 C 160 110 171 116 184 122 C 195 128 202 140 202 154 C 202 176 184 194 162 194 C 148 194 136 187 128 176 C 122 167 118 156 112 148 C 106 140 95 134 82 128 C 71 122 64 110 64 96 Z" 
          fill="rgba(93, 92, 250, 0.12)" stroke="#5D5CFA" stroke-width="2"/>

    <!-- Top-Right Wedge Fill in Soft Tint -->
    <path d="M 148 54 L 184 54 A 16 16 0 0 1 200 70 L 200 106 C 196 90 180 72 148 54 Z" 
          fill="rgba(93, 92, 250, 0.12)" stroke="#5D5CFA" stroke-width="2"/>

    <!-- Bottom-Left Wedge Fill in Soft Tint -->
    <path d="M 92 196 L 56 196 A 16 16 0 0 1 40 180 L 40 144 C 44 160 60 178 92 196 Z" 
          fill="rgba(93, 92, 250, 0.12)" stroke="#5D5CFA" stroke-width="2"/>

    <!-- Vector Anchor Points on Central Core -->
    <use href="#anchorPoint" x="104" y="56"/>
    <use href="#anchorPoint" x="64" y="96"/>
    <use href="#anchorPoint" x="154" y="102"/>
    <use href="#anchorPoint" x="202" y="154"/>
    <use href="#anchorPoint" x="162" y="194"/>
    <use href="#anchorPoint" x="112" y="148"/>

    <!-- Vector Anchor Points on Top-Right Wedge -->
    <use href="#anchorPoint" x="148" y="54"/>
    <use href="#anchorPoint" x="184" y="54"/>
    <use href="#anchorPoint" x="200" y="70"/>
    <use href="#anchorPoint" x="200" y="106"/>

    <!-- Vector Anchor Points on Bottom-Left Wedge -->
    <use href="#anchorPoint" x="92" y="196"/>
    <use href="#anchorPoint" x="56" y="196"/>
    <use href="#anchorPoint" x="40" y="180"/>
    <use href="#anchorPoint" x="40" y="144"/>
  </g>

  <!-- Technical Telemetry Caption -->
  <text x="35" y="465" fill="#5D5CFA" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.05em">SYN-CAD-01 // BEZIER ANCHOR &amp; TANGENT BLUEPRINT</text>
  <text x="465" y="465" fill="#7B84B6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" text-anchor="end">C2 SYMMETRY (180°)</text>
</svg>
