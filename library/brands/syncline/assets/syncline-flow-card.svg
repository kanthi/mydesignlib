<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="flowBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D5CFA"/>
      <stop offset="100%" stop-color="#8B92F8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="36" fill="url(#flowBgGrad)"/>

  <!-- Organic Flow Wave Layers -->
  <path d="M 0 280 C 150 200 350 360 600 240 L 600 400 L 0 400 Z" fill="#6B72FB" opacity="0.6"/>
  <path d="M 0 320 C 180 260 400 380 600 300 L 600 400 L 0 400 Z" fill="#9DA4FC" opacity="0.5"/>

  <!-- Feature Typography -->
  <text x="50" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="28" letter-spacing="-0.02em">
    <tspan x="50" dy="0">Tasks, Data, and Teams</tspan>
    <tspan x="50" dy="38">stay aligned within one</tspan>
    <tspan x="50" dy="38">uninterrupted flow</tspan>
  </text>

  <!-- Avatar Group Pills -->
  <g transform="translate(420, 310)">
    <!-- Avatar 1 -->
    <circle cx="30" cy="30" r="24" fill="#FFFFFF" stroke="#5D5CFA" stroke-width="3"/>
    <circle cx="30" cy="24" r="10" fill="#0E2541"/>
    <path d="M 16 48 C 16 38 22 36 30 36 C 38 36 44 38 44 48 Z" fill="#0E2541"/>

    <!-- Avatar 2 -->
    <circle cx="70" cy="30" r="24" fill="#FFFFFF" stroke="#5D5CFA" stroke-width="3"/>
    <circle cx="70" cy="24" r="10" fill="#5D5CFA"/>
    <path d="M 56 48 C 56 38 62 36 70 36 C 78 36 84 38 84 48 Z" fill="#5D5CFA"/>

    <!-- Avatar 3 -->
    <circle cx="110" cy="30" r="24" fill="#FFFFFF" stroke="#5D5CFA" stroke-width="3"/>
    <circle cx="110" cy="24" r="10" fill="#BCBCFC"/>
    <path d="M 96 48 C 96 38 102 36 110 36 C 118 36 124 38 124 48 Z" fill="#BCBCFC"/>
  </g>
</svg>
