<title>Orlo — Email signature</title>
<link rel="icon" href="assets/orlo-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#F4F5F7;padding:48px 24px}
.sheet{max-width:640px;margin:18px auto 0;background:#fff;border:1px solid #E6E8EE;border-radius:16px;padding:28px}
p.note{font:13px/1.5 var(--sans);color:var(--muted);margin-top:18px}
a.back{font:12px var(--sans);color:var(--link)}
</style></head>
<body>
<p class="back"><a href="merch.html">← Merch</a></p>
<div class="sheet">
  <table cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td style="padding-right:16px;vertical-align:middle"><img src="assets/orlo-symbol.svg" alt="" width="36" height="36"></td>
      <td style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.04em;color:#17191E">STUDIO DESK<br><span style="font-weight:700;font-size:13px;letter-spacing:.04em">ORLO</span></td>
    </tr>
    <tr><td colspan="2" style="padding-top:10px;font:14px 'Plus Jakarta Sans',sans-serif;color:#17191E">
      <a href="mailto:desk@orlo.example" style="color:#17191E;text-decoration:none">desk@orlo.example</a><br>London
    </td></tr>
  </table>
  <p class="note">The note opens in your mail client. This page does not store a message. Swap the local SVG for a hosted PNG when the signature leaves the study.</p>
</div>
</body></html>
