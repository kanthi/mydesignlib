<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nv-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#70F284" />
    </linearGradient>
  </defs>
  <!-- Sweeping Q Velocity Arch -->
  <path d="M 25,68 A 32 32 0 1 1 80,48" 
        stroke="url(#nv-gradient)" stroke-width="7" stroke-linecap="round" />
  <!-- Velocity bar 1 (Top) -->
  <line x1="42" y1="42" x2="76" y2="52" 
        stroke="url(#nv-gradient)" stroke-width="7" stroke-linecap="round" />
  <!-- Velocity bar 2 (Middle) -->
  <line x1="33" y1="54" x2="68" y2="64" 
        stroke="url(#nv-gradient)" stroke-width="7" stroke-linecap="round" />
  <!-- Velocity bar 3 (Bottom tail) -->
  <line x1="25" y1="66" x2="60" y2="76" 
        stroke="url(#nv-gradient)" stroke-width="7" stroke-linecap="round" />
</svg>
