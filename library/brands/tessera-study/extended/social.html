<html lang="en"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tessera — Social kit</title>
<link rel="icon" href="assets/tessera-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#F6EFC2;color:#111;padding:40px 24px 72px}
h1{font-family:var(--serif);font-weight:500;font-size:40px;letter-spacing:-.02em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);color:#3A3A3A;max-width:1400px;margin:0 auto 28px}
.sub a{color:#111}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(17,17,17,.16)}
body.export{padding:0;background:#F6EFC2}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.big{font-family:var(--serif);font-weight:500;letter-spacing:-.03em;line-height:.9}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:14px;font-weight:600;font-size:26px;letter-spacing:.16em}
.word img{width:36px;height:36px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Tessera study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#111;color:#F6EFC2">
  <p class="kicker" style="color:#E7C44A">Floor</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:280px;font-size:84px">Every pixel has a <span style="color:#E7C44A">greater purpose.</span></p>
  <div class="foot"><span class="word"><img src="assets/tessera-symbol.svg" alt="">TESSERA</span><span style="font:22px var(--sans);letter-spacing:.16em">PIXEL</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#F6EFC2;color:#111">
  <p class="kicker">Jobs</p>
  <p class="big" style="position:absolute;left:72px;top:160px;font-size:360px">8</p>
  <p style="position:absolute;left:72px;top:580px;font-weight:600;font-size:40px;letter-spacing:-.02em">jobs on one floor</p>
  <div class="foot"><span class="word"><img src="assets/tessera-symbol.svg" alt="">TESSERA</span><span style="font:22px var(--sans);letter-spacing:.16em">FLOOR</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFFFF;color:#111">
  <p class="kicker">Rooms</p>
  <div style="position:absolute;left:72px;right:72px;top:220px;display:grid;grid-template-columns:1fr;gap:28px">
    <div><p class="big" style="font-size:72px">01</p><p style="font:20px var(--sans);letter-spacing:.12em;margin-top:8px">INTAKE</p></div>
    <div><p class="big" style="font-size:72px">02</p><p style="font:20px var(--sans);letter-spacing:.12em;margin-top:8px">WORK</p></div>
    <div><p class="big" style="font-size:72px">03</p><p style="font:20px var(--sans);letter-spacing:.12em;margin-top:8px">HAND-OFF</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/tessera-symbol.svg" alt="">TESSERA</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#E7C44A;color:#111">
  <img src="assets/tessera-symbol.svg" alt="" style="position:absolute;left:72px;top:280px;width:200px;height:200px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:100px">Greater purpose.</p>
  <div class="foot"><span class="word"><img src="assets/tessera-symbol.svg" alt="">TESSERA</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
