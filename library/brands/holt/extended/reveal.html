<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holt — Reveal</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z97ZD3EVSF"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; }
  .stage { text-align: center; padding: 32px 16px 48px; }
  .mark { width: min(160px, 40vw); height: auto; display: block; margin: 0 auto 18px; }
  .word { font-weight: 500; letter-spacing: 0.16em; font-size: clamp(48px, 10vw, 96px); line-height: 0.9; margin: 0; }
  .letter { display: inline-block; }
  .replay {
    margin-top: 28px;
    border: 1px solid #2a2a2a;
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) {
    .stroke { stroke-dashoffset: 0 !important; }
  }
</style>
</head>
<body>
<!-- SECTION: reveal -->
<div class="stage">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path class="stroke" d="M19.76 5.66A11 11 0 1 1 12.24 5.66" fill="none" stroke="#F4F7F5" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <p class="word" aria-label="Holt"><span class="letter">H</span><span class="letter">O</span><span class="letter">L</span><span class="letter">T</span></p>
  <button type="button" class="replay" id="replay">Replay</button>
</div>
<!-- /SECTION: reveal -->
<script src="vendor/gsap.min.js"></script>
<script>
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stroke = document.querySelector(".stroke");
  var letters = document.querySelectorAll(".letter");
  function ready() {
    var len = 80;
    try { len = stroke.getTotalLength() || 80; } catch (e) { len = 80; }
    stroke.style.strokeDasharray = String(len);
    stroke.style.strokeDashoffset = String(len);
  }
  if (reduce || !window.gsap) return;
  ready();
  gsap.set(letters, { opacity: 0, y: 16 });
  var tl = gsap.timeline({ defaults: { ease: "power2.inOut" } });
  tl.to(stroke, { strokeDashoffset: 0, duration: 1.1 })
    .to(letters, { opacity: 1, y: 0, duration: 0.45, stagger: 0.06, ease: "power2.out" });
  document.getElementById("replay").addEventListener("click", function () {
    ready();
    gsap.set(letters, { opacity: 0, y: 16 });
    tl.restart();
  });
})();
</script>
</body>
</html>
