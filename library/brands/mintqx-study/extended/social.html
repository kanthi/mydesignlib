<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MintQX — Social kit</title>
<link rel="icon" href="assets/mintqx-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#040404;color:#fff;padding:40px 24px 72px}
h1{font-family:var(--display);font-weight:650;font-stretch:75%;font-size:40px;letter-spacing:-.02em;text-transform:uppercase;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);color:#E9ECEE;max-width:1400px;margin:0 auto 28px}
.sub a{color:#E8F515}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.45)}
body.export{padding:0;background:#040404}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#E8F515}
.big{font-family:var(--display);font-weight:650;font-stretch:75%;letter-spacing:-.03em;line-height:.9;text-transform:uppercase}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:12px;font-weight:500;font-size:28px;letter-spacing:-.02em}
.word img{width:28px;height:36px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← MintQX study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#040404;color:#FFFFFF">
  <p class="kicker">Payments</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:240px;font-size:92px">Smarter payments.</p>
  <div class="foot"><span class="word"><img src="assets/mintqx-symbol.svg" alt="">MintQX</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">DESK</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#040404;color:#E8F515">
  <p class="kicker">Open</p>
  <p class="big" style="position:absolute;left:72px;top:200px;font-size:220px">Zero</p>
  <p style="position:absolute;left:72px;top:500px;font-family:var(--display);font-weight:650;font-stretch:75%;font-size:42px;letter-spacing:-.02em;text-transform:uppercase;color:#FFFFFF">operational headache</p>
  <div class="foot" style="color:#fff"><span class="word"><img src="assets/mintqx-symbol.svg" alt="">MintQX</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:600">$199</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#040404;color:#FFFFFF">
  <p class="kicker">Pricing</p>
  <div style="position:absolute;left:72px;right:72px;top:220px;display:grid;gap:28px">
    <div><p class="kicker" style="position:static">Starter</p><p class="big" style="font-size:72px">$49</p></div>
    <div><p class="kicker" style="position:static">Growth</p><p class="big" style="font-size:72px;color:#E8F515">$199</p></div>
    <div><p class="kicker" style="position:static">Enterprise</p><p class="big" style="font-size:72px">Custom</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/mintqx-symbol.svg" alt="">MintQX</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#E8F515;color:#040404">
  <img src="assets/mintqx-symbol-ink.svg" alt="" style="position:absolute;left:72px;top:280px;width:140px;height:184px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:120px">One desk.</p>
  <div class="foot"><span class="word"><img src="assets/mintqx-symbol-ink.svg" alt="">MintQX</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
