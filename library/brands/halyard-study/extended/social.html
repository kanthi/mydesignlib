<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halyard — Social kit</title>
<link rel="icon" href="assets/halyard-app-icon.svg">
<link rel="stylesheet" href="shared.css">
<style>
body{background:#0C0C0C;color:#fff;padding:40px 24px 72px}
h1{font-weight:700;font-size:40px;letter-spacing:-.048em;margin:0 auto 8px;max-width:1400px}
.sub{font:12px var(--sans);color:#D7D7D7;max-width:1400px;margin:0 auto 28px}
.sub a{color:#2D62FF}
.rail{display:flex;flex-wrap:wrap;gap:28px;max-width:1500px;margin:0 auto;align-items:flex-start}
.frame{zoom:.36;flex:none;box-shadow:0 24px 50px rgba(0,0,0,.35)}
body.export{padding:0;background:#0C0C0C}
body.export h1,body.export .sub{display:none}
body.export .rail{display:block;margin:0}
body.export .frame{zoom:1;box-shadow:none}
.ab{position:relative;overflow:hidden}
.sq{width:1080px;height:1080px}
.st{width:1080px;height:1920px}
.kicker{position:absolute;left:72px;top:72px;font:22px var(--sans);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.big{font-weight:700;letter-spacing:-.06em;line-height:.9}
.foot{position:absolute;left:72px;right:72px;bottom:64px;display:flex;justify-content:space-between;align-items:flex-end}
.word{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:-.04em}
.word img{width:36px;height:36px}
</style></head>
<body>
<h1>Social kit</h1>
<p class="sub">3 × post 1080×1080 · 1 × story 1080×1920 · preview at 36%. <a href="../index.html">← Halyard study</a></p>
<div class="rail">
<div class="frame"><section class="ab sq" id="post-1" style="background:#FFFFFF;color:#121212">
  <p class="kicker" style="color:#2D62FF">Studio</p>
  <p class="big" style="position:absolute;left:72px;right:72px;top:260px;font-size:84px">Based in Gdańsk, working with brands worldwide.</p>
  <div class="foot"><span class="word"><img src="assets/halyard-symbol.svg" alt="">HALYARD</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:700">HQ</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-2" style="background:#0C0C0C;color:#FFFFFF">
  <p class="kicker" style="color:#2D62FF">Open</p>
  <p class="big" style="position:absolute;left:72px;top:220px;font-size:180px;color:#2D62FF">Spring</p>
  <p style="position:absolute;left:72px;top:480px;font-weight:600;font-size:40px;letter-spacing:-.03em">retainers are open</p>
  <div class="foot"><span class="word"><img src="assets/halyard-symbol-reverse.svg" alt="">HALYARD</span><span style="font:22px var(--sans);letter-spacing:.08em;font-weight:700">DESK</span></div>
</section></div>
<div class="frame"><section class="ab sq" id="post-3" style="background:#FFFFFF;color:#121212">
  <p class="kicker" style="color:#2D62FF">Services</p>
  <div style="position:absolute;left:72px;right:72px;top:240px;display:grid;grid-template-columns:1fr;gap:36px">
    <div><p class="big" style="font-size:64px">Product sites</p></div>
    <div><p class="big" style="font-size:64px">Brand systems</p></div>
    <div><p class="big" style="font-size:64px">Retainers</p></div>
  </div>
  <div class="foot"><span class="word"><img src="assets/halyard-symbol.svg" alt="">HALYARD</span></div>
</section></div>
<div class="frame"><section class="ab st" id="story-1" style="background:#2D62FF;color:#FFFFFF">
  <img src="assets/halyard-symbol-reverse.svg" alt="" style="position:absolute;left:72px;top:280px;width:180px;height:180px">
  <p class="big" style="position:absolute;left:72px;right:72px;bottom:280px;font-size:120px">Gdańsk.</p>
  <div class="foot"><span class="word"><img src="assets/halyard-symbol-reverse.svg" alt="">HALYARD</span></div>
</section></div>
</div>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("export");
  if (!id) return;
  document.body.classList.add("export");
  document.querySelectorAll(".frame").forEach(function (frame) {
    if (!frame.querySelector("#" + id)) frame.hidden = true;
  });
})();
</script>
</body></html>
