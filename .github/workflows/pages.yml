# Deploy static site to GitHub Pages (repo-owned; Node 24 actions).
# Replaces GitHub's managed pages-build-deployment workflow so we can pin modern actions.
#
# INTENTIONALLY DISABLED (repo setting) while GitHub Pages is off.
# Do not re-enable this workflow until Pages is set to “GitHub Actions”:
#   Settings → Pages → Source: GitHub Actions
#   gh api -X POST repos/kanthi/mydesignlib/pages -f build_type=workflow \
#     -f 'source[branch]=main' -f 'source[path]=/'
#   gh workflow enable "Deploy GitHub Pages"
# See docs/OPERATIONS.md § “Pages paused”.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          # Entire static site at repo root (index.html, data/, library/, css/, js/)
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
